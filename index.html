<script>
/* ===== v5 ===== */
(function(){
  const MQ=window.matchMedia('(max-width:700px)');
  const RM=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};

  /* after a match, bring the next empty row into view above the tray */
  window.keepInView=function(el,tray){
    if(!MQ.matches||!el)return;
    requestAnimationFrame(()=>{
      const r=el.getBoundingClientRect();
      const trayTop=tray&&tray.getClientRects().length?tray.getBoundingClientRect().top:innerHeight;
      const limit=Math.min(trayTop,innerHeight)-10, top=12;
      let d=0;
      if(r.bottom>limit)d=r.bottom-limit;
      else if(r.top<top)d=r.top-top;
      if(Math.abs(d)>4){try{window.scrollBy({top:d,behavior:RM()?'auto':'smooth'})}catch(e){window.scrollBy(0,d)}}
    });
  };

  /* one small ⓘ per task opens the folded explanations */
  function hasFolded(q){
    return !!q.querySelector('.tag.term,.rowhead .task,.fam .rule,.lleft')||
      [...q.querySelectorAll('.terms > .task, :scope > .task')].some(t=>t.scrollHeight>t.clientHeight+2);
  }
  function decorate(){
    if(!MQ.matches)return;
    document.querySelectorAll('#panel .q').forEach(q=>{
      if(q.dataset.qi)return;
      if(!hasFolded(q))return;
      q.dataset.qi='1';
      const row=q.querySelector('.terms .trow');
      const b=h('button',{type:'button',class:'qinfo','aria-label':'Обяснение към задачата','aria-expanded':'false'},'i');
      b.addEventListener('click',e=>{e.stopPropagation();const on=q.classList.toggle('qopen');b.setAttribute('aria-expanded',on?'true':'false')});
      const k=q.querySelector(':scope > .kind');
      if(row)row.append(b);else if(k)k.append(b);else q.prepend(b);
      q.classList.add('qopen');b.setAttribute('aria-expanded','true');   // instructions start fully open; the ⓘ hides / shows them
    });
    /* a kind label that only repeats the task's own tag is noise */
    document.querySelectorAll('#panel .q > .kind:not(.dupchk)').forEach(k=>{
      k.classList.add('dupchk');
      const t=k.parentElement.querySelector('.terms .tag.strong');
      if(t&&t.textContent.trim().toLowerCase()===k.firstChild.textContent.trim().toLowerCase())k.classList.add('dup');
    });
    /* mark answered cards, so a folded rule can come back after the answer */
    document.querySelectorAll('#panel .q:not(.qdone)').forEach(q=>{
      if(q.querySelector('.gap.ok,.gap.bad,.tile.ok,.slot.done'))q.classList.add('qdone');
    });
  }
  const p=document.getElementById('panel');
  if(p){let raf=0;new MutationObserver(()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;decorate()})})
    .observe(p,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});}
  try{MQ.addEventListener('change',decorate)}catch(e){}
  decorate();
})();
</script>

    for(let t=0;t<len;t++){const i=order[(k+t)%len];if(valid(i)){setOpt('btw_'+kind,k+t+1);return i}}
    return order[k%len];
  }
  const TIPS=Object.keys(TERM).filter(k=>TERM[k].x&&TERM[k].ex);
  const KINDS=['funny','tip','motiv'];

  function card(kind,swap){
    const n=numbers();
    const c=h('div',{class:'btw '+kind+(swap?' swap':' in'),role:'note'});
    if(kind==='tip'&&TIPS.length){
      const t=TERM[TIPS[nextOf('tip',TIPS.length,()=>true)]];
      const words=String(t.ex).split(/\s+/).filter(Boolean);
      c.append(h('span',{class:'bem','aria-hidden':'true'},'💡'),h('span',{class:'blab'},'Бързо обяснение'),
        h('div',{class:'btxt'},h('div',{class:'bterm'},t.bg+' ',h('i',null,'('+t.en+')')),t.x),
        h('div',{class:'bex',lang:'en'},words.map((w,i)=>{const s=h('span',{class:'w'},w);s.style.setProperty('--i',i);return s}),
          typeof spkBtn==='function'?spkBtn(t.ex):null));
    }else{
      const list=kind==='motiv'?MOTIV:FUNNY;
      const [em,txt]=list[nextOf(kind,list.length,i=>okFor(list[i][2],n))];
      c.append(h('span',{class:'bem','aria-hidden':'true'},em),h('span',{class:'blab'},kind==='motiv'?'Мотивация':'Между другото'),
        h('div',{class:'btxt',html:fill(txt,n)}));
    }
    const foot=h('div',{class:'bfoot'},
      kind==='tip'?h('button',{type:'button',class:'bmore',onclick:()=>{S.tab='gram';save();renderTabs();renderPanel();try{scrollTo(0,0)}catch(e){}}},'Всички обяснения →'):h('span'),
      h('button',{type:'button',class:'bnext','aria-label':'Покажи друго'},'↻ Още едно'));
    c.append(foot);
    foot.lastChild.addEventListener('click',()=>{const k=nextKind();const nc=card(k,true);c.replaceWith(nc)});
    return c;
  }
  function nextKind(){const i=opt('btwKind',0);setOpt('btwKind',i+1);return KINDS[i%KINDS.length]}

  function addCard(host){
    const dc=host&&host.querySelector('.done-card');if(!dc||dc.querySelector('.btw'))return;
    const c=card(nextKind(),false);
    const anchor=dc.querySelector('.dchips');
    if(anchor)anchor.after(c);else dc.querySelector('.big,.acc')?dc.querySelector('.acc,.big').after(c):dc.append(c);
  }
  const _rd=roundDone;roundDone=function(host){const r=_rd.apply(this,arguments);try{addCard(host)}catch(e){}return r};
  const _rdd=redoDone;redoDone=function(host){const r=_rdd.apply(this,arguments);try{addCard(host)}catch(e){}return r};
  window.__btwCard=card;
})();
</script>

(function(){
  if(typeof say!=='function')return;
  /* ---- the chosen voice goes first; the next one is still used for person B in dialogues ---- */
  const UKUS=v=>/^en[-_](GB|US)$/i.test(v.lang);
  function prefVoice(){if(TTS.v.some(UKUS))TTS.v=TTS.v.filter(UKUS);const n=opt('voice','');if(!n||!TTS.v.length)return;const i=TTS.v.findIndex(v=>v.name===n);if(i>0){const x=TTS.v.splice(i,1)[0];TTS.v.unshift(x)}}
  document.addEventListener('ttsvoices',prefVoice);prefVoice();
  /* ---- slow mode: word by word, a short pause between words and a longer one at commas and full stops ---- */
  const _say=say;
  say=function(text,o){
    o=o||{};prefVoice();
    if(!o.slow)return _say(text,o);
    if(!TTS.ok)return false;const t=ttsClean(text);if(!t)return false;
    ttsStop();const g=TTS.gen;const btn=o.btn||null;if(btn){btn.classList.add('on');TTS.btn=btn}
    const two=TTS.v.length>1;const v=TTS.v[o.voice&&two?1:0];
    const words=t.split(/\s+/).filter(Boolean);let k=0;
    const done=()=>{if(g!==TTS.gen)return;if(btn){btn.classList.remove('on');if(TTS.btn===btn)TTS.btn=null}o.onend&&o.onend()};
    const nx=()=>{if(g!==TTS.gen)return;if(k>=words.length){done();return}
      const w=words[k++];const u=new SpeechSynthesisUtterance(w.replace(/[.,!?;:…"”“()]+/g,'')||w);
      if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';
      u.rate=0.72;u.pitch=o.voice&&!two?1.35:1;
      const gap=/[.!?…]["”')]*$/.test(w)?800:/[,;:]$/.test(w)?550:330;
      let fired=false;const go=()=>{if(fired)return;fired=true;setTimeout(nx,gap)};
      u.onend=go;u.onerror=()=>{if(g===TTS.gen)go()};
      try{speechSynthesis.resume()}catch(e){}
      try{speechSynthesis.speak(u)}catch(e){done()}};
    setTimeout(nx,60);return true;
  };
  const nWords=t=>String(t||'').trim().split(/\s+/).filter(x=>/[A-Za-z]/.test(x)).length;
  function slowBtn(getText,o){
    const b=h('button',{class:'spk slw',type:'button','aria-label':'Чуй бавно, дума по дума',title:'Бавно'});
    b.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();if(b.classList.contains('on')){ttsStop();return}
      say(typeof getText==='function'?getText():getText,Object.assign({},o||{},{btn:b,slow:true}))});
    b.addEventListener('keydown',e=>e.stopPropagation());
    return b;
  }
  /* 🔊 + 🐢 for anything longer than one word */
  const _spk=spkBtn;
  spkBtn=function(getText,o){
    const b=_spk(getText,o);
    let t='';try{t=typeof getText==='function'?getText():getText}catch(e){}
    if(nWords(t)<2)return b;
    return h('span',{class:'spkw'},b,slowBtn(getText,o));
  };
  /* listening tasks: a "🐢 Бавно" button next to the big play button */
  if(typeof lPlayer==='function'){
    const _lp=lPlayer;
    lPlayer=function(q,getText,o){
      const api=_lp(q,getText,o);
      try{const boxes=q.querySelectorAll('.lbox');const box=boxes[boxes.length-1];
        if(box&&!box.querySelector('.lslow')){
          const s=h('button',{class:'lslow',type:'button','aria-label':'Чуй бавно, дума по дума'},'🐢 Бавно');
          s.addEventListener('click',e=>{e.stopPropagation();if(s.classList.contains('on')){ttsStop();return}
            say(getText(),Object.assign({},o||{},{btn:s,slow:true}))});
          box.append(s)}}catch(e){}
      return api;
    };
  }
  /* ---- Аз → Глас: choose the voice ---- */
  const _gp=gProgPlus;
  gProgPlus=function(p){
    _gp(p);
    if(!TTS.ok)return;
    const sel=h('select',{id:'voiceSel','aria-label':'Глас'});
    const fill=()=>{
      const cur=opt('voice','');prefVoice();const list=TTS.v.filter(UKUS);
      sel.replaceChildren(
        ...list.map(v=>{const acc=/GB/i.test(v.lang)?'🇬🇧 Британски':'🇺🇸 Американски';const g=/female|woman/i.test(v.name)?' · женски':/male|man\b/i.test(v.name)?' · мъжки':'';const nm=v.name.replace(/^(Google|Microsoft|Apple)\s+/,'').replace(/^English\s+(United Kingdom|United States)\s*/i,'');const o=h('option',{value:v.name},`${acc}${g}${nm?' · '+nm:''}`);if(v.name===cur)o.selected=true;return o}));
      if(!list.length)sel.append(h('option',{value:'',disabled:true},'Няма британски или американски глас на устройството'));
      if(!list.some(v=>v.name===cur)&&list[0])sel.value=list[0].name;
    };
    fill();document.addEventListener('ttsvoices',()=>{if(sel.isConnected)fill()});
    sel.addEventListener('change',()=>{setOpt('voice',sel.value);ttsLoad();prefVoice();say('Hello! Nice to meet you. How are you today?')});
    const test=h('button',{class:'btn alt',type:'button'},'▶ Пробвай');
    test.addEventListener('click',e=>say('Hello! Nice to meet you. How are you today?',{btn:e.currentTarget}));
    const slow=h('button',{class:'btn alt',type:'button'},'🐢 Бавно');
    slow.addEventListener('click',e=>say('Hello! Nice to meet you. How are you today?',{btn:e.currentTarget,slow:true}));
    const sec=h('section',{class:'sect'},h('h3',null,'Глас'),
      h('p',{class:'muted'},'Изберете британски или американски глас. Бутонът 🐢 до изреченията чете бавно, дума по дума.'),
      h('div',{class:'vpick'},sel,test,slow));
    const first=p.querySelector('.bksect')||p.querySelector('.rsect');
    p.insertBefore(sec,first||null);
  };
})();

<script>
(function(){
  const $p=()=>document.getElementById('panel');
  const learnedN=()=>Object.values(S.w||{}).filter(x=>x>=2).length;

  /* ================= 3. comeback after 2+ missed days ================= */
  window.__comeback=function(){
    const t=today(),last=lastOf('today');
    if(last&&last.d===t)return false;                    // today's first round is already done
    const prev=Object.keys(S.days||{}).filter(d=>d<t&&S.days[d]>0).sort().pop();
    if(!prev)return false;                               // a brand-new learner is not "coming back"
    return tnum()-dnum(prev)>=3;                         // two or more empty days in between
  };

  /* ================= 5. "Без писане": never ask to type ================= */
  const _opt=opt;
  opt=function(k,d){if(k==='mixTy'&&_opt('noType',true))return false;return _opt(k,d)};
  const hideTypeSw=()=>{if(!opt('noType',true))return;const cb=document.getElementById('mixTy');if(cb){const l=cb.closest('label');if(l)l.remove()}};

  /* ================= 10. "Вече можете да кажете…" ================= */
  const MS=[25,50,100,150,200,300,400,500,600,700,800,900,1000,1100,1200,1336];
  const FUN=new Set("a an the i you he she it we they me him her us them my your his its our their is am are was were be do does did not to of in on at and this that there here what who where how can 's n't 'm 're 'll".split(' '));
  const fillAll=t=>t.replace(/\{([^}]*)\}/g,(m,g)=>g.split(';')[0]).replace(/\s*—\s*/g,' ').replace(/\s+([,.!?])/g,'$1').replace(/\s+/g,' ').trim();
  const splitS=t=>(String(t).match(/[^.!?]+[.!?]+/g)||[]).map(x=>x.trim()).filter(Boolean);
  let BANK=null;
  function bank(){
    if(BANK)return BANK;const raw=[],seen=new Set();
    const add=(en,bg)=>{const E=splitS(en),B=splitS(bg);if(!E.length)return;
      const pairs=E.length===B.length?E.map((e,i)=>[e,B[i]]):E.length===1?[[E[0],bg]]:[];
      pairs.forEach(([e,b])=>{e=e.replace(/^[–—-]\s*/,'');b=String(b).replace(/^[–—-]\s*/,'');const n=e.split(/\s+/).length;if(n<3||n>9||seen.has(e)||/_{2,}|\{/.test(e)||/^(yes|no|oh|well|ok)\b/i.test(e)||b.length<8)return;seen.add(e);raw.push({en:e,bg:b})})};
    try{DATA.F.forEach(f=>{if(f[2]&&f[2].includes('___')&&f[3]&&f[5])add(f[2].replace('___',f[3]),f[5])})}catch(e){}
    try{DATA.TR.forEach(t=>{if(t[4]&&t[6])add(t[4],t[6])})}catch(e){}
    try{DATA.G.forEach(g=>g.x.forEach(x=>{if(x[1]&&x[2])add(fillAll(x[1]),x[2])}))}catch(e){}
    try{DATA.M.forEach(m=>{if(m[2]&&m[3])add(fillAll(m[2]),m[3])})}catch(e){}
    const toks=x=>{x=x.toLowerCase().replace(/’/g,"'").replace(/n't\b/g," n't").replace(/'(s|m|re|ll|ve|d)\b/g," '$1");return x.match(/[a-z]+|'[a-z]+|n't/g)||[]};
    raw.forEach(r=>r.t=toks(r.en));BANK=raw;return BANK;
  }
  function knownTok(tok,L){
    if(L.has(tok)||FUN.has(tok))return true;
    for(const [s,r] of [['ies','y'],['es',''],['s',''],['ed',''],['ed','e'],['d',''],['ing',''],['ing','e']])
      if(tok.endsWith(s)&&L.has(tok.slice(0,-s.length)+r))return true;
    return false;
  }
  /* three sentences the learner can now say; if there are too few, ones that need only one new word */
  function canSay(n){
    const L=new Set(Object.keys(S.w||{}).filter(w=>S.w[w]>=2).map(w=>w.toLowerCase()));
    const full=[],near=[];
    bank().forEach(r=>{let miss=[],lw=0;for(const t of r.t){if(knownTok(t,L)){if(!FUN.has(t))lw++}else miss.push(t)}
      if(!miss.length&&lw>=1)full.push(Object.assign({lw},r));else if(miss.length===1&&lw>=1)near.push(Object.assign({lw,miss:miss[0]},r))});
    const pick=(a,k)=>shuffle(a.sort((x,y)=>y.lw-x.lw).slice(0,30)).slice(0,k);
    const out=pick(full,n);if(out.length<n)out.push(...pick(near,n-out.length));return out;
  }
  const glossOf=w=>{const v=(byEn&&(byEn[w]||byEn[w.replace(/s$/,'')]))||null;return v&&v[0]?v[0].bg:''};
  function msCard(m,onMore){
    const ss=canSay(3);
    const next=MS.find(x=>x>learnedN());
    const list=h('ul',{class:'msl'},ss.map(r=>h('li',null,
      h('span',{class:'me',lang:'en'},r.en,typeof spkBtn==='function'?spkBtn(r.en):null),
      h('span',{class:'mb'},r.bg),

  /* ================= 14. phrase packs ================= */
  const PH=[
    {id:'air',i:'✈️',t:'Летище',p:[

      ['Can I have another towel, please?','Може ли още една кърпа, моля?'],['Can you call a taxi for me?','Можете ли да ми повикате такси?'],

      ['Can we have the bill, please?','Може ли сметката, моля?'],['Can I pay by card?','Мога ли да платя с карта?']]},
    {id:'shp',i:'🛍️',t:'Магазин',p:[

      ['Do you have this in a bigger size?','Имате ли това в по-голям размер?'],['Can I try it on?','Може ли да го пробвам?'],
      ['Where are the changing rooms?','Къде са пробните?'],["It's too expensive.",'Твърде скъпо е.'],

      ['I need a doctor.','Трябва ми лекар.'],["I'm allergic to penicillin.",'Алергичен/алергична съм към пеницилин.'],
      ['I take this medicine every day.','Пия това лекарство всеки ден.'],['How many times a day?','Колко пъти на ден?'],
      ['Do I need a prescription?','Трябва ли ми рецепта?'],['Where is the nearest pharmacy?','Къде е най-близката аптека?']]},
    {id:'way',i:'🚌',t:'Път и транспорт',p:[
      ['Excuse me, where is the train station?','Извинете, къде е гарата?'],['How do I get to the city centre?','Как да стигна до центъра?'],
      ['Is it far from here?','Далеч ли е оттук?'],['Go straight on, then turn left.','Вървете направо, после завийте наляво.'],

      ["I don't understand.",'Не разбирам.'],['Can you speak more slowly, please?','Можете ли да говорите по-бавно, моля?']]}
  ];
  window.PHRASES=PH;
  const pk=(P,i)=>P.id+'|'+i;
  const phN=(P,i)=>(S.ph&&S.ph[pk(P,i)])||0;
  const phLearned=P=>P.p.filter((_,i)=>phN(P,i)>=2).length;
  const phMark=(P,i,ok)=>{S.ph=S.ph||{};const k=pk(P,i);S.ph[k]=Math.max(-2,Math.min(4,(S.ph[k]||0)+(ok?1:-1)))};

  window.gPhr=function(p){

    p.append(h('div',{class:'phgrid'},PH.map(P=>{const n=phLearned(P);
      return h('button',{type:'button',class:'phcard',onclick:()=>{p.replaceChildren(back('Всички фрази',()=>{p.replaceChildren();gPhr(p);goTop()}));phPack(p,P);goTop()}},
        h('span',{class:'pi','aria-hidden':'true'},P.i),h('b',null,P.t),
        h('span',{class:'ps'},n?`${n} от ${P.p.length} научени`:`${P.p.length} фрази`),

  };

    p.append(h('div',{class:'phhead'},h('span',{class:'pi','aria-hidden':'true'},P.i),h('div',null,h('h2',{style:'font-family:var(--f-display);font-weight:500;font-size:20px'},P.t),
      h('div',{class:'ps',style:'font-size:13px;color:var(--muted)'},`${phLearned(P)} от ${P.p.length} научени · натиснете 🔊 или 🐢, за да чуете`))));
    p.append(h('div',{class:'phbar'},h('button',{class:'btn rose',type:'button',onclick:()=>{p.replaceChildren(back(P.t,()=>{p.replaceChildren(back('Всички фрази',()=>{p.replaceChildren();gPhr(p);goTop()}));phPack(p,P);goTop()}));phQuiz(p,P);goTop()}},'▶ Упражнявай · 10 задачи')));

  function phQuiz(p,P){

        shuffle(words.map((w,j)=>[w,j])).forEach(([w])=>{const t=h('button',{class:'tile',type:'button',lang:'en'},w);

          line.classList.add(ok?'ok':'bad');line.querySelectorAll('.tile').forEach(x=>x.disabled=true);pool.querySelectorAll('.tile').forEach(x=>x.disabled=true);done(ok)}
        const idk=h('button',{class:'btn idk',type:'button'},'Не знам');idk.onclick=()=>{if(fin)return;fin=true;idk.remove();line.classList.add('bad');pool.querySelectorAll('.tile').forEach(x=>x.disabled=true);done(false)};
        q.append(line,pool,idk);
      }
    }
    draw();
  }

  /* ================= Аз: "Лесно използване" + "Какво вече можете да кажете" ================= */
  const _gp=gProgPlus;
  gProgPlus=function(p){
    _gp(p);
    const easy=h('section',{class:'sect'},h('h3',null,'Лесно използване'),
      h('div',{class:'opts',style:'flex-direction:column;align-items:flex-start;gap:12px'},

<script>
(function(){
  const $p=()=>document.getElementById('panel');
  /* every task knows its mistake key */
  const _so=specOf;
  specOf=function(k){const sp=_so(k);if(sp&&typeof sp==='object'&&!sp._k)sp._k=k;return sp};
  function keyOf(sp){
    if(!sp)return null;if(sp._k)return sp._k;
    switch(sp.k){
      case 'word':return sp.w;case 'fill':return '§F'+sp.i;case 'fam':return '§W'+sp.i+'|'+sp.j;case 'trans':return '§T'+sp.i;case 'multi':return '§M'+sp.i;
      case 'syn':return sp.x?'§Y'+sp.x.join('|'):null;case 'dlg':return DATA.G[sp.i]?'§G'+DATA.G[sp.i].id:null;
      case 'det':return '§K'+sp.c+'|'+sp.q;case 'tour':return '§O'+sp.c+'|'+sp.s;
    }return null;
  }
  const openMiss=()=>Object.keys(S.miss||{}).filter(k=>specOf(k));

  /* ================= D11: one line on why, when a mistake comes back ================= */
  const MCAT={prep:'предлозите (in, on, at…)',voc:'значението на думата в изречението',art:'членовете a / an / the',wf:'формата на думата',pron:'местоименията (I, me, my…)',
    aux:'спомагателните глаголи (do, does, is…)',past:'миналото време',modal:'модалните глаголи (can, must, should…)',comp:'сравненията (bigger, the biggest)',
    inf:'to + глагол или -ing',be:'глагола be (am / is / are)',pres:'сегашното време (-s при he / she / it)',det:'some / any / much / many',conj:'съюзите (and, but, because…)',
    freq:'мястото на always, often, never…',poss:'притежанието (my, mine, ’s)',qw:'въпросителните думи'};
  function hintText(sp){
    try{
      switch(sp.k){
        case 'word':{const w=sp.w;return `Думата започва с „${w[0]}…" и има ${w.replace(/\s/g,'').length} букви.`}
        case 'fill':{const f=DATA.F[sp.i];const tip=f[6]||'';if(tip&&!tip.toLowerCase().includes(String(f[3]).toLowerCase()))return tip;return `Преводът ще ви помогне: ${f[5]}`}
        case 'fam':{const it=DATA.W[sp.i].i[sp.j];return `Тук е нужно ${it[1]}.`}
        case 'trans':{const t=DATA.TR[sp.i];return t[7]||'Внимавайте с реда на думите и формата на глагола.'}
        case 'multi':{const m=DATA.M[sp.i];return m[4]||('Внимавайте с '+(MCAT[m[1]]||'граматиката')+'.')}
        case 'syn':return sp.x&&sp.x[3]==='ant'?'Търсите дума с противоположно значение.':'Търсите дума със същото значение.';
        case 'dlg':return 'Прочетете целия диалог, преди да изберете – отговорът зависи от смисъла.';
        case 'ln':return (typeof LNT==='object'&&LNT[sp.t])||'Слушайте внимателно числата.';
        case 'lm':return 'Двете думи звучат почти еднакво – слушайте гласната в средата.';
        case 'lp':case 'ld':case 'lf':return 'Натиснете 🐢 Бавно и слушайте дума по дума.';
        case 'det':return 'Прочетете отново досието – отговорът е в текста.';
        case 'tour':return 'Погледнете картата още веднъж, преди да отговорите.';
      }
    }catch(e){}
    return 'Не бързайте – този път ще стане.';
  }
  window.mistakeHint=function(sp,q){
    const k=keyOf(sp);if(!k||!S.miss||!S.miss[k])return;
    q.append(h('div',{class:'mhint'},h('b',null,'💡 Миналия път:'),h('span',null,hintText(sp))));
  };

  /* ================= counting fixes, the clean-up moment, the Sunday challenge ================= */
  const isSun=()=>new Date().getDay()===0;
  function wchState(){
    if(!isSun())return null;
    if(!S.wch||S.wch.d!==today()){const n=openMiss().length;S.wch={d:today(),T:Math.min(10,n),n:0,k:{},got:0};save()}
    return S.wch.T?S.wch:null;
  }
  const _sm=srMark;
  srMark=function(k,ok){
    const had=!!(S.miss&&S.miss[k]);const before=openMiss().length;
    const r=_sm.apply(this,arguments);
    if(had&&ok){
      const W=wchState();
      if(W&&!W.got&&!W.k[k]){W.k[k]=1;W.n++;if(W.n>=W.T){W.got=1;S.fzb=(+S.fzb||0)+1;
        setTimeout(()=>{try{toast('❄️ +1 замразяване! Неделното предизвикателство е изпълнено.');renderStats()}catch(e){}},700)}}
      if(!S.miss[k]){S.fixd=S.fixd||{};const t=today();S.fixd[t]=(S.fixd[t]||0)+1;
        const ks=Object.keys(S.fixd).sort();if(ks.length>60)ks.slice(0,ks.length-60).forEach(d=>delete S.fixd[d]);
        if(before>0&&openMiss().length===0)setTimeout(cleanParty,900)}
    }
    if(!ok){const n=openMiss().length;if(n>(S.mmax||0))S.mmax=n}
    return r;
  };
  function cleanParty(){
    if(document.querySelector('.cleanov'))return;
    const ov=h('div',{class:'cleanov',role:'dialog','aria-label':'Чисто'},h('div',{class:'cc'},h('span',{class:'cb','aria-hidden':'true'},'🧹'),
      h('h3',null,'Чисто!'),h('p',null,'Поправихте всички грешки. Браво!'),h('button',{class:'btn rose',type:'button',style:'margin-top:14px'},'Супер')));
    const close=()=>{ov.remove()};ov.addEventListener('click',close);document.body.append(ov);
    try{sfx('ding');buzz([20,40,20,40,60])}catch(e){}
    setTimeout(()=>{if(ov.isConnected)close()},4500);
    S.mmax=0;save();
  }
  const weekFixed=()=>{const w=wk(tnum());return Object.keys(S.fixd||{}).filter(d=>{try{return wk(dnum(d))===w}catch(e){return false}}).reduce((a,d)=>a+S.fixd[d],0)};

  /* start a short round of old mistakes (worst first, mixed a little) */
  function startMistakes(n){
    const ks=openMiss().sort((a,b)=>S.miss[b]-S.miss[a]);
    const pick=shuffle(ks.slice(0,Math.max(n,Math.min(ks.length,20)))).slice(0,n).map(specOf).filter(Boolean);
    if(!pick.length)return;
    S.tab='miss';save();renderTabs();renderPanel();
    const area=$p().querySelector('.mwrap');if(!area)return;
    try{window.scrollTo({top:0,behavior:'auto'})}catch(e){}
    startQuiz(area,'miss',pick,renderPanel);
  }
  /* C7: the pile of mistakes that visibly empties */
  function pile(compact){
    const n=openMiss().length;const wf=weekFixed();
    if(!n&&!wf)return null;
    const max=Math.max(n,S.mmax||0,1);S.mmax=max;
    const shown=Math.min(40,max),red=Math.round(shown*n/max);
    const blocks=h('div',{class:'blocks','aria-hidden':'true'},Array.from({length:shown},(_,i)=>h('i',{class:i<red?'':'gone'})));
    if(!n)return h('div',{class:'mpile clean'},h('div',{class:'mph'},h('span',{class:'mpi','aria-hidden':'true'},'🧹'),
      h('div',{class:'mpt'},h('b',null,'Чисто! Няма грешки за поправяне.'),h('span',null,`Поправени тази седмица: ${wf}`))));
    return h('div',{class:'mpile'},h('div',{class:'mph'},h('span',{class:'mpi','aria-hidden':'true'},'🧺'),
      h('div',{class:'mpt'},h('b',null,n===1?'1 грешка чака поправка':`${n} грешки чакат поправка`),
        h('span',null,(wf?`Поправени тази седмица: ${wf}. `:'')+'Всяка се маха, като я решите вярно в два различни дни.')),
      compact?h('button',{class:'mpgo',type:'button',onclick:()=>startMistakes(Math.min(8,n))},'Поправи'):null),blocks);
  }
  /* C10: Sunday challenge */
  function wchCard(){
    const W=wchState();if(!W)return null;
    const left=Math.max(0,W.T-W.n);
    return h('div',{class:'wch'+(W.got?' done':'')},h('span',{class:'wi','aria-hidden':'true'},W.got?'✅':'🏆'),
      h('div',{class:'wt'},h('b',null,W.got?'Неделното предизвикателство е изпълнено!':'Неделно предизвикателство'),
        h('span',null,W.got?'Спечелихте ❄️ замразяване – то пази поредицата ви, ако пропуснете ден.':`Отговорете вярно на ${W.T} стари ${W.T===1?'грешка':'грешки'} днес и спечелете ❄️ замразяване. Остават ${left}.`),
        h('div',{class:'prog'},h('i',{style:`width:${100*Math.min(W.n,W.T)/W.T}%`}))),
      W.got?null:h('button',{type:'button',onclick:()=>startMistakes(Math.min(12,Math.max(W.T-W.n+2,6)))},'Започни'));
  }
  const _rp=renderPanel;
  renderPanel=function(){
    _rp.apply(this,arguments);
    try{
      if(S.tab==='today'&&!(S.run&&S.run.today)){
        const a=$p().querySelector('.today');if(!a)return;
        const anchor=a.querySelector('.tparts')||a.querySelector('.tstart');
        const extra=[wchCard(),pile(true)].filter(Boolean);
        if(anchor&&extra.length){let ref=anchor.nextSibling;if(ref&&ref.classList&&ref.classList.contains('tdone'))ref=ref.nextSibling;extra.forEach(x=>a.insertBefore(x,ref))}
      }else if(S.tab==='miss'&&!(S.run&&S.run.miss)){
        const area=$p().querySelector('.mwrap');if(!area)return;
        const extra=[wchCard(),pile(false)].filter(Boolean);extra.reverse().forEach(x=>area.prepend(x));
      }
    }catch(e){}
  };
})();
</script>

<script>
(function(){
  const SZ=[['n','Нормален','Аа',16],['l','Голям','Аа',19],['xl','Много голям','Аа',22]];
  function applySize(){const v=opt('tsize','n');if(v==='n')document.documentElement.removeAttribute('data-tsize');else document.documentElement.setAttribute('data-tsize',v)}
  applySize();
  const _gp=gProgPlus;
  gProgPlus=function(p){
    _gp(p);
    const cur=opt('tsize','n');
    const row=h('div',{class:'tsz',role:'group','aria-label':'Размер на текста'},SZ.map(([k,lb,aa,px])=>
      h('button',{type:'button','aria-pressed':cur===k?'true':'false',onclick:()=>{setOpt('tsize',k);applySize();renderAll();
        try{const s=document.getElementById('tsizeSec');s&&s.scrollIntoView({block:'center'})}catch(e){}}},
        h('span',{style:`font-size:${px}px`},aa),h('small',null,lb))));
    const sec=h('section',{class:'sect',id:'tsizeSec'},h('h3',null,'Размер на текста'),
      h('p',{class:'muted'},'Уголемява всичко в програмата – текста, бутоните, блокчетата и картите.'),row);
    const ph=p.querySelector('.phead');let ref=ph?ph.nextSibling:p.firstChild;
    while(ref&&ref.classList&&ref.classList.contains('how'))ref=ref.nextSibling;
    p.insertBefore(sec,ref||null);
  };
})();
</script>
<script>
/* v21: a Днес round saved by an older version may still hold Детектив / Турист tasks – drop the ones not answered yet */
(function(){try{
  const R=S.run&&S.run.today;if(!R||R.kind!=='quiz'||!Array.isArray(R.items))return;
  const items=[],res=[];let cut=0;
  R.items.forEach((sp,i)=>{const done=R.res[i]!=null;if(!done&&sp&&(sp.k==='det'||sp.k==='tour')){cut++;return}items.push(sp);if(done)res[items.length-1]=R.res[i]});
  if(!cut)return;
  if(!items.length){delete S.run.today}else{R.items=items;R.res=res}
  save();if(S.tab==='today')renderAll();
}catch(e){}})();
</script>

  /* =============== 3. perfect rounds =============== */
  const _ls=logSession;
  logSession=function(g,c,n,retry){

  /* ================= 14. Бай Ганьо reacts to the result of a round ================= */
  const L3=['Браво бе! Чак хоро ще ти играя!','Ха така! Цяла Европа да ни гледа!','Перфектно бе! Аз съм горд!'],

          st<2?h('span',{class:'shr','aria-hidden':'true'},'🤷'):null,h('div',{class:'dbs'},pick(st===3?L3:st===2?L2:st===1?L1:L0)));

      },250)}}}).observe($p(),{childList:true,subtree:true});

  const PREP_SVG=(()=>{
    const box=(x,y,open)=>`<g><path d="M${x} ${y} h34 v26 h-34z" fill="#C8955F" stroke="#7A4E2A" stroke-width="2"/>${open?`<path d="M${x} ${y} l6 -7 h34 l-6 7z" fill="#E0B07A" stroke="#7A4E2A" stroke-width="2"/>`:`<path d="M${x} ${y} l6 -7 h34 l-6 7z M${x+34} ${y} l6 -7 v26 l-6 7z" fill="#D9A46C" stroke="#7A4E2A" stroke-width="2"/>`}</g>`;
    const ball=(x,y)=>`<circle cx="${x}" cy="${y}" r="8" fill="#E5484D" stroke="#9E2A2F" stroke-width="2"/><path d="M${x-4} ${y-4} q3 -2 6 0" stroke="#fff" stroke-width="1.6" fill="none" opacity=".8"/>`;
    const table=(x,y)=>`<g><rect x="${x}" y="${y}" width="56" height="7" rx="2" fill="#8B5A33"/><rect x="${x+4}" y="${y+7}" width="5" height="26" fill="#7A4E2A"/><rect x="${x+47}" y="${y+7}" width="5" height="26" fill="#7A4E2A"/></g>`;
    const cell=(i,draw,en,bg)=>{const cx=(i%4)*80,cy=Math.floor(i/4)*104;return `<g transform="translate(${cx} ${cy})"><rect x="3" y="3" width="74" height="98" rx="12" fill="var(--surface)" stroke="var(--line)"/>${draw}
      <text x="40" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="var(--rose)">${en}</text><text x="40" y="96" text-anchor="middle" font-size="11" fill="var(--muted)">${bg}</text></g>`};
    const cells=[
      [`<path d="M20 40 l6 -7 h34 l-6 7z" fill="#B07A44" stroke="#7A4E2A" stroke-width="2"/><path d="M54 40 l6 -7 v26 l-6 7z" fill="#D9A46C" stroke="#7A4E2A" stroke-width="2"/>${ball(38,40)}<path d="M20 44 h34 v22 h-34z" fill="#C8955F" stroke="#7A4E2A" stroke-width="2"/><path d="M20 44 h34" stroke="#7A4E2A" stroke-width="2"/>`,'in','в (вътре)'],
      [`${table(12,48)}${ball(40,40)}`,'on','на (върху)'],
      [`${table(12,30)}${ball(40,58)}`,'under','под'],
      [`${box(14,40)}${ball(62,58)}`,'next to','до (точно до)'],
      [`${ball(58,38)}${box(14,44)}`,'behind','зад'],
      [`<path d="M8 46 h18 v20 h-18z M8 46 l4 -5 h18 l-4 5z M26 46 l4 -5 v20 l-4 5z" fill="#C8955F" stroke="#7A4E2A" stroke-width="2"/><path d="M50 46 h18 v20 h-18z M50 46 l4 -5 h18 l-4 5z M68 46 l4 -5 v20 l-4 5z" fill="#C8955F" stroke="#7A4E2A" stroke-width="2"/>${ball(39,58)}`,'between','между'],
      [`${box(10,40)}${ball(66,58)}<path d="M50 62 q8 -6 8 0" stroke="var(--muted)" stroke-dasharray="2 3" fill="none"/>`,'near','близо до'],
      [`<text x="40" y="58" text-anchor="middle" font-size="38">🏠</text><text x="58" y="66" text-anchor="middle" font-size="18">🧍</text>`,'at home','у дома']];
    return `<svg viewBox="0 0 320 208" xmlns="http://www.w3.org/2000/svg" class="prepsvg" role="img" aria-label="Предлози за място">${cells.map((c,i)=>cell(i,c[0],c[1],c[2])).join('')}</svg>`;
  })();
  const GRC={
    'F:poss':[['Моят, твоят, неговият…',`<table class="gtab"><tr><th>кой</th><th>чий</th><th>пример</th></tr>
      <tr><td>I – аз</td><td><b>my</b> – мой</td><td>my book – книгата ми</td></tr><tr><td>you – ти</td><td><b>your</b> – твой</td><td>your name – името ти</td></tr>
      <tr><td>he – той</td><td><b>his</b> – негов</td><td>his car – колата му</td></tr><tr><td>she – тя</td><td><b>her</b> – неин</td><td>her house – къщата ѝ</td></tr>
      <tr><td>we – ние</td><td><b>our</b> – наш</td><td>our dog – кучето ни</td></tr><tr><td>they – те</td><td><b>their</b> – техен</td><td>their child – детето им</td></tr></table>
      <ul class="gl"><li>Стои <b>пред</b> думата: <i>my house</i>, никога <i>house my</i>.</li><li><b>Не се мени</b> по род и число: <i>my brother, my sister, my friends</i> – винаги <i>my</i>.</li>
      <li>След нея <b>няма член</b>: <i>my house</i> = къщата ми (не <i>my the house</i>).</li><li><b>me</b> = мен, ме, ми: <i>Help me!</i> – Помогни ми!</li></ul>`]],
    'F:be':[['Глаголът „съм" – to be',`<table class="gtab"><tr><th></th><th>✔ да</th><th>✖ не</th><th>❓ въпрос</th></tr>
      <tr><td>I</td><td>I <b>am</b></td><td>I am <b>not</b></td><td><b>Am</b> I…?</td></tr><tr><td>you / we / they</td><td>you <b>are</b></td><td>you are <b>not</b></td><td><b>Are</b> you…?</td></tr>
      <tr><td>he / she / it</td><td>he <b>is</b></td><td>he is <b>not</b></td><td><b>Is</b> he…?</td></tr></table>
      <ul class="gl"><li>„Не" е <b>след</b> am / is / are: <i>I am not tired.</i> – Не съм уморен.</li><li>Въпрос: am / is / are отива <b>най-отпред</b>: <i>Is she a doctor?</i></li>
      <li>В английски винаги има кой: „Студено е" е <i><b>It</b> is cold.</i> – не само <i>Is cold.</i></li><li>Възрастта е със „съм": <i>I am 30.</i> – На 30 съм.</li>
      <li>Кратко: <i>I'm, you're, he's, isn't, aren't</i>.</li></ul>`]],
    'F:place':[['Къде е топката?',PREP_SVG+`<ul class="gl"><li>Предлогът стои <b>пред</b> мястото: <i>on the table</i> – на масата.</li>
      <li><b>in</b> = вътре в нещо, <b>on</b> = отгоре върху нещо.</li><li><b>at</b> за точка или място, където се прави нещо: <i>at home</i> – у дома, <i>at work</i> – на работа.</li></ul>`]],
    'F:help':[['do / does – помощникът за въпроси',`<div class="gform">❓ <b>Do / Does</b> + кой + глагол …?</div><p class="gex"><i>Do you like tea?</i> – Обичаш ли чай?<br><i>Does she work here?</i> – Тя тук ли работи?</p>
      <div class="gform">✖ кой + <b>do not (don't) / does not (doesn't)</b> + глагол</div><p class="gex"><i>I don't know.</i> – Не знам.<br><i>He doesn't drink milk.</i> – Той не пие мляко.</p>
      <ul class="gl"><li>⚠ В български само сменяме гласа: „Обичаш ли чай?" В английски въпросът <b>започва с Do</b>.</li><li>⚠ <b>does</b> е за he / she / it, а след него глаголът е <b>без -s</b>: <i>Does she work?</i> – не <i>Does she works?</i></li>
      <li>⚠ С am / is / are и с can <b>не</b> се слага do: <i>Are you…? Can you…?</i></li></ul>`],
      ['can – мога',`<div class="gform">✔ кой + <b>can</b> + глагол</div><p class="gex"><i>I can swim.</i> – Мога да плувам.</p>

          const b=nb.querySelector('.tsw b'),sp=nb.querySelector('.tsw span');const nx=nextL();
          if(b)b.textContent=doneN()?'Продължи':'Започни';

          a.querySelectorAll('.tparts,.tdone,.cback').forEach(x=>x.remove());

          const tl=[...a.querySelectorAll(':scope > .sect .tlist')].pop();
          if(tl&&!tl.querySelector('.freeround'))tl.prepend(h('button',{type:'button',class:'tlink freeround',onclick:()=>st.click()},h('span',{class:'li'},'🎯'),h('span',{class:'lt'},h('b',null,'Свободен рунд'),h('span',null,'30 задачи')),h('span',{class:'la'},'›')))}
      }
      if(S.tab==='games'){
        $p().querySelectorAll('.gmcard').forEach(c=>{const t=(c.querySelector('b')||{}).textContent||'';
          const u=UNL.find(x=>['mix','det','tour'].includes(x[0])&&x[2]===t);if(u&&!isOpen(u[0])){c.classList.add('locked');c.disabled=true;

    }catch(e){}
  };

<script>
/* ===== v45: a lighter interface ===== */
(function(){
  const $p=()=>document.getElementById('panel');
  /* 💡 the explanations window, from any screen */
  const fab=h('button',{type:'button',class:'gfab','aria-label':'Бързи обяснения','aria-expanded':'false',title:'Бързи обяснения'},'💡');
  let pop=null,lastFocus=null;
  function closeG(){if(!pop)return;pop.remove();pop=null;fab.setAttribute('aria-expanded','false');fab.textContent='💡';try{lastFocus&&lastFocus.focus()}catch(e){}}
  function openG(){
    if(pop)return closeG();lastFocus=document.activeElement;
    const body=h('div',{class:'gpb'});try{gGram(body)}catch(e){body.append(h('p',null,'Обясненията не можаха да се заредят.'))}
    const x=h('button',{type:'button','aria-label':'Затвори'},'✕');x.onclick=closeG;
    pop=h('div',{class:'gpop',role:'dialog','aria-modal':'true','aria-label':'Бързи обяснения'},h('div',{class:'gpw'},h('div',{class:'gph'},h('h2',null,'💡 Бързи обяснения'),x),body));
    pop.addEventListener('click',e=>{if(e.target===pop)closeG()});
    document.body.append(pop);fab.setAttribute('aria-expanded','true');fab.textContent='✕';
    setTimeout(()=>{const q=pop&&pop.querySelector('input');if(q&&matchMedia('(min-width:701px)').matches)q.focus();else x.focus()},50);
  }
  fab.onclick=openG;document.body.append(fab);
  addEventListener('keydown',e=>{if(e.key==='Escape'&&pop){e.stopPropagation();closeG()}},true);
  window.__openGram=openG;
  /* 1: the browser's own install button (Android and PC Chrome / Edge) */
  const installed=()=>{try{return matchMedia('(display-mode: standalone)').matches||opt('installed',false)}catch(e){return false}};
  addEventListener('appinstalled',()=>{setOpt('installed',true);document.querySelectorAll('.instb').forEach(x=>x.closest('section')&&x.closest('section').remove())});
  function installBox(){
    if(installed()||!window.__bip)return null;
    const b=h('button',{type:'button',class:'btn rose'},'📲 Инсталирай');
    b.onclick=async()=>{const ev=window.__bip;if(!ev)return;window.__bip=null;try{ev.prompt();const r=await ev.userChoice;if(r&&r.outcome==='accepted')setOpt('installed',true)}catch(e){}renderPanel()};
    return h('section',{class:'sect'},h('div',{class:'instb'},b,h('p',null,'Инглишко като приложение – с икона до другите ви приложения.')));
  }
  document.addEventListener('bipready',()=>{try{if((S.tab==='prog'||S.tab==='today')&&!document.body.classList.contains('playing'))renderPanel()}catch(e){}});
  /* 13 + 15: settings in one box on Аз */
  const SETS=['Размер на текста','Анимации','Външен вид','Глас','Лесно използване'];
  const _gp=gProgPlus;
  gProgPlus=function(p){
    _gp.apply(this,arguments);
    try{
      p.querySelectorAll(':scope > .a2hs').forEach(x=>x.remove());
      const ib=installBox();
      const secs=[...p.querySelectorAll(':scope > section')].filter(s=>{const t=(s.querySelector('h3')||{}).textContent||'';return SETS.some(n=>t.trim().startsWith(n))});
      secs.sort((a,b)=>SETS.findIndex(n=>((a.querySelector('h3')||{}).textContent||'').trim().startsWith(n))-SETS.findIndex(n=>((b.querySelector('h3')||{}).textContent||'').trim().startsWith(n)));
      const bk=p.querySelector(':scope > .bksect'),rs=[...p.querySelectorAll(':scope > .rsect')].filter(x=>x!==bk);
      const body=h('div',{class:'setbody'},...secs);
      if(bk)body.append(bk);
      rs.forEach(x=>body.append(x));
      const box=h('details',{class:'setbox',id:'setbox'},h('summary',null,'⚙️ Настройки',h('small',null,'глас, текст, тема, анимации, резервно копие')),body);
      if(opt('setOpen',false))box.open=true;
      box.addEventListener('toggle',()=>setOpt('setOpen',box.open));
      p.append(box);if(ib)box.before(ib);
      /* sections that other parts add later next to a moved one go back out of the box */
      const keep=n=>n===bk||rs.includes(n)||secs.includes(n);
      new MutationObserver(()=>{[...body.children].forEach(n=>{if(!keep(n))box.before(n)})}).observe(body,{childList:true});
    }catch(e){console.error(e)}
  };
  /* 7 + 9 + 1 on Днес */
  const _rp=renderPanel;
  renderPanel=function(){
    _rp.apply(this,arguments);
    try{document.body.classList.toggle('on-prog',S.tab==='prog')}catch(e){}

      p.querySelectorAll('.today .a2hs').forEach(x=>x.remove());
      const ib=!opt('instOk',false)&&installBox();
      if(ib&&!p.querySelector('.instb')){const x=h('button',{type:'button',class:'linkbtn'},'Не сега');x.onclick=()=>{setOpt('instOk',true);ib.remove()};ib.querySelector('.instb').append(x);
        const ref=p.querySelector('.today .ilinks')||p.querySelector('.today > .sect:last-of-type');if(ref)ref.after(ib);else{const t=p.querySelector('.today');t&&t.append(ib)}}
    }}catch(e){}
  };
  try{renderTabs();renderPanel()}catch(e){}
})();
</script>

      h('p',{class:'lsnote'},m<10?'До стикера „Слушател": още '+(10-m)+' мин.':m<60?'До стикера „Добро ухо": още '+(60-m)+' мин.':'Следваща цел: '+goal+' мин.'),
      h('button',{type:'button',class:'btn alt',onclick:()=>{S.lsView=null;goT('slush')}},'🎧 Към Слушалня'));
    const r=p.querySelector('.rsect')||p.querySelector('#setbox');if(r&&r.parentNode)r.parentNode.insertBefore(s,r);else p.append(s)}catch(e){}};
  /* ---------------- stickers ---------------- */
  try{const K=X().STK;if(K){
    if(!K.some(z=>z[0]==='ears'))K.push(['ears','🎧','Слушател','10 минути в Слушалня',()=>(S.ls&&S.ls.ms||0)>=600000]);
    if(!K.some(z=>z[0]==='ears2'))K.push(['ears2','🎶','Добро ухо','60 минути в Слушалня',()=>(S.ls&&S.ls.ms||0)>=3600000]);
    X().checkStickers&&X().checkStickers(true)}}catch(e){}
  try{if(S.tab==='slush'||S.tab==='games')renderPanel()}catch(e){}
})();
</script>
<script>
/* offline: register the service worker that caches the whole app */
if('serviceWorker' in navigator)addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const offer=w=>{if(w&&navigator.serviceWorker.controller&&window.__offerUpdate)window.__offerUpdate(()=>w.postMessage('skipWaiting'))};
    if(reg.waiting)offer(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')offer(w)})});
    /* look for a new version whenever the app comes back to the screen */
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{});
  /* reload only after the learner tapped "Обнови", never on the first install */
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(window.__updating&&!window.__reloaded){window.__reloaded=true;location.reload()}});
});
</script>
