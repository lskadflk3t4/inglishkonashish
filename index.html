<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Инглишко на шиш</title>
<meta name="description" content="Интерактивна програма по английски за българи – 1200 думи, граматика и слушане.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14201A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="icon" href="icons/icon-512.png" sizes="512x512">
<link rel="stylesheet" href="fonts.css">
<style>
/* the app runs edge to edge; keep its content clear of the phone's system bars */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<style>
/* Layout: a study desk — compact header, a scrollable row of game tabs, one work surface where word tiles sit like keys */
:root{
  --ground:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8EE; --ink:#1A2230; --muted:#5B6678; --line:#CBD3DD;
  --rose:#B3305A; --rose-soft:#F6E1E8; --ok:#1E7A6E; --ok-soft:#DDF1EC; --bad:#C2412D; --bad-soft:#F9E3DE; --gold:#A86B0C; --gold-soft:#F7ECD6;
  --tile:#FFFFFF; --tile-edge:#B9C3CF;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#14201A; --surface:#25221F; --sunk:#2F2B27; --ink:#F4ECE1; --muted:#B8AC9B; --line:#433D35;
  --rose:#FF8F70; --rose-soft:#45291F; --ok:#86D29A; --ok-soft:#1D3826; --bad:#F26D6D; --bad-soft:#421F21; --gold:#F5C95C; --gold-soft:#3B3119;
  --tile:#2D2925; --tile-edge:#0F1813; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#14201A; --surface:#25221F; --sunk:#2F2B27; --ink:#F4ECE1; --muted:#B8AC9B; --line:#433D35;
  --rose:#FF8F70; --rose-soft:#45291F; --ok:#86D29A; --ok-soft:#1D3826; --bad:#F26D6D; --bad-soft:#421F21; --gold:#F5C95C; --gold-soft:#3B3119;
  --tile:#2D2925; --tile-edge:#0F1813; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;line-height:1}
.brand h1 b{color:var(--rose);font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.stat strong{font-family:var(--f-mono);color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.levels{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
.chk input{accent-color:var(--rose);width:16px;height:16px}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-width:0}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.tab .t{font-weight:600;font-size:15px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tab[aria-selected="true"] .n{color:var(--ground);opacity:.7}
/* panel */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.phead h2{font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:-.01em}
.phead p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.how{border-left:3px solid var(--rose);background:var(--rose-soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;max-width:70ch}
.how b{color:var(--rose)}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select{font:inherit;font-size:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:#fff}
/* tiles */
.tile{border:1px solid var(--line);border-bottom:3px solid var(--tile-edge);background:var(--tile);border-radius:10px;padding:9px 14px;font-weight:600;font-size:16px;line-height:1.25;transition:transform .12s,background .15s,border-color .15s;touch-action:manipulation;text-align:center}
.tile:hover:not(:disabled){transform:translateY(-1px)}
.tile:active:not(:disabled){transform:translateY(1px);border-bottom-width:1px;margin-top:2px}
.tile.sel{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose);}
.tile.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tile.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .35s}
.tile.gone{opacity:.35}
.tile:disabled{cursor:default}
.tile small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.tile[draggable="true"]{cursor:grab}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tile,.tile.bad{animation:none;transition:none}}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* match layout */
.match{display:grid;grid-template-columns:1fr;gap:16px}
.slots{display:grid;gap:10px}
.slots.pics{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.slot{border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:var(--ground);min-height:64px;text-align:center;transition:border-color .15s,background .15s;cursor:pointer;min-width:0}
.slot.ready{border-color:var(--rose)}
.slot.over{background:var(--rose-soft);border-color:var(--rose)}
.slot.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft);cursor:default;animation:pop .3s}
.slot .pic{font-size:52px;line-height:1.1}
.slot .ans{font-weight:700;color:var(--ok)}
.slot .bg{font-size:13px;color:var(--muted)}
.slot.row{flex-direction:row;justify-content:space-between;text-align:left;align-items:center;gap:12px}
.slot.row .txt{flex:1;min-width:0}
.slot.row .ph{flex:0 0 auto;min-width:96px;border-radius:8px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);font-weight:600;text-align:center;color:var(--muted)}
.slot.row.done .ph{color:var(--ok);border-color:var(--ok)}
/* question card */
.q{background:var(--ground);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.q .sent{font-size:clamp(19px,3.2vw,24px);font-weight:500;line-height:1.45;max-width:36ch}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--rose);padding:0 6px;color:var(--rose);font-weight:700}
.gap.ok{color:var(--ok);border-color:var(--ok)}
.gap.bad{color:var(--bad);border-color:var(--bad)}
.q .tr{color:var(--muted);font-size:15px}
.q .meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--muted);background:var(--surface)}
.typerow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.typerow input{font:inherit;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 200px;max-width:320px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;background:var(--ink);color:var(--ground)}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn.rose{background:var(--rose);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.fb{border-radius:10px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px;width:100%;max-width:640px;text-align:left}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb .h{font-weight:700}
.fb.ok .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.fb .tip{background:var(--gold-soft);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:4px}
.fb .tip::before{content:"Правило: ";font-weight:700;color:var(--gold)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.prog{flex:1 1 160px;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--rose);border-radius:99px;transition:width .3s}
.done-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px}
.done-card .big{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--rose);font-variant-numeric:tabular-nums}
/* family */
.fam{display:flex;flex-direction:column;gap:6px;align-items:center}
.fam .root{font-family:var(--f-display);font-size:22px}
.fam .rule{font-size:14px;color:var(--ink);background:var(--gold-soft);border-radius:8px;padding:6px 12px;max-width:62ch}
.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);font-weight:700}
/* dialogue */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px}
.dcard:hover{border-color:var(--rose)}
.dcard .t{font-weight:700}
.dcard .d{font-size:13px;color:var(--muted)}
.dcard .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:10px;background:var(--ground);border-radius:var(--r);padding:16px}
.msg{max-width:min(78%,560px);display:flex;flex-direction:column;gap:2px}
.msg.A{align-self:flex-start}
.msg.B{align-self:flex-end;align-items:flex-end}
.who{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.bub{padding:10px 14px;border-radius:14px;font-size:16px;line-height:1.5;cursor:pointer}
.msg.A .bub{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.B .bub{background:var(--ink);color:var(--ground);border-top-right-radius:4px}
.msg.B .gap{color:var(--rose-soft);border-color:var(--rose-soft)}
.msg.B .gap.ok{color:#9be3d5;border-color:#9be3d5}
.msg .btr{font-size:13px;color:var(--muted)}
.gap.cur{background:var(--rose-soft);border-radius:4px 4px 0 0;animation:pop .4s}
.msg.B .gap.cur{background:transparent}
/* vocab list */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.vrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:var(--ground);min-width:0}
.vrow .e{font-size:22px;width:28px;text-align:center;flex:0 0 auto}
.vrow .w{font-weight:600}
.vrow .b{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.vrow .m{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--muted);flex:0 0 auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.dot.k1{background:var(--gold)} .dot.k2{background:var(--ok)}
.search{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);flex:1 1 220px;min-width:0}
.empty{color:var(--muted);text-align:center;padding:24px}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* terms & notes */
.terms{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.terms.left{align-items:flex-start}
.trow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.tag.strong{background:var(--ink);color:var(--ground);border-color:var(--ink);font-family:var(--f-body);font-size:12px;letter-spacing:.02em;font-weight:600}
.tag.term{cursor:pointer;border-style:dashed;border-color:var(--rose);color:var(--rose);font-family:var(--f-body);font-size:12px;letter-spacing:0;font-weight:600}
.tag.term::after{content:" ⓘ"}
.tag.term[aria-expanded="true"]{background:var(--rose);color:#fff;border-style:solid}
.task{font-size:14px;color:var(--muted);max-width:60ch}
.termnote{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;flex-direction:column;gap:3px;max-width:62ch;text-align:left}
.termnote b{color:var(--gold)}
.termnote .ex{color:var(--muted)}
.rowhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:4px}
.rowhead .task{font-size:12px}
.rtext{display:block;font-size:16px}
.sent.long{max-width:44ch;font-size:clamp(18px,2.8vw,22px)}
/* sentence builder */
.arrow{color:var(--muted);font-size:20px;line-height:1}
.build{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;min-height:58px;width:100%;max-width:640px;border:2px dashed var(--line);border-radius:12px;padding:8px;background:var(--surface)}
.build.ok{border-style:solid;border-color:var(--ok)}
.build.bad{border-style:solid;border-color:var(--bad)}
.build .punct{font-size:22px;font-weight:700;color:var(--muted)}
.bph{color:var(--muted);font-size:14px}
/* category bins */
.bins{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;margin-top:12px}
.bin{border:2px dashed var(--line);border-radius:12px;background:var(--ground);display:flex;flex-direction:column;min-height:150px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.bin.ready{border-color:var(--rose)}
.bin.over{background:var(--rose-soft);border-color:var(--rose)}
.bhead{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:0;text-align:center}
.bhead strong{font-size:15px}
.bhead span{font-size:12px;color:var(--muted)}
.bdrop{display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-content:flex-start;justify-content:center}
.bdrop .tile{font-size:14px;padding:6px 10px;opacity:1}
@media (max-width:620px){.bins{grid-template-columns:1fr}.bin{min-height:80px}}
/* grammar guide */
.gsec{font-family:var(--f-display);font-weight:500;font-size:16px;margin-top:6px}
.glist{display:flex;flex-direction:column;gap:10px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gcard{background:var(--ground);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcard p{margin:0;font-size:14px}
.gt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gt strong{font-size:16px}
.gen{font-family:var(--f-mono);font-size:12px;color:var(--rose)}
.gex{color:var(--muted)}

/* mixed tab */
.kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* detective */
.dcard.case{border-left:4px solid var(--gold)}
.cno{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--gold)}
.casefile{background:var(--gold-soft);border:1px solid var(--line);border-radius:6px 16px 16px 16px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;position:relative}
.casefile h3{font-family:var(--f-display);font-weight:500;font-size:20px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stamp{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);border:2px solid var(--rose);border-radius:4px;padding:2px 8px;transform:rotate(-3deg)}
.ctext{margin:0;font-size:16px;line-height:1.7;max-width:70ch}
.ctr{margin:0;font-size:14px;line-height:1.6;color:var(--muted);max-width:70ch;border-top:1px dashed var(--line);padding-top:8px}
.notebook{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.notes{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.notes li b{color:var(--ok)}
.notes li.miss b{color:var(--bad)}
.notes .nq{color:var(--muted)}
.notes:empty::before{content:"Още няма записани факти.";color:var(--muted);margin-left:-22px}

/* lost tourist */
.dcard.trip{border-left:4px solid var(--ok)}
.tourfile{background:var(--ok-soft)}
.tourfile .cno{color:var(--ok)}
.tmapwrap{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.tmap{display:grid;grid-template-columns:repeat(var(--c),minmax(64px,1fr));gap:3px;min-width:min(100%,420px)}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;border-radius:8px;padding:4px 2px;text-align:center}
.cell.bld{background:var(--surface);border:1px solid var(--line)}
.cell.road{background:var(--sunk);border-radius:2px;min-height:34px}
.cell.road.you{background:var(--rose-soft);outline:2px solid var(--rose)}
.cell.water{background:var(--rose-soft)}
.cell.void{background:transparent}
.ce{font-size:24px;line-height:1.1}
.cl{font-size:10px;color:var(--muted);line-height:1.15;overflow-wrap:anywhere}
.tleg{font-size:12px;color:var(--muted)}
.pool.col{flex-direction:column;align-items:stretch;width:100%;max-width:560px}
.pool.col .tile{text-align:left}
.tag.term.plain::after{content:""}

/* manual */
.manual{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0}
.manual summary{cursor:pointer;padding:10px 16px;font-weight:600;font-size:15px;list-style-position:inside}
.manual summary::marker{color:var(--rose)}
.mbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
.mtips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px;max-width:75ch}
.mtips b{color:var(--rose)}
.mtabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}

.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.route.soft .stop{opacity:.78}
.stop{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:6px 0;margin-left:var(--x,0px);transition:margin .2s}
.stop::before{content:"";position:absolute;left:31px;top:0;bottom:0;border-left:4px dotted var(--line);z-index:0}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop.done::before{border-left-style:solid;border-color:var(--ok)}
.snode{position:relative;z-index:1;width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;border:0;padding:0}
.snode .ring{position:absolute;inset:0}
.snode .se{font-size:24px;line-height:1;position:relative}
.snode .sk{position:absolute;right:-4px;bottom:-4px;font-size:18px;line-height:1}
.stop.next .snode{box-shadow:0 0 0 3px var(--rose)}
.sbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;max-width:340px}
.sbtn:hover{border-color:var(--rose)}
.stop.done .sbtn{border-color:var(--ok);background:var(--ok-soft)}
.stop.next .sbtn{border-color:var(--rose)}
.sbtn .sn{font-weight:600;font-size:15px}
.sbtn .sc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sbtn .snx{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rose)}
.stop.done .sbtn .snx{color:var(--ok)}
.finish{display:flex;align-items:center;gap:12px;padding:6px 0 0 8px;color:var(--muted);font-size:14px}
.finish span:first-child{font-size:28px}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--ground);border:1px solid transparent;border-radius:14px;padding:12px 8px;min-width:0}
.badge .bn{font-weight:600;font-size:13px;line-height:1.3}
.badge .bc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge .bring{position:relative;width:72px;height:72px;display:grid;place-items:center}
.badge .bring .ring{position:absolute;inset:0}
.badge .bring .se{font-size:26px;line-height:1;position:relative}
.badge.got{background:var(--gold-soft);border-color:var(--gold)}
.badge.got .bc{color:var(--gold);font-weight:700}
.badge:not(.got) .bring .se{filter:grayscale(.6);opacity:.75}
.badge .medal{position:absolute;right:-2px;top:-4px;font-size:22px}
.bsum{font-size:14px;color:var(--muted)}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--ground);border-radius:14px;padding:12px 18px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .25s,transform .25s;max-width:min(92vw,420px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:700px){.stop{grid-template-columns:56px minmax(0,1fr);margin-left:calc(var(--x,0px) * .5)}.snode{width:56px;height:56px}.stop::before{left:27px}.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.gtier{flex:1 1 0;min-width:0}}

/* ===== sound toggle, confetti, swipe flashcards ===== */
button.stat.sfx{padding:3px 10px;font-size:15px;line-height:1.2}
button.stat.sfx.off{opacity:.6}
.confetti{position:fixed;left:0;top:0;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:60;will-change:transform,opacity}
.vmode{margin-top:-4px}
.fcwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 8px;user-select:none;-webkit-user-select:none}
.fcbar span{white-space:nowrap}
.mapstep{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px}
.mapstep .fcwrap{align-items:center}
.btn.lskip{font-size:14px;padding:8px 14px;margin-top:4px}
.fcbar{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;max-width:420px;font-size:14px;color:var(--muted)}
.fcbar .prog{min-width:0}
.fcstage{position:relative;width:100%;max-width:360px;height:min(64vh,380px);touch-action:none}
.fcard{position:absolute;inset:0;background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--tile-edge);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;cursor:grab;
  box-shadow:0 6px 18px rgba(0,0,0,.08);touch-action:none;transition:transform .25s,opacity .25s}
.fcard.drag{transition:none;cursor:grabbing}
.fcard.under{transform:scale(.95) translateY(10px);opacity:.6;pointer-events:none}
.fcard .fe{font-size:64px;line-height:1.1;min-height:1.1em}
.fcard .fw{font-family:var(--f-display);font-weight:500;font-size:clamp(26px,8vw,36px);line-height:1.15;overflow-wrap:anywhere}
.fcard .fb2{font-size:18px;color:var(--muted);min-height:1.5em}
.fcard .fhint{font-size:12px;color:var(--muted)}
.fcard .fbtag{position:absolute;top:16px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:15px;letter-spacing:.04em;opacity:0;border:2px solid}
.fcard .fbtag.k{right:16px;color:var(--ok);border-color:var(--ok);transform:rotate(8deg)}
.fcard .fbtag.n{left:16px;color:var(--bad);border-color:var(--bad);transform:rotate(-8deg)}
.fcard .fbtag.u{left:50%;top:auto;bottom:16px;transform:translateX(-50%);color:var(--rose);border-color:var(--rose)}
.fcbtns{display:flex;gap:10px;width:100%;max-width:420px}
.fcbtns .btn{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding-inline:10px}
.fcbtns .btn.alt{flex:0 0 64px;font-size:20px}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--ok-soft);color:var(--ok)}
.fcsum{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.fcsum span{background:var(--ground);border-radius:10px;padding:8px 14px;font-size:14px}
.fcsum b{font-family:var(--f-mono);font-size:18px}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"],:root:not([data-theme="light"]) .btn.rose,:root:not([data-theme="light"]) .tag.term[aria-expanded="true"],:root:not([data-theme="light"]) .btn.rd.on{color:#1E1A16}}
:root[data-theme="dark"] .chip[aria-pressed="true"],:root[data-theme="dark"] .btn.rose,:root[data-theme="dark"] .tag.term[aria-expanded="true"],:root[data-theme="dark"] .btn.rd.on{color:#1E1A16}
</style>

<style>
/* ===== v6: pictograms for words without an emoji ===== */
.pg-svg{display:block;color:var(--ink);overflow:visible}
.pg-svg .no{fill:none;stroke:currentColor;stroke-width:2.4;stroke-opacity:.7;stroke-linejoin:round}

<script>
/* ===== v10: the First 100 — the words every beginner needs, taught before all others ===== */
const FIRST100=["what", "and", "in", "I", "yes", "all", "be", "man", "good", "who", "but", "on", "you", "no", "some", "have", "woman", "bad", "where", "or", "at", "he", "not", "many", "do", "child", "big", "when", "because", "to", "she", "please", "much", "go", "friend", "small", "why", "so", "from", "it", "more", "come", "family", "new", "how", "if", "with", "we", "very", "get", "day", "old", "which", "than", "for", "they", "only", "make", "time", "of", "me", "now", "want", "year", "about", "my", "today", "like", "house", "under", "your", "tomorrow", "know", "home", "near", "this", "always", "see", "water", "next to", "that", "never", "say", "food", "before", "here", "eat", "money", "after", "there", "drink", "name", "work", "people", "live", "thing", "need", "help", "give", "take"];
function first100(){return FIRST100.map(w=>byEn[w]&&byEn[w][0]).filter(Boolean)}
const f100Learned=()=>first100().filter(v=>(S.w[v.en]||0)>=2).length;
const f100Done=()=>f100Learned()>=first100().length;
/* the next unmastered ones: those already met but not yet learned first, then new ones, in teaching order;
   words due in today's review are left out, the review brings them anyway */
let VOC_F100=false;
/* progress strip: on Днес it links to the cards, in Карти it shows how far along the deck is */
function f100Row(onToday){
  const all=first100().length,k=f100Learned(),done=k>=all;
  const row=h('div',{class:'f100'+(done?' done':'')},
    h('span',{class:'f1s','aria-hidden':'true'},done?'🎉':'⭐'),
    h('div',{class:'f1t'},
      h('div',{class:'f1h'},h('b',null,'Първите 100'),h('span',{class:'f1n'},`${k} / ${all}`)),
      h('div',{class:'prog'},h('i',{style:`width:${Math.round(100*k/all)}%`})),
      h('div',{class:'f1d'},done?'Всичките са научени. Вече получавате и останалите думи.'
        :onToday?'Най-важните думи идват първи – всеки ден, докато ги научите.':'Плъзнете надясно думите, които знаете. Всяка се брои за научена след два верни отговора.')),
    onToday?h('button',{type:'button',class:'f1go',onclick:()=>{VOC_FC=true;VOC_F100=true;S.tab='vocab';save();renderTabs();renderPanel();try{scrollTo(0,0)}catch(e){}}},'Карти →'):null);
  return row;
}
function first100Next(n){
  const tn=tnum(),open=first100().filter(v=>(S.w[v.en]||0)<2&&!(S.sr[v.en]&&S.sr[v.en].due<=tn));
  return [...open.filter(v=>S.w[v.en]!==undefined),...open.filter(v=>S.w[v.en]===undefined)].slice(0,n);
}
</script>
<script>
/* ===== v6: pictograms ===== */
/* Diagram pictograms for words no emoji can show.
   pictoSVG('P:in') -> an SVG string, 48x48 units, drawn in the theme's ink colour
   with the meaning picked out in the accent colour. */
const pictoSVG=(function(){
  const N='n',A='a';                       // n = neutral outline, a = accent
  const R=(x,y,w,h,c=N,rx=3)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c==='a'?'af':c==='s'?'sf':'no'}"/>`;
  const C=(x,y,r,c=A)=>`<circle cx="${x}" cy="${y}" r="${r}" class="${c==='a'?'af':c==='h'?'ao':c==='s'?'sf':'no'}"/>`;
  const L=(x1,y1,x2,y2,c=N,d='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c==='a'?'as':'ns'}"${d?` stroke-dasharray="${d}"`:''}/>`;
  const P=(d,c=N,fill=false)=>`<path d="${d}" class="${fill?(c==='a'?'af':'sf'):(c==='a'?'as':'ns')}"/>`;
  const T=(x,y,t,size,c=A)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${size}" class="${c==='a'?'at':'nt'}">${t}</text>`;
  function arrow(x1,y1,x2,y2,c=A,d=''){
    const a=Math.atan2(y2-y1,x2-x1),h=5.5,w=.5;
    const p1=[x2-h*Math.cos(a-w),y2-h*Math.sin(a-w)],p2=[x2-h*Math.cos(a+w),y2-h*Math.sin(a+w)];
    return L(x1,y1,x2,y2,c,d)+`<path d="M${x2} ${y2} L${p1[0].toFixed(1)} ${p1[1].toFixed(1)} L${p2[0].toFixed(1)} ${p2[1].toFixed(1)} Z" class="${c==='a'?'af':'sf'}"/>`;
  }
  /* a person: head and body; dress=true gives a skirt shape */
  function person(x,y,c=N,s=1,dress=false){
    const hd=C(x,y-9*s,3.8*s,c==='a'?'a':'s');
    const body=dress?P(`M${x-5.5*s} ${y+8*s} L${x-2.5*s} ${y-4*s} L${x+2.5*s} ${y-4*s} L${x+5.5*s} ${y+8*s} Z`,c,true)
                    :R(x-4.5*s,y-4*s,9*s,12*s,c==='a'?'a':'s',3*s);
    return hd+body;
  }
  const speak=(x,y)=>P(`M${x} ${y-3} q3 3 0 6`)+P(`M${x+3} ${y-5.5} q5 5.5 0 11`);
  const glass=(fill,line)=>P('M14 10 L17 40 H31 L34 10')+(fill>0?P(`M${14+3*(1-fill)*0} ${40-30*fill} L${14.5+2.6*(1-fill)} ${40-30*fill} L17 40 H31 L${33.5-2.6*(1-fill)} ${40-30*fill} Z`,A,true):'')+(line?L(10,22,38,22,A,'3 2'):'');

  const tpl={
    /* ---------- place and movement ---------- */
    P(v){
      switch(v){
        case 'in':      return P('M13 18 V40 H35 V18')+C(24,32,5.5);
        case 'on':      return R(13,27,22,14)+C(24,21,5.5);
        case 'under':   return R(11,8,26,8)+L(14,16,14,30)+L(34,16,34,30)+C(24,25,5.5);
        case 'above':   return R(13,28,22,13)+C(24,10,5.5);
        case 'over':    return R(14,28,20,13)+P('M6 34 Q24 0 42 34','a')+C(24,13,4.5);
        case 'below':   return R(13,7,22,13)+C(24,37,5.5);
        case 'behind':  return C(31,22,6)+R(11,22,22,18,'s')+R(11,22,22,18);
        case 'front':   return R(16,12,22,18)+C(18,32,6.5);
        case 'next':    return R(6,22,18,18)+C(33,34,6);
        case 'between': return R(3,22,13,18)+R(32,22,13,18)+C(24,34,6);
        case 'near':    return R(8,22,16,18)+C(31,34,5);
        case 'far':     return R(3,24,12,16)+L(18,36,38,36,N,'2 3')+C(42,36,3.5);
        case 'opposite':return R(17,3,14,11)+L(4,19,44,19)+L(4,29,44,29)+L(10,24,16,24,N)+L(22,24,28,24,N)+L(34,24,40,24,N)+C(24,39,5.5);
        case 'around':  return R(17,17,14,14)+`<circle cx="24" cy="24" r="17" class="as" stroke-dasharray="3 3" fill="none"/>`+C(24,7,4.5);
        case 'through': return P('M14 40 V16 Q24 6 34 16 V40')+arrow(3,30,45,30);
        case 'into':    return P('M13 24 V42 H35 V24')+arrow(24,3,24,32);
        case 'outof':   return P('M13 24 V42 H35 V24')+arrow(24,36,24,9)+C(24,6,3.5);
        case 'across':  return P('M16 6 q-4 6 0 12 t0 12 t0 12')+P('M32 6 q-4 6 0 12 t0 12 t0 12')+arrow(4,24,44,24);
        case 'along':   return L(4,36,44,36)+L(4,40,44,40)+arrow(6,28,42,28);
        case 'among':   return R(5,6,9,9)+R(34,6,9,9)+R(5,33,9,9)+R(34,33,9,9)+R(19,3,9,8)+R(19,38,9,8)+C(24,24,5.5);
        case 'towards': return R(32,16,12,18)+C(7,25,4.5)+arrow(13,25,27,25);
        case 'to':      return R(32,16,12,18)+C(6,25,4)+arrow(11,25,31,25);
        case 'from':    return R(4,16,12,18)+arrow(17,25,37,25)+C(42,25,4);
        case 'up':      return L(10,42,38,42)+arrow(24,40,24,6);
        case 'down':    return L(10,6,38,6)+arrow(24,8,24,42);
        case 'outside': return P('M8 24 L19 13 L30 24 V40 H8 Z')+C(39,35,5.5);
        case 'against': return R(33,6,8,36,'s',2)+R(33,6,8,36)+C(26,24,6.5)+L(8,20,15,20)+L(6,24,15,24)+L(8,28,15,28);
        case 'with':    return C(14,28,6.5)+R(22,18,18,20)+L(19,22,23,22,'a');
        case 'without': return C(12,28,6.5)+R(24,18,18,20,N)+L(22,16,44,40,'a')+L(44,16,22,40,'a');
        case 'at':      return `<ellipse cx="24" cy="38" rx="14" ry="4" class="no"/>`+P('M24 38 C14 26 14 22 14 18 A10 10 0 1 1 34 18 C34 22 34 26 24 38 Z',A,true)+C(24,18,3.5,'n');
        case 'away':    return R(3,16,12,18)+arrow(17,25,40,25)+L(30,19,36,19,N)+L(30,31,36,31,N);
      }
      return '';
    },
    /* ---------- time: a line, "now" in the middle ---------- */
    T(v){
      const line=L(3,30,45,30), now=L(24,20,24,40,N,'2 2'), dot=(x,c='a')=>C(x,30,4.5,c);
      const diamond=x=>P(`M${x} 25 L${x+5} 30 L${x} 35 L${x-5} 30 Z`,N,true);
      const clock=x=>C(x,30,5,'n')+L(x,30,x,27)+L(x,30,x+2.5,30);
      const days=i=>[0,1,2].map(k=>R(4+k*14,14,12,12,k===i?'a':'n',2)).join('')+L(24,30,24,38,N,'2 2')+T(24,42,'↑',7,'n');
      switch(v){
        case 'yesterday': return days(0);
        case 'today':     return days(1);
        case 'tomorrow':  return days(2);
        case 'now':       return line+now+C(24,30,9,'h')+dot(24);
        case 'past':      return line+now+`<line x1="4" y1="30" x2="23" y2="30" class="as" stroke-width="6"/>`;
        case 'future':    return line+now+`<line x1="25" y1="30" x2="44" y2="30" class="as" stroke-width="6"/>`;
        case 'before':    return line+diamond(30)+dot(13);
        case 'after':     return line+diamond(18)+dot(35);
        case 'during':    return line+`<line x1="9" y1="30" x2="39" y2="30" class="ns" stroke-width="8" opacity=".35"/>`+dot(24);
        case 'until':     return line+`<line x1="5" y1="30" x2="29" y2="30" class="as" stroke-width="5"/>`+L(30,20,30,40,'a');
        case 'since':     return line+now+L(11,20,11,40,'a')+`<line x1="12" y1="30" x2="23" y2="30" class="as" stroke-width="5"/>`;
        case 'ago':       return line+now+arrow(23,22,9,22)+dot(9);
        case 'soon':      return line+now+dot(31);
        case 'already':   return line+now+`<line x1="5" y1="30" x2="17" y2="30" class="as" stroke-width="5"/>`+P('M10 18 l3 3 l6 -7','a');
        case 'yet':       return line+now+L(25,30,37,30,'a','2 2')+C(40,30,4.5,'h');
        case 'still':     return line+now+`<line x1="6" y1="30" x2="36" y2="30" class="as" stroke-width="5"/>`+arrow(36,30,44,30);
        case 'then':      return line+C(12,30,4,'n')+arrow(17,30,30,30)+dot(36);
        case 'early':     return line+clock(31)+dot(13);
        case 'late':      return line+clock(17)+dot(37);
        case 'recently':  return line+now+dot(18)+arrow(19,22,23,22);
        case 'finally':   return line+C(10,30,3,'n')+C(20,30,3,'n')+L(40,30,40,12,'a')+P('M40 12 L48 16 L40 20 Z',A,true);
        case 'suddenly':  return line+P('M27 6 L19 24 H26 L20 42 L32 20 H25 L31 6 Z',A,true);
        case 'immediately':return line+now+dot(26)+L(30,24,36,20,'a')+L(30,30,38,30,'a')+L(30,36,36,40,'a');
        case 'while':     return `<line x1="6" y1="20" x2="36" y2="20" class="as" stroke-width="6"/>`+`<line x1="14" y1="32" x2="42" y2="32" class="ns" stroke-width="6" opacity=".5"/>`;
      }
      return '';
    },
    /* ---------- how often: a week of seven days ---------- */
    F(v){
      const n=+v;let s='';
      for(let i=0;i<7;i++)s+=R(2.5+i*6.3,14,5.2,20,i<n?'a':'n',1.5);

le she was cooking, so I gave {her;she;hers;herself} a plaster.","Тя се поряза, докато готвеше, затова ѝ дадох лепенка.","Възвратно местоимение (herself), когато подлогът и обектът са един и същ човек."],["2","pron","Did you make this cake {yourself;you;your;yours}? – Yes, I made it {myself;me;my;mine}!","Ти ли направи тази торта сам? – Да, сам я направих!","myself/yourself = сам (без чужда помощ)."],["2","pron","There's {somebody;anybody;nobody;everybody} at the door. Can you see who {it;he;she;this} is?","Някой чука на вратата. Виждаш ли кой е?","somebody – в утвърдителни изречения."],["2","pron","I looked everywhere, but I couldn't find {anything;something;nothing;everything}. There was {nothing;anything;something;all} in the box.","Търсих навсякъде, но не намерих нищо. В кутията нямаше нищо.","not + anything = nothing."],["2","pron","The woman {who;which;whose;where} lives next door is a doctor, and her husband, {who;which;that;whom} is French, is a chef.","Жената, която живее в съседство, е лекарка, а съпругът ѝ, който е французин, е готвач.","who – за хора."],["2","pron","This is the phone {which;who;whose;where} I bought last week. It's the one {that;who;whose;what} has the best camera.","Това е телефонът, който купих миналата седмица. Той е този с най-добрата камера.","which/that – за предмети."],["2","pron","That's the man {whose;who;which;who's} car was stolen, and that's the street {where;which;who;when} it happened.","Това е мъжът, на когото откраднаха колата, а това е улицата, където се случи.","whose = чийто; where = където."],["2","pron","Help {yourselves;yourself;you;your} to some food, everyone! And enjoy {yourselves;yourself;you;ourselves}!","Почерпете се, всички! И се забавлявайте!","Множествено число: yourselves."],["2","pron","They don't talk to {each other;themselves;them;their} any more because they argued about money.","Те вече не си говорят, защото се скараха за пари.","each other = един друг."],["2","pron","{Everyone;Anyone;Anything;Nothing} enjoyed the concert, but {no one;anyone;anything;nothing} wanted to go home early.","На всички им хареса концертът и никой не искаше да си тръгне рано.",""],["1","poss","This is my sister. {Her;She;His;Hers} name is Elena and {her;his;she;its} husband is Greek.","Това е сестра ми. Казва се Елена, а съпругът ѝ е грък.","her – неин (на жена)."],["1","poss","My brother has a dog. {Its;It's;His;Her} name is Max, and it sleeps in {its;it's;it;their} own bed.","Брат ми има куче. Казва се Макс и спи в собственото си легло.","its = негов (на предмет/животно). it's = it is!"],["1","poss","We love {our;us;we;ours} new flat. {Its;It's;Ours;Theirs} kitchen is very big.","Обожаваме новия си апартамент. Кухнята му е много голяма.",""],["1","poss","Excuse me, what's {your;you;yours;you're} name? – {My;Me;Mine;I} name's Peter.","Извинете, как се казвате? – Казвам се Петър.","your – твой/ваш; you're = you are."],["1","poss","The children are in {their;there;they're;them} room. {They're;Their;There;They} playing a game.","Децата са в стаята си. Играят игра.","their = техен; there = там; they're = they are."],["2","poss","Peter forgot {his;her;its;him} umbrella, so he borrowed {his;her;him;he's} brother's.","Петър забрави чадъра си, затова взе назаем този на брат си.",""],["2","poss","Is this {your;yours;you;you're} coat? – No, {mine;my;me;I} is black.","Това твоето палто ли е? – Не, моето е черно.","Пред съществително: my/your; самостоятелно: mine/yours."],["2","poss","{Maria's;Marias;Maria;Marias'} car is red, but her {parents';parent's;parents;parents's} car is blue.","Колата на Мария е червена, а колата на родителите ѝ е синя.","Притежание: 's (Maria's). Множествено число на -s: само апостроф (parents')."],["2","poss","Mr and Mrs Brown sold {their;there;his;her} house and moved to {their;they're;there;theirs} daughter's town.","Господин и госпожа Браун продадоха къщата си и се преместиха в града на дъщеря си.",""],["2","poss","I like {my;mine;me;I} job, but my husband doesn't li работи.","May I...? – учтиво искане на разрешение."],["2","modal","I {will;would;am;shall to} call you tomorrow, I promise. – OK, and {will;do;are;shall to} you bring my book?","Ще ти се обадя утре, обещавам. – Добре, и ще ми донесеш ли книгата?","will – обещание, бъдеще."],["2","modal","She {might;must;should;has to} come to the party, but she isn't sure. She {may;must;has;have} have to work.","Тя може да дойде на купона, но не е сигурна. Може да ѝ се наложи да работи.","might/may = може би."],["2","modal","He {must;can't;should;has} be at home – his car is outside. But he {can't;must;should;mustn't} be asleep – the lights are on.","Сигурно е вкъщи – колата му е отвън. Но не може да спи – лампите светят.","must = сигурно е; can't = не може да е (логично заключение)."],["2","modal","I {would;will;should;can} love to come, but I {have;must;should;can} to finish this report first.","С удоволствие бих дошъл, но първо трябва да довърша този доклад.","would love to = с удоволствие бих."],["2","modal","You {had better;would better;better to;had best to} hurry, or you {will;would;had;might to} miss the train.","По-добре побързай, иначе ще изпуснеш влака.","had better + основна форма = по-добре (е да)..."],["2","modal","We {should have;should;must;should had} booked a table. Now we {will have to;must to;should to;had} wait.","Трябваше да резервираме маса. Сега ще трябва да чакаме.","should have + 3-та форма = трябваше да (но не го направихме)."],["2","modal","You {don't need to;mustn't;must;need} bring food – there will be a lot. But you {must;don't need;mustn't;needn't to} bring your ID.","Не е нужно да носиш храна – ще има много. Но трябва да носиш личната си карта.","don't need to = не е нужно."],["2","modal","{Shall;Will;Would;Do} I carry your bag? – That's very kind, but I {can;shall;would;am} manage.","Да ти нося ли чантата? – Много мило, но ще се справя.","Shall I...? – предложение за помощ."],["2","modal","I {wasn't able to;couldn't to;can't;mustn't} sleep last night, so I {will be able to;can to;could to;am able} relax this evening, I hope.","Не можах да спя снощи, така че се надявам довечера да мога да си почина.","be able to – използва се, когато can няма нужната форма."],["1","det","There are {some;any;much;a} eggs in the fridge, but there isn't {any;some;many;a} milk.","В хладилника има яйца, но няма мляко.","some – утвърдително; any – отрицание и въпрос."],["1","det","How {many;much;lot;more} brothers do you have, and how {much;many;lot;more} money do you need?","Колко братя имаш и колко пари ти трябват?","many + броими; much + неброими."],["1","det","I have {a lot of;much;many of;lot} friends, but I don't have {much;many;a lot;lots} free time.","Имам много приятели, но нямам много свободно време.","a lot of – с двата вида; much – най-вече в отрицания и въпроси."],["2","det","Can I have {some;any;a;many} water, please? – Sorry, there isn't {any;some;none;no} left.","Може ли малко вода, моля? – Съжалявам, не е останала.","some – в молби и предложения."],["2","det","There were only {a few;a little;much;few of} people at the concert, and they had {a little;a few;many;few of} money for drinks.","На концерта имаше само няколко души и имаха малко пари за напитки.","a few + броими; a little + неброими."],["2","det","{Every;All;Each of;Both} student in the class passed, and {all;every;each;both} of them were happy.","Всеки ученик в класа издържа и всички бяха щастливи.","every + ед.ч.; all of them."],["2","det","{Both;Either;Neither;All} my parents are teachers, but {neither;both;either;none} of them likes maths.","И двамата ми родители са учители, но нито един от тях не обича математика.","both = и двамата; neither = нито един (от двама)."],["2","det","There's {too much;too many;enough;a few} sugar in this coffee, and {too many;too much;enough of;a little} people in this café.","В това кафе има прекалено много захар, а в това кафене – прекалено много хора.","too much + неброимо; too many + броимо."],["2","det","We don't have {enough;too;much enough;very} chairs for {everyone;every;each;all}.","Нямаме достатъчно столове за всички.","enough стои пред съществителното."],["2","det","There is {no;not;any;none} milk in the fridge, and {none;no;not;any} of the shops are open.","В хладилника няма мляко и нито един от магазините не е отворен.","no + съществително; none of + група."],["2","det","{Few;A few;Little;A little} people came, so the party was boring, but we had {a little;little;few;a few} time to talk.","Дойдоха малко хора, така че купонът беше скучен, но имахме малко време да си поговорим.","few/little = малко (недостатъчно, отрицателно); a few/a little = малко (но достатъчно)."],["2","det","{Each;Every;All;Both} of the rooms has a balcony, and {every;each of;all;both} room has a sea view.","Всяка от стаите има балкон и всяка стая има изглед към морето.","each of + мн.ч. + глагол в ед.ч."],["2","det","Would you like tea or coffee? – {Either;Neither;Both;Any} is fine. I like {both;either;neither;all}.","Чай или кафе искате? – Все едно. Харесвам и двете.","either = което и да е (от две)."],["2","det","{Most;Most of;The most;Mostly} people enjoy travelling, but {most of;most;the most;mostly} my friends prefer staying at home.","Повечето хора обичат да пътуват, но повечето от приятелите ми предпочитат да си стоят вкъщи.","most + общо (most people); most of + конкретна група (most of my friends)."],["2","det","There are {several;much;a little;a great deal of} museums in the city, and {plenty of;many of;several of;a few of} cafés too.","В града има няколко музея, а и много кафенета.","several = няколко; plenty of = много, предостатъчно."],["2","det","I've read {all;every;each;whole} the books on the list, but I haven't read {any;some;no;none} of the articles.","Прочел съм всички книги от списъка, но не съм чел нито една от статиите.",""],["1","conj","I like tea {and;but;or;so} coffee, {but;and;or;because} I don't like milk.","Харесвам чай и кафе, но не обичам мляко.","and = и; but = но."],["1","conj","Do you want pizza {or;and;but;so} pasta? I'm hungry {because;so;but;or} I didn't eat lunch.","Искаш ли пица или паста? Гладен съм, защото не съм обядвал.","or = или; because = защото."],["1","conj","It was raining, {so;because;but;or} we stayed at home {and;but;or;so} watched a film.","Валеше, затова си останахме вкъщи и гледахме филм.","so = затова (резултат)."],["2","conj","{When;During;If;Because} I was young, I lived in a village, {but;so;and;because} now I live in Sofia.","Когато бях малък, живеех на село, но сега живея в София.","when = когато."],["2","conj","{If;When;Because;So} it rains tomorrow, we'll go to the museum {instead of;because of;so;and} the beach.","Ако утре вали, ще отидем в музея вместо на плажа.","if = ако."],["2","conj","I'll call you {before;until;during;since} I leave, and I'll text you {when;during;until;since} I arrive.","Ще ти се обадя, преди да тръгна, и ще ти пиша, когато пристигна.","След before/after/when не използваме will: when I arrive (НЕ when I will arrive)."],["2","conj","She was tired, {but;so;because;or} she finished her work {before;because;so;but} she went to bed.","Тя беше уморена, но довърши работата си, преди да си легне.",""],["2","conj","Wait here {until;while;during;since} I come back, and don't talk to anyone {while;during;until;since} I'm away.","Чакай тук, докато се върна, и не говори с никого, докато ме няма.","until = докато (не); while = докато (по време на)."],["2","conj","{Although;However;But;Despite} it was cold, we went swimming. {However;Although;But;Despite}, the water was warm.","Въпреки че беше студено, отидохме да плуваме. Водата обаче беше топла.","although + изречение; however – в началото, със запетая."],["2","conj","{Despite;Although;However;Even} the bad weather, the flight left on time, {so;but;because;although} we arrived early.","Въпреки лошото време полетът излетя навреме, така че пристигнахме рано.","despite + съществително (без изречение)."],["2","conj","I'll lend you the car {as long as;as well as;as soon as;so that} you drive carefully, {and;but;or;so} please bring it back by Friday.","Ще ти дам колата назаем, стига да караш внимателно, и моля те, върни я до петък.","as long as = стига да."],["2","conj","Take an umbrella {in case;so;unless;because of} it rains. You won't need it {unless;if;in case;so} it rains.","Вземи чадър, в случай че завали. Няма да ти трябва, освен ако не вали.","in case = в случай че; unless = освен ако не."],["2","conj","She speaks {both;either;neither;as} English and French, but she doesn't speak {either;neither;both;nor} German or Spanish.","Тя говори и английски, и френски, но не говори нито немски, нито испански.","both ... and; not ... either ... or."],["2","conj","I'm saving money {so that;because;so;in case of} I can travel next year, {as;so;but;unless} I've never been abroad.","Спестявам пари, за да мога да пътувам догодина, тъй като никога не съм бил в чужбина.","so that = за да; as = тъй като."],["2","conj","{As soon as;Until;While;Unless} I got home, I called my mum, {whereas;because;so;although} my sister went straight to bed.","Веднага щом се прибрах, се обадих на мама, докато сестра ми си легна направо.","as soon as = веднага щом; whereas = докато (противопоставяне)."],["1","qw","{Where;What;Who;When} do you live? – In Burgas. {What;Where;Who;How} do you do? – I'm a nurse.","Къде живееш? – В Бургас. С какво се занимаваш? – Медицинска сестра съм.","where = къде; what = какво."],["1","qw","{Who;What;Which;Whose} is that man? – He's my uncle. {How;What;Who;Where} old is he? – Sixty.","Кой е този мъж? – Чичо ми. На колко години е? – На шестдесет.","who = кой (за хора); how old = на колко години."],["1","qw","{When;Where;Why;Who} is your birthday? – In May. {Why;When;What;How} do you like May? – Because it's warm.","Кога е рожденият ти ден? – През май. Защо харесваш май? – Защото е топло.","when = кога; why = защо."],["2","qw","{How much;How many;How long;How often} does this cost, and {how many;how much;how long;how often} bottles do you want?","Колко струва това и колко бутилки искаш?","how much – цена/неброимо; how many – брой."],["2","qw","{How often;How long;How much;How many} do you go to the gym? – Three times a week. {How long;How often;How far;How many} do you stay there? – Two hours.","Колко често ходиш на фитнес? – Три пъти седмично. Колко време стоиш там? – Два часа.","how often = колко често; how long = колко време."],["2","qw","{Whose;Who;Who's;Which} bag is this? – It's Anna's. And {which;whose;who;what} one is yours, the red or the blue one?","Чия е тази чанта? – На Ана е. А коя е твоята, червената или синята?","whose = чий; which = кой (от ограничен избор)."],["2","qw","{How far;How long;How much;How often} is it to the station? – About a kilometre. {How;What;Which;Who} can I get there? – By bus.","Колко е далеч гарата? – Около километър. Как да стигна дотам? – С автобус.","how far = колко далеч; how = как."],["2","qw","{What time;What;When time;Which hour} does the film start, and {how long;how much;how far;how often} is it?","В колко часа започва филмът и колко е дълъг?",""],["2","qw","{Who;What;Whom;Which} told you that? And {what;who;which;whose} did she say exactly?","Кой ти каза това? И какво точно каза тя?","Въпрос за подлога – без did: Who told you?"],["2","qw","{What;Which;How;Who} is the weather like today? – Sunny. {What;How;Which;Who} does your brother look like? – He's tall.","Какво е времето днес? – Слънчево. Как изглежда брат ти? – Висок е.","What ... like? = какъв е (описание)."],["2","qw","{What kind of;How kind;Which of kind;What sort} music do you like, and {who;whom;whose;which} is your favourite singer?","Каква музика харесваш и кой е любимият ти певец?","what kind of = какъв вид."],["2","qw","{Why;Why not;How come;What for} don't we go out tonight? – {Why not;Why;What;How}? Good idea!","Защо не излезем довечера? – Защо не? Добра идея!","Why don't we...? – предложение."],["2","qw","{Which;What;Who;Whose} of these jackets do you prefer? And {how much;how many;how long;how often} did they cost?","Кое от тези якета предпочиташ? И колко струваха?","which of = кое от."],["1","comp","My brother is {taller;more tall;tallest;the taller} than me, but I am {older;more old;oldest;the older} than him.","Брат ми е по-висок от мен, но аз съм по-голям от него.","Кратко прилагателно + -er + than."],["2","comp","This hotel is {more expensive;expensiver;most expensive;the more expensive} than that one, but it's {better;gooder;best;more good}.","Този хотел е по-скъп от онзи, но е по-добър.","Дълго прилагателно → more; good → better."],["2","comp","It's the {biggest;bigest;most big;bigger} city in the country and the {most beautiful;beautifulest;more beautiful;beautiful most} too.","Това е най-големият град в страната, а и най-красивият.","big → biggest (удвояване); дълги → the most."],["2","comp","Today is {hotter;hoter;more hot;hottest} than yesterday. It's the {hottest;hotest;most hot;hotter} day of the year.","Днес е по-горещо от вчера. Това е най-горещият ден в годината.","hot → hotter → the hottest."],["2","comp","My English is {worse;badder;worst;more bad} than my sister's. She's the {best;goodest;better;most good} in our family.","Английският ми е по-лош от този на сестра ми. Тя е най-добрата в семейството ни.","bad → worse → the worst; good → better → the best."],["2","comp","The film was {more interesting;interestinger;most interesting;more interested} than the book, but the book was {longer;more long;longest;the longer}.","Филмът беше по-интересен от книгата, но книгата беше по-дълга.",""],["2","comp","She is {happier;happyer;more happy;happiest} now than last year, and her new flat is {bigger;more big;biggest;biger}.","Тя е по-щастлива сега, отколкото миналата година, а новият ѝ апартамент е по-голям.","y → i: happy → happier."],["2","comp","Tom is not {as;that;more;than} tall {as;than;like;that} his father.","Том не е толкова висок, колкото баща си.","not as ... as = не толкова ... колкото."],["2","comp","This is the {worst;baddest;worse;most bad} meal I've ever eaten! It's even {worse;worst;badder;more bad} than yesterday's.","Това е най-лошото ядене, което съм ял! Дори е по-лошо от вчерашното.",""],["2","comp","The {more;most;much;many} you practise, the {better;best;good;more good} you get.","Колкото повече се упражняваш, толкова по-добър ставаш.","the + сравнителна ..., the + сравнителна = колкото ..., толкова..."],["2","comp","The train is {much;very;more;most} faster than the bus, but it's {a bit;a few;very;much more} more expensive.","Влакът е много по-бърз от автобуса, но е малко по-скъп.","much/a bit + сравнителна (НЕ very faster)."],["2","comp","It's getting {colder and colder;cold and colder;more cold and cold;coldest and coldest}, and the days are getting {shorter;more short;shortest;short} too.","Става все по-студено, а и дните стават по-кратки.","по-... и по-...: colder and colder."],["2","comp","Mount Everest is the {highest;higher;most high;highest of} mountain {in;of;from;than} the world.","Еверест е най-високата планина в света.","the highest ... in the world (НЕ of the world)."],["2","comp","She runs {faster;more fast;fastly;fastest} than anyone in her team and works {harder;more hard;hardly;hardest} too.","Тя тича по-бързо от всички в отбора си и работи по-усърдно.","Наречия като fast и hard: faster, harder. hardly = едва!"],["2","comp","My new job is {less;fewer;least;lesser} stressful than my old one, and I have {fewer;less;least;little} meetings.","Новата ми работа е по-малко стресираща от старата и имам по-малко срещи.","less + прилагателно/неброимо; fewer + броимо мн.ч."],["2","comp","This is {by far;very;more;much the} the best pizza in town, and it's {as;so;more;such} cheap as the others.","Това е най-добрата пица в града с голяма разлика и е толкова евтина, колкото другите.","by far = с голяма разлика."],["2","comp","Who is the {oldest;eldest of;most old;older} person in your family? – My grandmother. She's {older;elder than;more old;oldest} than my grandfather.","Кой е най-възрастният човек в семейството ти? – Баба ми. Тя е по-възрастна от дядо ми.",""],["2","comp","This room is {the same;same;as same;similar as} size as mine, but it's {different from;different than of;different to of;difference from} my room in other ways.","Тази стая е със същия размер като моята, но е различна от моята стая в други отношения.","the same ... as; different from."],["1","freq","I {always;never;sometimes;usually} brush my teeth twice a day – every day! I {never;always;often;usually} smoke – not even one cigarette.","Винаги си мия зъбите два пъти на ден – всеки ден! Никога не пуша – нито една цигара.","always = 100%; never = 0%."],["1","freq","She {is always;always is;always;is never always} late, and she {never;doesn't never;not never;never doesn't} says sorry.","Тя винаги закъснява и никога не се извинява.","Наречието стои СЛЕД be (is always), но ПРЕД другите глаголи (never says)."],["1","freq","We {usually;usual;use;usually are} have dinner at seven, but {sometimes;sometime;some times;something} we eat later.","Обикновено вечеряме в седем, но понякога ядем по-късно.","sometimes може да стои и в началото на изречението."],["2","freq","How often do you go to the cinema? – {Once;One;Once time;One times} a month, and I {hardly ever;hard ever;ever hardly;never hardly} go to the theatre.","Колко често ходиш на кино? – Веднъж месечно, а почти никога не ходя на театър.","once = веднъж; twice = два пъти; three times...; hardly ever = почти никога."],["2","freq","I {often go;go often;often am going;am often go} swimming in summer, but I {rarely;rare;rarely do;do rarely} swim in winter.","Често ходя да плувам през лятото, но рядко плувам през зимата.",""],["2","freq","{Have you ever;Have ever you;Did you ever;Ever have you} been to Japan? – No, I've {never;ever;not ever;never not} been to Asia.","Бил ли си някога в Япония? – Не, никога не съм бил в Азия.","ever – във въпроси; never – в отговор (без not)."],["2","freq","My brother {doesn't usually;usually doesn't usually;doesn't usual;not usually} cook, but he {sometimes;some times;sometime;something} makes pancakes on Sundays.","Брат ми обикновено не готви, но понякога прави палачинки в неделя.","doesn't + usually + глагол."],["2","freq","The buses here are {never;ever;always never;no} on time, and the trains are {often;oftenly;oft;often are} late too.","Автобусите тук никога не идват навреме, а и влаковете често закъсняват.","След be: are never, are often."],["2","freq","I go to the gym {twice;two times a;second;double} a week and I {always;allways;all ways;always do} do yoga on Fridays.","Ходя на фитнес два пъти седмично и в петък винаги правя йога.",""],["2","freq","I {can never;never can;can't never;never can't} remember his name, and I've {always;ever;never;already} been bad with names.","Никога не мога да запомня името му и винаги съм бил зле с имената.","Наречието стои след модалния/спомагателния глагол: can never, have always."],["2","freq","We {hardly ever;never ever not;hardly never;ever hardly} eat out, because we {usually;usual;use;used} cook at home.","Почти никога не ядем навън, защото обикновено готвим вкъщи.","hardly ever = почти никога (без not)."],["2","freq","{Every;All;Whole;Any} summer we go to the seaside, and {every;all;each of;whole} day we swim in the sea.","Всяко лято ходим на море и всеки ден плуваме в морето.","every summer / every day – стоят в края или в началото на изречението."],["2","freq","She has {always;ever;yet;still} wanted to visit Paris, but she has {never;ever;not ever;yet never} had the time.","Тя винаги е искала да посети Париж, но никога не е имала време.",""],["2","freq","My grandparents {used to;use to;were used to;usually used} walk to school, and they {seldom;seldomly;never not;rare} had shoes.","Баба ми и дядо ми са ходили пеша до училище и рядко са имали обувки.","seldom = рядко."],["2","freq","I check my emails {every hour;every hours;each hours;all hour}, but I {rarely;rare;rarely do;do rarely} answer them immediately.","Проверявам имейлите си на всеки час, но рядко им отговарям веднага.",""],["2","inf","I want {to learn;learning;learn;to learning} Spanish because I enjoy {travelling;to travel;travel;travelled} to Spain.","Искам да уча испански, защото обичам да пътувам до Испания.","want + to + глагол; enjoy + -ing."],["2","inf","She decided {to stay;staying;stay;to staying} at home because she didn't feel like {going;to go;go;went} out.","Тя реши да си остане вкъщи, защото не ѝ се излизаше.","decide + to; feel like + -ing."],["2","inf","{Swimming;Swim;To swimming;Swam} is good for your health, and it's easy {to learn;learning;learn;learnt}.","Плуването е полезно за здравето и е лесно за научаване.","-ing форма като подлог; it's easy + to."],["2","inf","I'm interested in {learning;to learn;learn;learned} photography, and I'd like {to buy;buying;buy;bought} a new camera.","Интересувам се да уча фотография и бих искал да си купя нов фотоапарат.","След предлог (in) → -ing; would like + to."],["2","inf","Thank you for {helping;help;to help;helped} me. I hope {to see;seeing;see;saw} you soon.","Благодаря ти, че ми помогна. Надявам се да те видя скоро.","for + -ing; hope + to."],["2","inf","Have you finished {cleaning;to clean;clean;cleaned} the kitchen? Then you can start {cooking;cook;cooks;cooked} dinner.","Свърши ли да чистиш кухнята? Тогава можеш да започнеш да готвиш вечерята.","finish + -ing; start + -ing или to."],["2","inf","I went to the shop {to buy;for buy;for buying;buying} some bread, but I forgot {to take;taking;take;took} my wallet.","Отидох до магазина да купя хляб, но забравих да си взема портфейла.","Цел: to + глагол (за да). forget to = забравям да направя нещо."],["2","inf","I'm looking forward to {seeing;see;to see;saw} you, and I'm used to {travelling;travel;to travel;travelled} alone.","С нетърпение чакам да те видя и съм свикнал да пътувам сам.","look forward to + -ing; be used to + -ing."],["2","inf","He stopped {smoking;to smoke;smoke;smoked} last year and started {running;run;runs;ran} every morning.","Той спря да пуши миналата година и започна да тича всяка сутрин.","stop + -ing = спирам да правя нещо."],["2","inf","On the way home, we stopped {to buy;buying;buy;bought} some water because we were thirsty.","На път за вкъщи спряхме, за да купим вода, защото бяхме жадни.","stop + to = спирам, за да направя нещо друго."],["2","inf","I remember {meeting;to meet;meet;met} him at a party years ago. Please remember {to call;calling;call;called} him tomorrow!","Помня, че се запознах с него на един купон преди години. Моля те, не забравяй да му се обадиш утре!","remember + -ing = помня нещо от миналото; remember + to = не забравям да направя."],["2","inf","Would you mind {closing;to close;close;closed} the door? And please avoid {making;to make;make;made} noise.","Бихте ли затворили вратата? И моля, избягвайте да вдигате шум.","mind + -ing; avoid + -ing."],["2","inf","My parents let me {stay;to stay;staying;stayed} out late, but they made me {call;to call;calling;called} them at midnight.","Родителите ми ме оставяха да стоя навън до късно, но ме караха да им се обаждам в полунощ.","let/make + обект + основна форма (без to)."],["2","inf","It's no use {crying;to cry;cry;cried} about it. You'd better {try;to try;trying;tried} again.","Няма смисъл да плачеш за това. По-добре опитай отново.","It's no use + -ing; had better + основна форма."],["2","inf","She agreed {to help;helping;help;helped} us, but she refused {to lend;lending;lend;lent} us her car.","Тя се съгласи да ни помогне, но отказа да ни даде колата си назаем.","agree to; refuse to."],["2","inf","I can't stand {waiting;to waiting;wait;waited} in queues, and I don't mind {paying;to pay;pay;paid} a bit more to avoid them.","Не понасям да чакам на опашки и нямам нищо против да платя малко повече, за да ги избегна.","can't stand + -ing; don't mind + -ing."],["2","inf","We're planning {to visit;visiting;visit;to visiting} Greece, and we're thinking of {renting;to rent;rent;rented} a car.","Планираме да посетим Гърция и мислим да наемем кола.","plan + to; think of + -ing."],["2","wf","She is a very {careful;care;carefully;careless} driver. She always drives {carefully;careful;care;carefulness}.","Тя е много внимателна шофьорка. Винаги кара внимателно.","Прилагателно описва съществително (driver); наречие описва глагол (drives)."],["2","wf","The film was {boring;bored;bore;boringly}, so the children were {bored;boring;bore;boredom}.","Филмът беше скучен, така че на децата им беше скучно.","-ing = какво е нещото; -ed = как се чувства човек."],["2","wf","He is a {successful;success;succeed;successfully} businessman, and his {success;successful;succeed;successfully} is famous.","Той е успешен бизнесмен и успехът му е известен.","-ful → прилагателно; success – съществително."],["2","wf","I {decided;decision;decide;decisive} to stay, but it was a difficult {decision;decide;decided;decisive}.","Реших да остана, но беше трудно решение.","-ion → съществително."],["2","wf","Money can't buy {happiness;happy;happily;unhappy}, but it can make life {easier;easy;easily;ease}.","Парите не могат да купят щастие, но могат да направят живота по-лесен.","-ness → съществително."],["2","wf","Thank you for the {invitation;invite;invited;inviting}. It was very {kind;kindly;kindness;unkind} of you.","Благодаря за поканата. Беше много мило от ваша страна.",""],["2","wf","Smoking is {dangerous;danger;dangerously;endanger} for your {health;healthy;healthily;unhealthy}.","Пушенето е опасно за здравето ти.","-ous → прилагателно."],["2","wf","The {teacher;teach;teaching;taught} explained the rule {clearly;clear;clearness;clearer}, so everyone understood.","Учителят обясни правилото ясно, така че всички разбраха.","-er = човек; -ly = наречие."],["2","wf","I'm not {interested;interesting;interest;interestingly} in football. I think it's {boring;bored;bore;boredom}.","Не се интересувам от футбол. Мисля, че е скучен.",""],["2","wf","There's a {possibility;possible;possibly;impossible} of rain, so {possibly;possible;possibility;impossible} we'll stay at home.","Има възможност за дъжд, така че е възможно да си останем вкъщи.","-ity → съществително; -ly → наречие."],["2","wf","The hotel staff were very {helpful;help;helpless;helpfully}, and the room was very {comfortable;comfort;comfortably;uncomfortably}.","Персоналът на хотела беше много услужлив, а стаята – много удобна.",""],["2","wf","It's {impossible;unpossible;inpossible;dispossible} to sleep here. The music is too {loud;loudly;loudness;louder than}.","Невъзможно е да се спи тук. Музиката е прекалено силна.","im- пред p: impossible."],["2","wf","He was {unemployed;inemployed;disemployed;employed not} for a year before he found a job with a good {employer;employ;employment;employee of}.","Той беше безработен една година, преди да си намери работа при добър работодател.","un- = отрицание; -er = работодател."],["2","wf","The {width;wide;widen;widely} of the road is ten metres, and its {length;long;lengthen;longly} is two kilometres.","Ширината на пътя е десет метра, а дължината му – два километра.","wide → width; long → length."],["2","wf","She answered {politely;polite;politeness;impolite}, although the customer was very {rude;rudely;rudeness;rudest}.","Тя отговори учтиво, въпреки че клиентът беше много груб.",""],["2","wf","His {knowledge;know;known;knowing} of history is amazing; he is a very {educated;education;educate;educational} man.","Познанията му по история са невероятни; той е много образован човек.",""],["2","wf","The {beauty;beautiful;beautifully;beautify} of the mountains is {breathtaking;breath;breathe;breathtakingly}.","Красотата на планините спира дъха.",""],["2","wf","It was a {disappointing;disappointed;disappoint;disappointment} result, and the fans were very {disappointed;disappointing;disappoint;disappointment}.","Резултатът беше разочароващ и феновете бяха много разочаровани.","-ing / -ed."],["2","wf","She {organised;organisation;organiser;organising of} the party, and the {organisation;organise;organised;organiser of} was perfect.","Тя организира партито и организацията беше перфектна.","-ation → съществително."],["1","voc","I'm {hungry;thirsty;tired;angry}. Let's go to a {restaurant;library;bank;hospital} and have lunch.","Гладен съм. Хайде да отидем в ресторант и да обядваме.",""],["1","voc","It's very {cold;hot;sunny;warm} today, so put on your {coat;swimsuit;sunglasses;T-shirt} and a scarf.","Много е студено днес, така че облечи палтото си и шал.",""],["1","voc","My {daughter;son;father;husband} is ten. She goes to {school;work;university;office} every day.","Дъщеря ми е на десет. Тя ходи на училище всеки ден.",""],["1","voc","I need some {milk;meat;rice;bread} for my coffee and some {bread;milk;tea;juice} for sandwiches.","Трябва ми мляко за кафето и хляб за сандвичи.",""],["2","voc","We stayed in a small {hostel;hospital;factory;prison} near the {beach;desert;forest;mountain}, so we swam every day.","Отседнахме в малък хостел близо до плажа, така че плувахме всеки ден.",""],["2","voc","I {booked;borrowed;built;broke} a double room online, and when we arrived, the {receptionist;pilot;farmer;judge} gave us the keys.","Резервирах двойна стая онлайн и когато пристигнахме, рецепционистът ни даде ключовете.",""],["2","voc","Don't forget your {passport;password;postcard;pillow}! You'll need it at {passport control;the gym;the bakery;the cinema}.","Не забравяй паспорта си! Ще ти трябва на паспортния контрол.",""],["2","voc","The museum's {opening hours;rush hour;timetable;departure} are from 9 to 5, and the {entrance fee;salary;tip;bill} is 10 euros.","Музеят работи от 9 до 5, а входната такса е 10 евро.",""],["2","voc","It was a {sunny;rainy;foggy;cloudy} day, so we put on {sunscreen;gloves;boots;coats} and went to the beach.","Беше слънчев ден, затова си сложихме слънцезащитен крем и отидохме на плажа.",""],["2","voc","I bought a {souvenir;receipt;ticket;passport} for my mum and sent a {postcard;parcel;password;passport} to my friends.","Купих сувенир за майка си и изпратих картичка на приятелите си.",""],["2","voc","Our flight was {delayed;cancelled at;booked;confirmed in} for two hours, so we waited at the {gate;garden;garage;gallery}.","Полетът ни закъсня с два часа, така че чакахме на изхода.",""],["2","voc","My {colleague;cousin;neighbour;guest} works in the same office as me, and our {boss;customer;driver;waiter} is very kind.","Колегата ми работи в същия офис като мен, а шефът ни е много мил.",""],["2","voc","I {lost;earned;spent;saved} my wallet on the bus, so I went to the {lost property;post office;pharmacy;bakery} office.","Изгубих портфейла си в автобуса, затова отидох в бюрото за изгубени вещи.",""],["2","voc","The {view;sight;vision;look} from the castle was {breathtaking;boring;crowded;noisy} – we could see the whole valley.","Изгледът от замъка спираше дъха – виждахме цялата долина.",""],["2","voc","We took a {ferry;ski;sunbed;tent} to the island and went on a {guided tour;rush hour;customs;check-in} of the old town.","Взехме ферибот до острова и направихме обиколка с екскурзовод на стария град.",""],["2","voc","Can I {exchange;borrow;lend;steal} euros here? What's the {exchange rate;speed;distance;temperature} today?","Мога ли да обменя евро тук? Какъв е обменният курс днес?",""],["2","voc","The beach was very {crowded;empty;peaceful;quiet} in August, so next year we'll go to a {peaceful;crowded;noisy;busy} village in the mountains.","Плажът беше много претъпкан през август, затова догодина ще отидем в спокойно село в планината.",""],["2","voc","I had to {cancel;confirm;deliver;increase} my holiday because I was ill, but the {travel agency;police station;fire station;factory} gave me my money back.","Трябваше да отменя почивката си, защото бях болен, но туристическата агенция ми върна парите.",""],["2","voc","We hired a car and drove along the {motorway;menu;monument;mirror}, but we got stuck in the {rush hour;opening hours;nightlife;sunrise} traffic.","Наехме кола и карахме по магистралата, но попаднахме в трафика в час пик.",""],["2","voc","The hotel is {all-inclusive;expensive;empty;historic}, so food and drinks are {included;increased;invited;improved} in the price.","Хотелът е „всичко включено\", така че храната и напитките са включени в цената.",""],["2","voc","After a long {hike;cruise;flight;ride} in the mountains, we found a beautiful {waterfall;harbour;terminal;customs} and had a swim.","След дълъг преход в планината намерихме красив водопад и поплувахме.",""],["2","voc","She called an {ambulance;umbrella;engineer;envelope} because there was an {accident;advertisement;address;article} on the road.","Тя извика линейка, защото имаше катастрофа на пътя.",""]],"GR":[{"s":"Части на речта","i":[["noun","Noun","Съществително име","Дума за човек, предмет, място, животно или идея. Отговаря на въпроса „кой?\" или „какво?\".","a teacher, a table, Sofia, love"],["verb","Verb","Глагол","Дума за действие или състояние – какво прави някой или какво се случва.","run, eat, be, think"],["adjective","Adjective","Прилагателно име","Дума, която описва съществително – какво е то. Стои пред съществителното или след be.","a big house; She is happy."],["adverb","Adverb","Наречие","Дума, която описва глагол – как, кога, къде или колко често става нещо. Често завършва на -ly.","slowly, today, here, always"],["pronoun","Pronoun","Местоимение","Кратка дума, която заменя съществително, за да не го повтаряме.","Anna is nice. She is my friend."],["preposition","Preposition","Предлог","Малка дума пред съществително, която показва място, време или посока.","in the box, on Monday, to school"],["conjunction","Conjunction","Съюз (свързваща дума)","Дума, която свързва две думи или две изречения.","and, but, because, so, if"],["determiner","Determiner","Определител","Дума пред съществително, която показва кое е то или колко е: членове, this/that, some, many и др.","the car, this book, some water, many people"],["article","Article","Член","Думите a, an и the. В английски членът стои ПРЕД съществителното (в български е накрая: книгата).","a book, an apple, the book"]]},{"s":"Изречението","i":[["subject","Subject","Подлог","Този, който върши действието. В английски подлогът е задължителен и стои преди глагола.","Maria works here. It is cold."],["object","Object","Допълнение","Човекът или нещото, върху които пада действието. Стои след глагола.","I love him. She reads a book."],["question","Question","Въпросително изречение","В английски въпросът се прави, като спомагателният глагол (do, does, did, is, can...) отиде ПРЕД подлога.","You like tea. → Do you like tea?"],["negative","Negative","Отрицателно изречение","Отрицанието се прави с not след спомагателния глагол. Само с not не става: трябва do/does/did, ако няма друг спомагателен глагол.","She works. → She doesn't work."],["shortanswer","Short answer","Кратък отговор","Отговор само с yes/no + подлог + спомагателен глагол, без да повтаряме целия въпрос.","Do you swim? – Yes, I do."],["questiontag","Question tag","Въпрос „нали?\"","Кратък въпрос в края на изречението. Ако изречението е утвърдително, въпросът е отрицателен, и обратно.","You're tired, aren't you?"],["relative","Relative clause","Подчинено определително изречение","Част от изречението, която описва съществително и започва с who, which, that, whose или where.","The man who lives here is a pilot."],["contraction","Contraction","Съкратена форма","Две думи, слети в една с апостроф. Използва се в разговорна реч.","I am → I'm; do not → don't"]]},{"s":"Глаголи","i":[["be","To be","Глаголът be (съм)","Най-важният глагол. Сегашно: I am, he/she/it is, we/you/they are. Минало: was, were. С be не използваме do във въпроси.","I am a student. Are you OK?"],["aux","Auxiliary verb","Спомагателен глагол","„Помощен\" глагол, който помага да направим въпрос, отрицание или време: do, does, did, be, have, will.","Do you work? I have finished."],["modal","Modal verb","Модален глагол","Глагол, който добавя значение като „мога\", „трябва\", „може би\": can, could, must, should, might, will, would. След него идва глагол БЕЗ to, а с he/she няма -s.","She can swim. You must stop."],["base","Base form","Основна форма","Глаголът в най-простия си вид, както е в речника, без окончания.","go, eat, play"],["thirdperson","3rd person singular","Трето лице, единствено число","he, she, it (или един човек/едно нещо). В сегашно просто време глаголът получава -s.","He plays. She watches. It goes."],["irregular","Irregular verb","Неправилен глагол","Глагол, който не образува минало време с -ed, а има своя форма. Формите трябва да се научат наизуст.","go – went – gone; eat – ate – eaten"],["regular","Regular verb","Правилен глагол","Глагол, който образува минало време и 3-та форма с -ed.","work – worked – worked"],["pastparticiple","Past participle (3rd form)","Минало причастие (3-та форма)","Третата форма на глагола. Използва се с have (I have seen) и в страдателен залог (it was built).","seen, written, worked"],["infinitive","Infinitive","Инфинитив","Основната форма на глагола с to. Отговаря на българското „да + глагол\".","I want to go. It's easy to learn."],["gerund","Gerund (-ing form)","Герундий (-ing форма)","Глагол с -ing, който се държи като съществително. Често го превеждаме с „да + глагол\" или със съществително.","I enjoy swimming. Smoking is bad."],["imperative","Imperative","Повелително наклонение","Форма за заповед, молба или съвет. Използва основната форма без подлог.","Open the door. Don't be late."],["passive","Passive voice","Страдателен залог","Показва какво се случва с нещо, а не кой го прави. be + 3-та форма.","The house was built in 1950."]]},{"s":"Времена","i":[["pres","Present Simple","Сегашно просто време","За навици, факти и неща, които се случват редовно. he/she/it + -s. Въпрос и отрицание с do/does.","I work every day. She doesn't smoke."],["cont","Present Continuous","Сегашно продължително време","За действие, което става точно сега и
