ли около сега. am/is/are + глагол с -ing.","I'm reading now. They're working."],["past","Past Simple","Минало просто време","За завършено действие в миналото (вчера, миналата година...). Правилни глаголи + -ed; неправилните имат своя форма. Въпрос и отрицание с did.","I visited Rome. We went home. Did you see it?"],["pc","Past Continuous","Минало продължително време","За действие, което е продължавало в даден момент в миналото. was/were + -ing.","I was sleeping when you called."],["perf","Present Perfect","Сегашно перфектно време","Свързва миналото с настоящето: опит в живота, резултат сега, действие от минало до сега. have/has + 3-та форма.","I have been to Paris. She has lost her keys."],["pastperf","Past Perfect","Минало перфектно време","За действие, станало ПРЕДИ друго минало действие. had + 3-та форма.","When I arrived, the film had started."],["future","Future (will / going to)","Бъдеще време","will – решение в момента, обещание, предвиждане. be going to – план, вече решен.","I'll help you. We're going to visit Greece."],["cond","Conditional","Условно изречение","Изречение с if (ако). 1-во: реална възможност (If it rains, I'll stay). 2-ро: въображаема ситуация (If I were rich, I would travel).","If you study, you will pass."]]},{"s":"Сравнения и количество","i":[["comp","Comparative","Сравнителна степен","Сравнява две неща („по-\"). Кратки думи: -er + than. Дълги думи: more + than.","bigger than, more expensive than"],["superl","Superlative","Превъзходна степен","Показва, че нещо е „най-\" от всички. Кратки: the + -est. Дълги: the most.","the biggest, the most expensive"],["freq","Adverbs of frequency","Наречия за честота","Показват колко често става нещо: always, usually, often, sometimes, rarely, never. Стоят ПРЕД основния глагол, но СЛЕД be.","I always walk. She is always late."],["countable","Countable noun","Броимо съществително","Нещо, което можем да преброим. Има единствено и множествено число и може да е с a/an.","an apple, two apples"],["uncountable","Uncountable noun","Неброимо съществително","Нещо, което не броим поотделно (течности, материали, идеи). Няма множествено число и не е с a/an.","water, money, advice, information"],["plural","Plural","Множествено число","Повече от едно. Обикновено + -s; след -s, -x, -ch, -sh → -es; съгласна + y → -ies. Има и неправилни: child → children.","books, boxes, cities, people"],["quantifier","Quantifier","Количествена дума","Дума за количество: some, any, much, many, a lot of, a few, a little, enough. Някои са само за броими, други – за неброими.","many friends, much time, a few eggs"],["possadj","Possessive adjective","Притежателно прилагателно","Показва на кого е нещо и стои ПРЕД съществително: my, your, his, her, its, our, their.","my bag, their house"],["posspron","Possessive pronoun","Притежателно местоимение","Показва на кого е нещо и стои САМО, без съществително: mine, yours, his, hers, ours, theirs.","This bag is mine."],["possessive","Possessive 's","Притежателна форма 's","Апостроф + s след човек показва притежание. В български казваме „на\" (колата на Мария).","Maria's car, my parents' house"],["reflexive","Reflexive pronoun","Възвратно местоимение","myself, yourself, herself... Използва се, когато някой прави нещо на себе си, или със значение „сам\".","She cut herself. I did it myself."]]},{"s":"Думи и значения","i":[["wf","Word family / word forms","Словоформи (семейство от думи)","Думи от един корен, които са различни части на речта. Често се различават по наставка.","happy – happiness – happily – unhappy"],["prefix","Prefix","Представка","Част в началото на думата, която променя значението ѝ: un-, im-, dis-, re-.","happy → unhappy; possible → impossible"],["suffix","Suffix","Наставка","Част в края на думата, която променя частта на речта: -ness, -tion, -ful, -ly, -er.","kind → kindness; teach → teacher"],["edingadj","-ed / -ing adjectives","Прилагателни на -ed и -ing","-ed описва как се чувства човек (I'm bored). -ing описва нещото, което предизвиква чувството (a boring film).","interested / interesting"],["synonym","Synonym","Синоним","Дума със същото или много близко значение.","big – large; start – begin"],["antonym","Antonym","Антоним","Дума с противоположно значение.","hot – cold; open – close"],["qw","Question words","Въпросителни думи","Думи, с които започват въпроси за информация: who, what, where, when, why, how, which, whose, how much, how many.","Where do you live?"],["phrasal","Phrasal verb","Фразов глагол","Глагол + малка дума (up, on, off...), които заедно имат ново значение.","get up = ставам; put on = обличам"]]}],"K":[{"id":"cat","l":"1","t":"Изчезналата котка","s":"Търси се котка","x":"Mrs Petrova is seventy-two years old. She lives in a small house on Rose Street with her cat, Mimi. Mimi is white and grey, and she is three years old. On Monday morning at eight o'clock, Mrs Petrova opened the door to get the newspaper, and Mimi ran out. Mrs Petrova looked for her all day. Her neighbour, Tom, helped her. Tom is a student and he walks his dog in the park every evening. At six o'clock, Tom heard a small sound from the garden of the old school, two hundred metres from the house. Mimi was in a tree! She was hungry and scared. Tom climbed the tree and brought Mimi home in his jacket. Mrs Petrova was very happy and gave Tom two pieces of cake.","b":"Госпожа Петрова е на седемдесет и две години. Живее в малка къща на улица „Роза\" с котката си Мими. Мими е бяла със сиво и е на три години. В понеделник сутринта в осем часа госпожа Петрова отвори вратата, за да вземе вестника, и Мими избяга навън. Госпожа Петрова я търси цял ден. Съседът ѝ Том ѝ помогна. Том е студент и всяка вечер разхожда кучето си в парка. В шест часа Том чу тихо звукче от двора на старото училище, на двеста метра от къщата. Мими беше на едно дърво! Беше гладна и уплашена. Том се покатери на дървото и донесе Мими вкъщи в якето си. Госпожа Петрова много се зарадва и даде на Том две парчета торта.","q":[["howold","How old is Mrs Petrova?",["seventy-two","three","twenty","eight"],"На колко години е госпожа Петрова?"],["where","Where does Mrs Petrova live?",["on Rose Street","in the park","at the old school","in a tree"],"Къде живее госпожа Петрова?"],["what","What colour is Mimi?",["white and grey","black","brown and white","yellow"],"Какъв цвят е Мими?"],["when","When did Mimi run out?",["on Monday morning","on Sunday evening","every evening","at night"],"Кога избяга Мими?"],["whattime","What time did Mrs Petrova open the door?",["at eight o'clock","at six o'clock","at two o'clock","at seven o'clock"],"В колко часа госпожа Петрова отвори вратата?"],["why","Why did Mrs Petrova open the door?",["to get the newspaper","to walk the dog","to see Tom","to buy cake"],"Защо госпожа Петрова отвори вратата?"],["who","Who helped Mrs Petrova?",["her neighbour, Tom","her daughter","a police officer","a teacher"],"Кой помогна на госпожа Петрова?"],["howoften","How often does Tom walk his dog?",["every evening","once a week","every morning","never"],"Колко често Том разхожда кучето си?"],["howfar","How far is the old school from the house?",["two hundred metres","two kilometres","ten metres","three hundred metres"],"Колко далеч е старото училище от къщата?"],["where","Where was Mimi?",["in a tree","under the bed","in the park","at the station"],"Къде беше Мими?"],["how","How did Tom bring Mimi home?",["in his jacket","in a box","in his bag","in his car"],"Как Том донесе Мими вкъщи?"],["howmany","How many pieces of cake did Tom get?",["two","one","three","four"],"Колко парчета торта получи Том?"]]},{"id":"wallet","l":"1","t":"Портфейлът в автобуса","s":"Търси се портфейл","x":"Peter is a waiter. He works at a café in the city centre. Every day he takes bus number 12 to work. The journey is twenty minutes long. Last Friday, Peter got off the bus at a quarter past nine and went into the café. Then he put his hand in his pocket – his wallet wasn't there! In the wallet there were fifty euros, his ID card and a photo of his daughter. Peter called the bus company. A woman on the phone said, \"A driver found a black wallet on bus 12. It was under a seat at the back. The driver's name is Ivan.\" Peter went to the bus station after work. Ivan gave him the wallet. Nothing was missing. Peter thanked Ivan and bought him a coffee.","b":"Петър е сервитьор. Работи в кафене в центъра на града. Всеки ден взима автобус номер 12 за работа. Пътуването трае двадесет минути. Миналия петък Петър слезе от автобуса в девет и петнадесет и влезе в кафенето. После бръкна в джоба си – портфейлът му го нямаше! В портфейла имаше петдесет евро, личната му карта и снимка на дъщеря му. Петър се обади на автобусната компания. Една жена по телефона каза: „Шофьор намери черен портфейл в автобус 12. Беше под седалка отзад. Шофьорът се казва Иван.\" Петър отиде на автогарата след работа. Иван му даде портфейла. Нищо не липсваше. Петър благодари на Иван и го почерпи с кафе.","q":[["what","What is Peter's job?",["a waiter","a driver","a teacher","a police officer"],"Каква е работата на Петър?"],["which","Which bus does Peter take to work?",["bus number 12","bus number 20","bus number 9","bus number 15"],"С кой автобус ходи Петър на работа?"],["howlong","How long is the journey?",["twenty minutes","fifteen minutes","an hour","two hours"],"Колко време трае пътуването?"],["when","When did Peter lose his wallet?",["last Friday","last Monday","yesterday evening","on Sunday"],"Кога изгуби Петър портфейла си?"],["whattime","What time did Peter get off the bus?",["at a quarter past nine","at twelve o'clock","at half past eight","at nine o'clock in the evening"],"В колко часа слезе Петър от автобуса?"],["howmuch","How much money was in the wallet?",["fifty euros","twelve euros","twenty euros","fifteen euros"],"Колко пари имаше в портфейла?"],["whose","Whose photo was in the wallet?",["his daughter's","his wife's","Ivan's","his mother's"],"Чия снимка имаше в портфейла?"],["who","Who found the wallet?",["a driver called Ivan","a woman on the phone","Peter's daughter","a waiter"],"Кой намери портфейла?"],["where","Where was the wallet?",["under a seat at the back","in the café","in Peter's pocket","at the door"],"Къде беше портфейлът?"],["what","What colour was the wallet?",["black","brown","red","white"],"Какъв цвят беше портфейлът?"],["how","How did Peter contact the bus company?",["he called them","he sent an email","he went to the office","he wrote a letter"],"Как се свърза Петър с автобусната компания?"],["why","Why did Peter buy Ivan a coffee?",["to thank him","because Ivan was tired","because it was Friday","because he was a waiter"],"Защо Петър почерпи Иван с кафе?"]]},{"id":"bike","l":"2","t":"Откраднатият велосипед","s":"Търси се велосипед","x":"Sara is fifteen and she goes to Lincoln School. She cycles to school every day because she lives three kilometres away. Her bike is new and red, and it has a small basket on the front. Her grandfather gave it to her for her birthday. On Wednesday afternoon, Sara left school at half past three and went to the bike park. Her bike wasn't there! Sara told the school guard, Mr Hill. He has worked at the school for twenty years and he knows everyone. Mr Hill checked the school camera. At ten past two, a tall boy in a green jacket took a red bike. \"That's Daniel from class 9B,\" said Mr Hill. \"He has the same bike, but his is blue.\" The next morning, Daniel came to the guard's office. He said, \"I'm so sorry! I was in a hurry and I didn't look carefully.\" Sara got her bike back, and Daniel found his blue bike behind the gym.","b":"Сара е на петнадесет години и учи в училище „Линкълн\". Всеки ден ходи на училище с колело, защото живее на три километра. Колелото ѝ е ново и червено и има малка кошничка отпред. Дядо ѝ ѝ го подари за рождения ден. В сряда следобед Сара излезе от училище в три и половина и отиде на паркинга за колела. Колелото ѝ го нямаше! Сара каза на охранителя на училището, господин Хил. Той работи в училището от двадесет години и познава всички. Господин Хил провери училищната камера. В два и десет високо момче със зелено яке беше взело червено колело. „Това е Даниел от 9Б клас – каза господин Хил. – Той има същото колело, но неговото е синьо.\" На следващата сутрин Даниел дойде в стаята на охранителя. Каза: „Много съжалявам! Бързах и не погледнах внимателно.\" Сара си получи колелото обратно, а Даниел намери синьото си колело зад физкултурния салон.","q":[["howold","How old is Sara?",["fifteen","twenty","nine","three"],"На колко години е Сара?"],["howoften","How often does Sara cycle to school?",["every day","on Wednesdays","once a week","sometimes"],"Колко често Сара ходи на училище с колело?"],["howfar","How far does Sara live from school?",["three kilometres","twenty kilometres","two kilometres","fifteen kilometres"],"На какво разстояние от училището живее Сара?"],["who","Who gave Sara the bike?",["her grandfather","Mr Hill","Daniel","her teacher"],"Кой подари колелото на Сара?"],["whattime","What time did Sara leave school?",["at half past three","at ten past two","at nine o'clock","at three o'clock"],"В колко часа Сара излезе от училище?"],["howlong","How long has Mr Hill worked at the school?",["for twenty years","for fifteen years","for three years","since Wednesday"],"От колко време работи господин Хил в училището?"],["how","How did Mr Hill find the thief?",["he checked the school camera","he asked the teachers","he called the police","he followed Daniel"],"Как господин Хил откри кой е взел колелото?"],["what","What was the boy wearing?",["a green jacket","a red jacket","a blue coat","a school uniform"],"Какво носеше момчето?"],["which","Which class is Daniel in?",["9B","9A","5B","15B"],"В кой клас е Даниел?"],["why","Why did Daniel take the wrong bike?",["he was in a hurry","he wanted a new bike","he didn't like his bike","he was angry with Sara"],"Защо Даниел взе чуждото колело?"],["whose","Whose bike is blue?",["Daniel's","Sara's","Mr Hill's","her grandfather's"],"Чие колело е синьо?"],["where","Where was Daniel's bike?",["behind the gym","in the bike park","at the guard's office","at home"],"Къде беше колелото на Даниел?"]]},{"id":"boy","l":"2","t":"Изгубеното момче на пазара","s":"Търси се дете","x":"On Saturday morning, the Georgiev family went to the big market in the town square. There were hundreds of people there. Mrs Georgieva bought vegetables, and Mr Georgiev looked at old books. Their son, Niki, is six years old. He was wearing a yellow T-shirt and a blue cap. At about eleven o'clock, his parents turned around – and Niki wasn't there! They looked everywhere for fifteen minutes. Then Mr Georgiev ran to a police officer. Officer Dimitrova asked, \"What does he like?\" \"Ice cream and animals,\" said Mrs Georgieva. The officer thought for a moment. \"There's a man with rabbits and chickens at the end of the market, about a hundred metres from here.\" They ran there together. Niki was sitting next to a box of baby rabbits with an ice cream in his hand. The rabbit man had bought it for him. \"I wanted to see the rabbits,\" Niki said. His mother hugged him, and the family bought a small rabbit for him to take home.","b":"В събота сутринта семейство Георгиеви отидоха на големия пазар на градския площад. Там имаше стотици хора. Госпожа Георгиева купуваше зеленчуци, а господин Георгиев разглеждаше стари книги. Синът им Ники е на шест години. Носеше жълта тениска и синя шапка с козирка. Около единадесет часа родителите му се обърнаха – и Ники го нямаше! Търсиха го навсякъде петнадесет минути. Тогава господин Георгиев изтича до една полицайка. Полицай Димитрова попита: „Какво обича той?\" „Сладолед и животни\" – каза госпожа Георгиева. Полицайката се замисли за момент. „В края на пазара има един човек със зайци и кокошки, на около сто метра оттук.\" Изтичаха там заедно. Ники седеше до кутия с малки зайчета със сладолед в ръка. Човекът със зайците му го беше купил. „Исках да видя зайчетата\" – каза Ники. Майка му го прегърна и семейството му купи малко зайче, което да вземе вкъщи.","q":[["where","Where did the family go?",["to the market in the town square","to the zoo","to a farm","to a bookshop"],"Къде отиде семейството?"],["when","When did they go there?",["on Saturday morning","on Sunday evening","on Friday afternoon","every day"],"Кога отидоха там?"],["what","What did Mrs Georgieva buy?",["vegetables","old books","ice cream","a rabbit"],"Какво купуваше госпожа Георгиева?"],["howold","How old is Niki?",["six","eleven","fifteen","a hundred"],"На колко години е Ники?"],["what","What was Niki wearing?",["a yellow T-shirt and a blue cap","a blue T-shirt and a yellow cap","a red jacket","a green coat"],"Какво носеше Ники?"],["whattime","What time did Niki disappear?",["at about eleven o'clock","at about six o'clock","at fifteen minutes past ten","at noon"],"Около колко часа изчезна Ники?"],["howlong","How long did the parents look for Niki?",["for fifteen minutes","for an hour","for eleven minutes","all day"],"Колко време търсиха родителите Ники?"],["who","Who helped the family?",["a police officer","a bookseller","the rabbit man","a teacher"],"Кой помогна на семейството?"],["howmany","How many people were at the market?",["hundreds","fifteen","six","eleven"],"Колко хора имаше на пазара?"],["howfar","How far was the man with the rabbits?",["about a hundred metres","about a kilometre","about fifteen metres","about six metres"],"Колко далеч беше човекът със зайците?"],["why","Why did Niki go there?",["he wanted to see the rabbits","he wanted to buy books","he was hungry","he was looking for the police"],"Защо Ники отиде там?"],["who","Who bought Niki the ice cream?",["the rabbit man","his mother","Officer Dimitrova","his father"],"Кой купи сладоледа на Ники?"]]},{"id":"necklace","l":"2","t":"Огърлицата в хотела","s":"Търси се бижу","x":"Anna and her husband Mark were on holiday at the Blue Sea Hotel for a week. On their third day, Anna wanted to wear her gold necklace to dinner, but it wasn't in her suitcase. It was a present from her mother, and it was worth about eight hundred euros. Anna went to the reception at seven o'clock in the evening. The manager, Mr Kostov, said, \"Don't worry. Our cleaners clean every room twice a day. I'll ask them.\" Two cleaners, Maria and Elena, cleaned room 214 that morning. Maria said, \"I saw a gold necklace on the bathroom floor. I put it in the small box next to the mirror.\" Anna went back to the room and looked in the box. The necklace was there! \"I was in a hurry this morning,\" Anna said. \"I took it off when I had a shower.\" Mark laughed, and they went to dinner. The next day, Anna gave Maria a box of chocolates.","b":"Ана и съпругът ѝ Марк бяха на почивка в хотел „Синьо море\" за една седмица. На третия ден Ана искаше да сложи златната си огърлица за вечеря, но тя не беше в куфара ѝ. Беше подарък от майка ѝ и струваше около осемстотин евро. Ана отиде на рецепцията в седем часа вечерта. Управителят, господин Костов, каза: „Не се тревожете. Нашите камериерки почистват всяка стая два пъти на ден. Ще ги попитам.\" Две камериерки, Мария и Елена, бяха почистили стая 214 тази сутрин. Мария каза: „Видях златна огърлица на пода в банята. Сложих я в малката кутийка до огледалото.\" Ана се върна в стаята и погледна в кутийката. Огърлицата беше там! „Бързах тази сутрин – каза Ана. – Свалих я, когато си взех душ.\" Марк се засмя и отидоха на вечеря. На следващия ден Ана подари на Мария кутия шоколадови бонбони.","q":[["howlong","How long were Anna and Mark on holiday?",["for a week","for three days","for two weeks","for a month"],"Колко време бяха на почивка Ана и Марк?"],["which","Which hotel were they in?",["the Blue Sea Hotel","the Gold Hotel","the Rose Hotel","the Mountain Hotel"],"В кой хотел бяха?"],["whose","Whose present was the necklace?",["her mother's","Mark's","Maria's","Mr Kostov's"],"Чий подарък беше огърлицата?"],["howmuch","How much was the necklace worth?",["about eight hundred euros","about eighty euros","about two hundred euros","about eight thousand euros"],"Колко струваше огърлицата?"],["whattime","What time did Anna go to the reception?",["at seven o'clock in the evening","at seven o'clock in the morning","at two o'clock","at midnight"],"В колко часа отиде Ана на рецепцията?"],["who","Who is Mr Kostov?",["the manager","a cleaner","Anna's husband","a waiter"],"Кой е господин Костов?"],["howoften","How often do the cleaners clean the rooms?",["twice a day","once a week","every hour","three times a day"],"Колко често камериерките почистват стаите?"],["which","Which room did Anna and Mark stay in?",["room 214","room 241","room 124","room 412"],"В коя стая бяха отседнали Ана и Марк?"],["where","Where did Maria see the necklace?",["on the bathroom floor","in the suitcase","at the reception","in the restaurant"],"Къде видя Мария огърлицата?"],["where","Where did Maria put it?",["in the small box next to the mirror","in Anna's suitcase","in her pocket","at the reception"],"Къде я сложи Мария?"],["why","Why did Anna take off the necklace?",["she had a shower","she went to dinner","it was heavy","she wanted to sell it"],"Защо Ана свали огърлицата?"],["what","What did Anna give Maria?",["a box of chocolates","some money","a necklace","flowers"],"Какво подари Ана на Мария?"]]},{"id":"painting","l":"2","t":"Картината от музея","s":"Търси се картина","x":"The City Museum opened in 1910, and it is famous for its collection of Bulgarian paintings. Last Tuesday, the museum guard, Mr Nikolov, arrived at work at half past seven. When he walked into Room 5, he saw an empty wall. \"The Old Bridge\", a small painting by Ivan Markov, was missing! It is about a hundred years old. Detective Stoyanova arrived at eight o'clock. She found three important clues: a window that wasn't closed properly, a wet footprint and a blue museum ticket from Monday. The museum has a hundred and twenty visitors a day on average. However, the camera showed that only one person stayed after closing time on Monday – a young art student called Leo. The detective found Leo at the university. He looked very nervous. \"I didn't steal it!\" he said. \"I wanted to take a photo for my project, but I knocked the painting off the wall. The frame broke, so I took it to a repair shop on Lake Street to fix it. I wanted to bring it back today.\" The painting was at the shop, three streets away from the museum. Leo had to pay for the repair and do fifty hours of work at the museum.","b":"Градският музей е отворен през 1910 г. и е известен със своята колекция от български картини. Миналия вторник пазачът на музея, господин Николов, пристигна на работа в седем и половина. Когато влезе в Зала 5, видя празна стена. „Старият мост\" – малка картина на Иван Марков – липсваше! Тя е на около сто години. Детектив Стоянова пристигна в осем часа. Тя намери три важни улики: прозорец, който не беше добре затворен, мокра следа от обувка и син музеен билет от понеделник. Музеят има средно сто и двадесет посетители на ден. Камерата обаче показа, че само един човек е останал след затварянето в понеделник – млад студент по изкуство на име Лео. Детективката намери Лео в университета. Той изглеждаше много притеснен. „Не съм я откраднал! – каза той. – Исках да направя снимка за проекта си, но съборих картината от стената. Рамката се счупи, затова я занесох в работилница на улица „Езерна\", за да я поправят. Исках да я върна днес.\" Картината беше в работилницата, на три улици от музея. Лео трябваше да плати поправката и да отработи петдесет часа в музея.","q":[["when","When did the museum open?",["in 1910","last Tuesday","in 1920","a hundred years ago"],"Кога е отворен музеят?"],["whattime","What time did Mr Nikolov arrive at work?",["at half past seven","at eight o'clock","at half past eight","at seven o'clock"],"В колко часа пристигна господин Николов на работа?"],["which","Which room was the painting in?",["Room 5","Room 3","Room 120","Room 50"],"В коя зала беше картината?"],["howold","How old is the painting?",["about a hundred years old","about fifty years old","about twenty years old","about three hundred years old"],"На колко години е картината?"],["howmany","How many clues did the detective find?",["three","five","one","fifty"],"Колко улики намери детективката?"],["what","What colour was the ticket?",["blue","red","green","white"],"Какъв цвят беше билетът?"],["howmany","How many visitors does the museum have a day?",["a hundred and twenty","a hundred","fifty","twenty"],"Колко посетители на ден има музеят?"],["who","Who stayed after closing time?",["a young art student called Leo","Mr Nikolov","Detective Stoyanova","Ivan Markov"],"Кой остана след затварянето?"],["why","Why did Leo stay in the museum?",["he wanted to take a photo for his project","he wanted to sell the painting","he was lost","he was the guard"],"Защо Лео остана в музея?"],["how","How did the frame break?",["Leo knocked the painting off the wall","the window was open","the guard dropped it","it was very old"],"Как се счупи рамката?"],["howfar","How far is the repair shop from the museum?",["three streets away","a hundred metres away","three kilometres away","next door"],"Колко далеч е работилницата от музея?"],["howlong","How long must Leo work at the museum?",["fifty hours","five hours","a hundred hours","three days"],"Колко време трябва да работи Лео в музея?"]]},{"id":"laptop","l":"2","t":"Изчезналият лаптоп","s":"Търси се лаптоп","x":"Victoria is a manager at a travel agency called Sunny Trips. On Thursday she had an important meeting with clients from Germany at two o'clock. At half past one she went to the kitchen to make a cup of tea, and when she came back five minutes later, her silver laptop had disappeared from her desk. All her presentations for the meeting were on it! There are eight people in the office. Victoria asked everyone. Boris, the youngest employee, said he had been on the phone the whole time. Lily from accounts said she had seen the cleaner, Mr Ivanov, near Victoria's desk. Mr Ivanov comes to the office three times a week, but he usually works in the evenings, so it was strange that he was there at lunchtime. Victoria found him in the corridor. \"Oh, the laptop!\" he said. \"It was next to an open bottle of water, and I was afraid the water would fall on it. I put it in the meeting room on the shelf.\" Victoria laughed with relief. She ran to the meeting room, found the laptop and started the presentation exactly on time.","b":"Виктория е мениджър в туристическа агенция „Слънчеви пътувания\". В четвъртък имаше важна среща с клиенти от Германия в два часа. В един и половина тя отиде в кухнята да си направи чаша чай и когато се върна пет минути по-късно, сребристият ѝ лаптоп беше изчезнал от бюрото ѝ. Всичките ѝ презентации за срещата бяха на него! В офиса работят осем души. Виктория попита всички. Борис, най-младият служител, каза, че през цялото време е говорил по телефона. Лили от счетоводството каза, че е видяла чистача, господин Иванов, близо до бюрото на Виктория. Господин Иванов идва в офиса три пъти седмично, но обикновено работи вечер, така че беше странно, че е там по обяд. Виктория го намери в коридора. „А, лаптопът! – каза той. – Беше до отворена бутилка вода и се уплаших, че водата ще се разлее върху него. Сложих го в заседателната зала на рафта.\" Виктория се засмя с облекчение. Изтича в заседателната зала, намери лаптопа и започна презентацията точно навреме.","q":[["what","What is the name of the travel agency?",["Sunny Trips","Blue Sea","Happy Travel","Green Tours"],"Как се казва туристическата агенция?"],["who","Who did Victoria have a meeting with?",["clients from Germany","Mr Ivanov","Boris and Lily","her boss"],"С кого имаше среща Виктория?"],["whattime","What time was the meeting?",["at two o'clock","at half past one","at five o'clock","in the evening"],"В колко часа беше срещата?"],["why","Why did Victoria go to the kitchen?",["to make a cup of tea","to talk to Lily","to find the cleaner","to eat lunch"],"Защо Виктория отиде в кухнята?"],["howlong","How long was Victoria away from her desk?",["five minutes","half an hour","two hours","one minute"],"Колко време отсъства Виктория от бюрото си?"],["what","What colour is the laptop?",["silver","black","white","gold"],"Какъв цвят е лаптопът?"],["howmany","How many people are there in the office?",["eight","five","three","two"],"Колко души има в офиса?"],["who","Who saw the cleaner near the desk?",["Lily from accounts","Boris","Victoria","the clients"],"Кой видя чистача близо до бюрото?"],["howoften","How often does Mr Ivanov come to the office?",["three times a week","every day","once a month","twice a week"],"Колко често идва господин Иванов в офиса?"],["why","Why did Mr Ivanov move the laptop?",["he was afraid the water would fall on it","he wanted to steal it","Victoria asked him","he needed the desk"],"Защо господин Иванов премести лаптопа?"],["where","Where was the laptop?",["in the meeting room on the shelf","in the kitchen","in the corridor","under Boris's desk"],"Къде беше лаптопът?"],["whose","Whose laptop disappeared?",["Victoria's","Boris's","Lily's","Mr Ivanov's"],"Чий лаптоп изчезна?"]]},{"id":"hiker","l":"2","t":"Изгубеният турист в планината","s":"Търси се човек","x":"James is a thirty-four-year-old tourist from Scotland. Last August he came to Bulgaria to walk in the Rila Mountains. On Sunday morning he left the hotel in Borovets at six o'clock. He told the receptionist that he wanted to walk to Musala peak and be back by four in the afternoon. The walk is about twelve kilometres each way. At five o'clock James still hadn't returned, and he wasn't answering his phone, so the receptionist called the mountain rescue team. Six rescuers started looking for him. A shepherd said he had seen a man with an orange backpack near the lakes at about two o'clock. The weather had changed and there was thick fog. At nine in the evening, the rescuers found James in a small hut near the lakes. He was cold but safe. \"My phone battery was dead,\" he explained, \"and I couldn't see the path because of the fog. So I decided to wait in the hut.\" The rescuers gave him hot tea and walked with him back to the hotel. It took three hours.","b":"Джеймс е тридесет и четири годишен турист от Шотландия. Миналия август дойде в България, за да ходи в Рила планина. В неделя сутринта излезе от хотела в Боровец в шест часа. Каза на рецепционистката, че иска да стигне до връх Мусала и да се върне до четири следобед. Преходът е около дванадесет километра в едната посока. В пет часа Джеймс още не се беше върнал и не вдигаше телефона си, затова рецепционистката се обади на планинската спасителна служба. Шестима спасители започнаха да го търсят. Един овчар каза, че е видял мъж с оранжева раница близо до езерата около два часа. Времето се беше променило и имаше гъста мъгла. В девет вечерта спасителите намериха Джеймс в малка хижа близо до езерата. Беше му студено, но беше в безопасност. „Батерията на телефона ми беше паднала – обясни той, – и не виждах пътеката заради мъглата. Затова реших да чакам в хижата.\" Спасителите му дадоха горещ чай и вървяха с него обратно до хотела. Отне им три часа.","q":[["howold","How old is James?",["thirty-four","forty-three","twelve","six"],"На колко години е Джеймс?"],["where","Where is James from?",["Scotland","Bulgaria","Ireland","England"],"Откъде е Джеймс?"],["when","When did he come to Bulgaria?",["last August","last Sunday","in the winter","two years ago"],"Кога дойде в България?"],["whattime","What time did he leave the hotel?",["at six o'clock","at four o'clock","at five o'clock","at nine o'clock"],"В колко часа излезе от хотела?"],["howfar","How far is the walk to Musala peak?",["about twelve kilometres each way","about six kilometres","about twenty kilometres","about two kilometres"],"Колко дълъг е преходът до връх Мусала?"],["who","Who called the mountain rescue team?",["the receptionist","James","a shepherd","his wife"],"Кой се обади на планинската спасителна служба?"],["howmany","How many rescuers looked for him?",["six","twelve","three","two"],"Колко спасители го търсиха?"],["which","Which colour was James's backpack?",["orange","red","blue","green"],"Какъв цвят беше раницата на Джеймс?"],["why","Why couldn't James see the path?",["because of the fog","because it was dark","because of the snow","because he lost his glasses"],"Защо Джеймс не виждаше пътеката?"],["where","Where did the rescuers find him?",["in a small hut near the lakes","at Musala peak","in the hotel","in the forest"],"Къде го намериха спасителите?"],["how","How did James feel when they found him?",["cold but safe","hot and tired","angry","hungry and scared"],"Как се чувстваше Джеймс, когато го намериха?"],["howlong","How long did it take to walk back to the hotel?",["three hours","twelve hours","one hour","six hours"],"Колко време отне връщането до хотела?"]]},{"id":"ring","l":"2","t":"Пръстенът в ресторанта","s":"Търси се пръстен","x":"Daniel had planned everything for a month. On Friday evening he was going to ask his girlfriend, Rosa, to marry him at their favourite restaurant, La Luna. He gave the diamond ring to the waiter, Marco, at seven o'clock and asked him to put it in Rosa's dessert. Rosa arrived at half past seven. They had a lovely dinner, but when the chocolate cake arrived, there was no ring in it! Daniel went pale. He quietly asked Marco what had happened. Marco went to the kitchen and talked to the chef, who had made four chocolate cakes that evening. Two of them had already gone to other tables. At table 9, an old woman was about to eat her cake when Marco stopped her. \"Excuse me, madam, I think there's something special in your dessert.\" Inside the cake was the ring. Everyone in the restaurant clapped. Marco brought the ring to Daniel's table on a small plate. Daniel got down on one knee, and Rosa said yes. The old woman said it was the most exciting dinner she had had in years.","b":"Даниел беше планирал всичко цял месец. В петък вечерта щеше да предложи брак на приятелката си Роза в любимия им ресторант „Ла Луна\". Даде диамантения пръстен на сервитьора Марко в седем часа и го помоли да го сложи в десерта на Роза. Роза пристигна в седем и половина. Вечеряха чудесно, но когато шоколадовата торта пристигна, в нея нямаше пръстен! Даниел пребледня. Тихо попита Марко какво се е случило. Марко отиде в кухнята и говори с готвача, който беше направил четири шоколадови торти тази вечер. Две от тях вече бяха отишли на други маси. На маса 9 една възрастна жена тъкмо щеше да изяде тортата си, когато Марко я спря. „Извинете, госпожо, мисля, че в десерта ви има нещо специално.\" В тортата беше пръстенът. Всички в ресторанта заръкопляскаха. Марко донесе пръстена до масата на Даниел в малка чинийка. Даниел коленичи и Роза каза „да\". Възрастната жена каза, че това е била най-вълнуващата вечеря от години.","q":[["howlong","How long had Daniel planned everything?",["for a month","for a week","for a year","for two days"],"От колко време планираше Даниел всичко?"],["which","Which restaurant did they go to?",["La Luna","La Rosa","Marco's","Table 9"],"В кой ресторант отидоха?"],["whattime","What time did Daniel give the ring to the waiter?",["at seven o'clock","at half past seven","at nine o'clock","at eight o'clock"],"В колко часа Даниел даде пръстена на сервитьора?"],["who","Who did Daniel give the ring to?",["the waiter, Marco","the chef","Rosa","an old woman"],"На кого даде Даниел пръстена?"],["what","What dessert did Rosa get?",["chocolate cake","ice cream","fruit salad","apple pie"],"Какъв десерт получи Роза?"],["howmany","How many chocolate cakes did the chef make?",["four","two","nine","one"],"Колко шоколадови торти направи готвачът?"],["which","Which table was the old woman at?",["table 9","table 4","table 2","table 7"],"На коя маса седеше възрастната жена?"],["where","Where was the ring?",["inside the old woman's cake","in the kitchen","in Daniel's pocket","under the plate"],"Къде беше пръстенът?"],["how","How did Marco bring the ring to the table?",["on a small plate","in a box","in his hand","in a glass"],"Как Марко донесе пръстена до масата?"],["what","What did everyone in the restaurant do?",["they clapped","they left","they laughed at Daniel","they sang"],"Какво направиха всички в ресторанта?"],["whose","Whose dessert had the ring at the end?",["the old woman's","Rosa's","Daniel's","Marco's"],"В чий десерт беше пръстенът накрая?"],["why","Why did Daniel go pale?",["there was no ring in the cake","the cake was bad","Rosa was late","he lost his money"],"Защо Даниел пребледня?"]]},{"id":"suitcase","l":"2","t":"Сбърканият куфар","s":"Търси се куфар","x":"Elena flew from Sofia to London last month to visit her sister. The flight took three and a half hours. At the airport in London, she took a black suitcase from the belt and went to her sister's flat by train. When she opened the suitcase, she saw men's shirts, a big pair of shoes and a book in Italian. It wasn't her suitcase! Inside there was a name card: \"Paolo Rossi, Milan\". Elena called the airport. The woman at the lost luggage office said, \"Mr Rossi called us an hour ago. He has your suitcase. He is staying at the Park Hotel, about two kilometres from you.\" Elena went to the hotel the same evening. Paolo was waiting in the lobby with her suitcase. It was black too, but it had a small pink ribbon on the handle. \"I didn't see the ribbon,\" Paolo said. \"I'm so sorry!\" They laughed and exchanged suitcases. Now Elena has two ribbons on her suitcase, and she always checks the name before she leaves the airport.","b":"Миналия месец Елена летя от София до Лондон, за да посети сестра си. Полетът продължи три часа и половина. На летището в Лондон тя взе черен куфар от лентата и отиде с влак до апартамента на сестра си. Когато отвори куфара, видя мъжки ризи, голям чифт обувки и книга на италиански. Не беше нейният куфар! Вътре имаше картичка с име: „Паоло Роси, Милано\". Елена се обади на летището. Жената в бюрото за изгубен багаж каза: „Господин Роси ни се обади преди час. Вашият куфар е при него. Той е отседнал в хотел „Парк\", на около два километра от вас.\" Елена отиде в хотела същата вечер. Паоло я чакаше във фоайето с куфара ѝ. И той беше черен, но имаше малка розова панделка на дръжката. „Не видях панделката – каза Паоло. – Много съжалявам!\" Те се засмяха и си размениха куфарите. Сега Елена има две панделки на куфара си и винаги проверява името, преди да излезе от летището.","q":[["where","Where did Elena fly to?",["to London","to Milan","to Sofia","to Rome"],"Закъде летя Елена?"],["why","Why did she go there?",["to visit her sister","to work","to meet Paolo","to study English"],"Защо отиде там?"],["howlong","How long was the flight?",["three and a half hours","two hours","an hour","five hours"],"Колко време продължи полетът?"],["how","How did she get to her sister's flat?",["by train","by taxi","by bus","on foot"],"Как стигна до апартамента на сестра си?"],["what","What was in the wrong suitcase?",["men's shirts, big shoes and an Italian book","women's dresses","Elena's clothes","a pink ribbon"],"Какво имаше в сбъркания куфар?"],["whose","Whose suitcase did Elena take?",["Paolo Rossi's","her sister's","the airport's","a woman's"],"Чий куфар взе Елена?"],["where","Where is Paolo from?",["Milan","London","Sofia","Paris"],"Откъде е Паоло?"],["when","When did Mr Rossi call the airport?",["an hour ago","yesterday","last month","in the evening"],"Кога се обади господин Роси на летището?"],["which","Which hotel is Paolo staying at?",["the Park Hotel","the Airport Hotel","the Blue Hotel","the London Hotel"],"В кой хотел е отседнал Паоло?"],["howfar","How far is the hotel from Elena?",["about two kilometres","about twenty kilometres","about two hundred metres","next door"],"Колко далеч е хотелът от Елена?"],["what","What was on the handle of Elena's suitcase?",["a small pink ribbon","a name card","a big lock","a red label"],"Какво имаше на дръжката на куфара на Елена?"],["howmany","How many ribbons does Elena have on her suitcase now?",["two","one","three","none"],"Колко панделки има сега Елена на куфара си?"]]},{"id":"bakery","l":"2","t":"Крадецът на кифлички","s":"Търси се крадец","x":"Mr Popov has a small bakery on Station Road. He gets up at four o'clock every morning and starts baking at five. He makes a hundred and fifty bread rolls every day. But for three days, ten rolls disappeared every morning from the table near the back door. Mr Popov was angry. On Thursday he hid behind the flour bags and waited. At half past six, the back door opened very slowly. A small brown dog came in, took a roll in its mouth and ran out! Mr Popov followed the dog down the street. It ran about three hundred metres to an old garage, where four puppies were waiting. The mother dog was giving the bread to her babies. Mr Popov felt sorry for them. He called his friend Ana, who works at an animal centre. Now the puppies live with families in the town, and the mother dog lives at the bakery. Her name is Bun, and she guards the bread every morning.","b":"Господин Попов има малка пекарна на улица „Гарова\". Става в четири часа всяка сутрин и започва да пече в пет. Прави по сто и петдесет кифлички всеки ден. Но три дни подред всяка сутрин изчезваха по десет кифлички от масата до задната врата. Господин Попов беше ядосан. В четвъртък той се скри зад чувалите с брашно и зачака. В шест и половина задната врата се отвори много бавно. Малко кафяво куче влезе, взе кифличка в устата си и избяга! Господин Попов проследи кучето по улицата. То изтича около триста метра до един стар гараж, където чакаха четири кученца. Майката даваше хляба на малките си. На господин Попов му домъчня за тях. Обади се на приятелката си Ана, която работи в център за животни. Сега кученцата живеят при семейства в града, а майката живее в пекарната. Казва се Кифла и всяка сутрин пази хляба.","q":[["where","Where is Mr Popov's bakery?",["on Station Road","on Rose Street","in the old garage","near the animal centre"],"Къде е пекарната на господин Попов?"],["whattime","What time does Mr Popov get up?",["at four o'clock","at five o'clock","at half past six","at three o'clock"],"В колко часа става господин Попов?"],["howmany","How many rolls does he make every day?",["a hundred and fifty","ten","fifty","three hundred"],"Колко кифлички прави всеки ден?"],["howlong","How long did the rolls disappear for?",["for three days","for a week","for four days","for ten days"],"Колко време изчезваха кифличките?"],["howmany","How many rolls disappeared every morning?",["ten","four","three","a hundred"],"Колко кифлички изчезваха всяка сутрин?"],["where","Where did Mr Popov hide?",["behind the flour bags","in the garage","under the table","behind the door"],"Къде се скри господин Попов?"],["who","Who was the thief?",["a small brown dog","a hungry boy","Ana","a cat"],"Кой беше крадецът?"],["howfar","How far did the dog run?",["about three hundred metres","about three kilometres","about ten metres","about a hundred metres"],"Колко далеч изтича кучето?"],["why","Why did the dog take the bread?",["to give it to her puppies","because Mr Popov gave it to her","to play","to hide it"],"Защо кучето взимаше хляба?"],["who","Who works at an animal centre?",["Ana","Mr Popov","Bun","the puppies"],"Кой работи в център за животни?"],["whose","Whose babies were in the garage?",["the mother dog's","Ana's","Mr Popov's","a cat's"],"Чии бебета бяха в гаража?"],["howoften","How often does Bun guard the bread?",["every morning","every evening","once a week","on Thursdays"],"Колко често Кифла пази хляба?"]]}],"TO":[{"id":"station","l":"1","t":"Къде е гарата?","s":"Малък град, главната улица","x":"You arrive in a small town by bus. You are standing at the start of the main street (⭐). Your train leaves from the train station at a quarter past ten. It is five past ten now. You don't know where the station is.","y":"Пристигате в малък град с автобус. Стоите в началото на главната улица (⭐). Влакът ви тръгва от гарата в десет и петнадесет. Сега е десет и пет. Не знаете къде е гарата.","m":[["·","🏦","☕","🏪","🌳","🏨"],["⭐","═","═","═","═","═"],["·","💊","📮","🥖","🚉","⛪"]],"lg":"🏦=bank;☕=café;🏪=shop;🌳=park;🏨=hotel;💊=pharmacy;📮=post office;🥖=bakery;🚉=station;⛪=church","st":[{"k":"B","g":"ask","q":"Попитайте учтиво къде е гарата.","c":["Excuse me,","where is","the train station?"],"d":["who is","the train station at"],"b":"Извинете, къде е гарата?"},{"k":"C","g":"give","q":"A woman answers you. Which answer is correct for the map?","o":["Go straight on. It's on the right, opposite the park.","Go straight on. It's on the left, next to the bank.","Turn left. It's behind the hotel.","Go back. It's opposite the café."],"b":"Жената ви отговаря. Кой отговор е верен според картата?"},{"k":"C","g":"env","q":"What is next to the station?","o":["the bakery and the church","the bank and the café","the park and the hotel","the pharmacy and the post office"],"b":"Какво има до гарата?"},{"k":"G","g":"env","q":"The café is {between;behind;under} the bank and the shop, and the post office is {opposite;inside;above} the café.","b":"Кафенето е между банката и магазина, а пощата е срещу кафенето."},{"k":"C","g":"env","q":"Which building is opposite the bank?","o":["the pharmacy","the church","the hotel","the bakery"],"b":"Коя сграда е срещу банката?"},{"k":"C","g":"time","q":"The walk to the station takes five minutes. It's five past ten. What time will you arrive?","o":["at ten past ten","at a quarter past ten","at half past ten","at five to ten"],"b":"Пътят до гарата е пет минути. Сега е десет и пет. В колко часа ще пристигнете?"},{"k":"G","g":"time","q":"Your train leaves at a quarter past ten, so you will have {five;fifteen;fifty} minutes to buy a ticket. You {will;won't;don't} miss the train!","b":"Влакът тръгва в десет и петнадесет, така че ще имате пет минути да си купите билет. Няма да изпуснете влака!"},{"k":"B","g":"ask","q":"Благодарете на жената.","c":["Thank you","very much","for your help!"],"d":["very many","for your helping"],"b":"Благодаря ви много за помощта!"}]},{"id":"hotel","l":"1","t":"В хотела","s":"Рецепцията, първият ден","x":"You are a guest at the Sunny Hotel. You are at reception on the ground floor. The restaurant is on the first floor, next to the lift. The swimming pool is outside, behind the hotel. The gym is in the basement. Breakfast is from seven to ten o'clock, and the pool is open from nine in the morning to eight in the evening.","y":"Гост сте в хотел „Слънчев\". Намирате се на рецепцията на партерния етаж. Ресторантът е на първия етаж, до асансьора. Басейнът е навън, зад хотела. Фитнесът е в сутерена. Закуската е от седем до десет часа, а басейнът работи от девет сутринта до осем вечерта.","m":[],"lg":"","st":[{"k":"B","g":"ask","q":"Попитайте къде е ресторантът.","c":["Excuse me,","where is","the restaurant?"],"d":["where are","the restaurant in"],"b":"Извинете, къде е ресторантът?"},{"k":"C","g":"give","q":"What does the receptionist say?","o":["It's on the first floor, next to the lift.","It's in the basement, behind the lift.","It's outside, behind the hotel.","It's on the ground floor, opposite reception."],"b":"Какво казва рецепционистката?"},{"k":"C","g":"env","q":"Where is the swimming pool?","o":["outside, behind the hotel","in the basement","on the first floor","next to reception"],"b":"Къде е басейнът?"},{"k":"G","g":"env","q":"The gym is {in;on;at} the basement, and the restaurant is {on;in;under} the first floor.","b":"Фитнесът е в сутерена, а ресторантът е на първия етаж."},{"k":"B","g":"ask","q":"Попитайте в колко часа е закуската.","c":["What time","is","breakfast?"],"d":["What hour","are"],"b":"В колко часа е закуската?"},{"k":"C","g":"time","q":"You wake up at a quarter to ten. Can you still have breakfast?","o":["Yes, I have fifteen minutes.","No, it finished at nine.","Yes, I have an hour.","No, it starts at ten."],"b":"Събуждате се в десет без петнадесет. Още ли можете да закусите?"},{"k":"C"," од 24 има кафене, а тоалетните са до кафенето."}]},{"id":"daytrip","l":"2","t":"Еднодневна екскурзия","s":"Ферибот до острова","x":"You want to visit a small island for the day. The ferry leaves from the harbour at 9:00, 11:30 and 14:00, and the journey takes fifty minutes. The last ferry back from the island is at 18:30. On the island there is a lighthouse, a beach and a fish restaurant. The walk from the ferry to the lighthouse is three kilometres – about forty minutes. The restaurant is next to the beach and opens at noon.","y":"Искате да посетите малък остров за един ден. Фериботът тръгва от пристанището в 9:00, 11:30 и 14:00, а пътуването трае петдесет минути. Последният ферибот обратно от острова е в 18:30. На острова има фар, плаж и рибен ресторант. Пешеходният път от ферибота до фара е три километра – около четиридесет минути. Ресторантът е до плажа и отваря по обяд.","m":[],"lg":"","st":[{"k":"B","g":"ask","q":"Попитайте кога тръгва първият ферибот.","c":["What time","does the first ferry","leave?"],"d":["What hour","leaves"],"b":"В колко часа тръгва първият ферибот?"},{"k":"C","g":"time","q":"You take the 9:00 ferry. What time do you arrive on the island?","o":["at ten to ten","at ten o'clock","at half past nine","at nine fifty-five in the evening"],"b":"Взимате ферибота в 9:00. В колко часа пристигате на острова?"},{"k":"C","g":"time","q":"How far is the lighthouse from the ferry?","o":["three kilometres","forty kilometres","fifty minutes","three hundred metres"],"b":"Колко далеч е фарът от ферибота?"},{"k":"G","g":"time","q":"First we'll walk to the lighthouse, then we'll {have;having;had} lunch at the restaurant {when;until;while} it opens at noon.","b":"Първо ще отидем пеша до фара, после ще обядваме в ресторанта, когато отвори по обяд."},{"k":"C","g":"env","q":"Where is the restaurant?","o":["next to the beach","next to the lighthouse","at the harbour","on the ferry"],"b":"Къде е ресторантът?"},{"k":"C","g":"time","q":"What time is the last ferry back const dkey=n=>{const t=new Date(n*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`};
const act=n=>!!(S.days&&S.days[dkey(n)]);
const frz=n=>!!(S.frz&&S.frz[dkey(n)]);
const wk=n=>Math.floor((n+3)/7);            // Monday-based week
const weekFree=w=>!Object.keys(S.frz||{}).some(d=>S.frz[d]===1&&wk(dnum(d))===w);
function applyFreeze(){
  if(!S.frz||typeof S.frz!=='object')S.frz={};
  if(!S.fzw||typeof S.fzw!=='object')S.fzw={};
  S.fzb=Math.max(0,+S.fzb||0);
  const tn=tnum();
  // earn: +1 banked freeze for every finished Monday–Sunday week played on all 7 days
  let got=0;
  for(let w=wk(tn)-1;w>=wk(tn)-22;w--){
    if(S.fzw[w])continue;let all=true;
    for(let d=w*7-3;d<=w*7+3;d++)if(!act(d)){all=false;break}
    if(all){S.fzw[w]=1;S.fzb++;got++}
  }
  if(got)setTimeout(()=>{try{toast(got===1?'❄️ +1 замразяване за пълна седмица (7 от 7 дни)':`❄️ +${got} замразявания за пълни седмици`);renderStats()}catch(e){}},400);
  // use: bridge the days missed since the last played (or frozen) day, if there are enough freezes
  const miss=[];let d=tn-1;
  while(miss.length<60&&!act(d)&&!frz(d)){miss.push(d);d--}
  let used=false;
  if(miss.length&&miss.length<60&&(act(d)||frz(d))){
    const plan=[];let bank=S.fzb;const wUsed=new Set();
    for(const m of miss.slice().reverse()){
      const w=wk(m);
      if(weekFree(w)&&!wUsed.has(w)){plan.push([m,1]);wUsed.add(w)}
      else if(bank>0){plan.push([m,2]);bank--}
      else{plan.length=0;break}
    }
    if(plan.length===miss.length){plan.forEach(([m,t])=>{S.frz[dkey(m)]=t});S.fzb=bank;used=true}
  }
  const ks=Object.keys(S.frz).sort();if(ks.length>60)ks.slice(0,ks.length-60).forEach(x=>delete S.frz[x]);
  const ws=Object.keys(S.fzw).map(Number).sort((a,b)=>a-b);if(ws.length>60)ws.slice(0,ws.length-60).forEach(x=>delete S.fzw[x]);
  return used||!!got;
}

function resumeBar(tab,onNew){

  const done=r.kind==='quiz'?(r.res||[]).filter(x=>x!=null).length:r.kind==='case'?(r.res||[]).length:(r.done||r.placed||[]).length;
  const total=r.kind==='quiz'?r.items.length:r.kind==='case'?r.total:(r.kind==='board'?r.words.length:r.words.length);
  const fix=r.retry&&S.redo&&S.redo[tab];

/* ---------- generic matching board ---------- */
// left: [{id, node(el builder), ans(text shown when done), sub}], blocks: [{id,label,sub}]
function matchBoard(host,{left,blocks,pics,onDone,showSub,pre,errs0,onMatch,onErr}){
  let sel=null,armed=null,errors=errs0||0,done=0;
  const wrap=h('div',{class:'match'+(pics?'':' side')});
  const slots=h('div',{class:'slots'+(pics?' pics':'')});
  const pool=h('div',{class:'pool'});
  const bmap={};
  const fb=h('div',{class:'bar'},h('span',{id:'mstat'},`Съвпадения: 0 / ${left.length}`));
  function mark(slotEl,item,b){
    slotEl.classList.add('done');slotEl.classList.remove('ready');
    const ph=slotEl.querySelector('.ph');
    if(ph)ph.textContent=b.label;else{slotEl.append(h('span',{class:'ans'},b.label));}
    if(item.sub)slotEl.append(h('span',{class:'bg'},item.sub));
    b.el.disabled=true;b.el.classList.add('ok','gone');b.el.classList.remove('sel');
    done++;fb.firstChild.textContent=`Съвпадения: ${done} / ${left.length}`;
  }
  function place(slotEl,item,bid){
    if(slotEl.classList.contains('done'))return;
    const b=bmap[bid];if(!b)return;
    if(bid===item.id){
      mark(slotEl,item,b);onMatch&&onMatch(item.id,errors);
      rec(item.word,true);sel=null;clearReady();disarm();
      const nx=slots.querySelector('.slot:not(.done)');if(nx&&window.keepInView)window.keepInView(nx,pool);
      if(done===left.length)setTimeout(()=>onDone(errors),450);
    }else{
      errors++;onErr&&onErr(item.word,errors);rec(item.word,false);
      b.el.classList.add('bad');setTimeout(()=>b.el.classList.remove('bad'),400);
    }
  }
  function clearReady(){slots.querySelectorAll('.slot').forEach(s=>s.classList.remove('ready'))}
  /* row first: tap a row, then the word for it */
  function disarm(){if(armed){armed.s.classList.remove('armed');armed=null}pool.classList.remove('ready')}
  function arm(s,item){
    if(s.classList.contains('done'))return;
    if(armed&&armed.s===s){disarm();return}
    disarm();armed={s,item};s.classList.add('armed');pool.classList.add('ready');
  }
  const slotOf={};
  left.forEach(item=>{
    const s=h('div',{class:'slot'+(pics?'':' row'),tabindex:'0',role:'button'});slotOf[item.id]=s;
    item.node(s);
    const go=()=>{if(sel!=null){place(s,item,sel);return}arm(s,item)};
    s.addEventListener('click',go);
    s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    s.addEventListener('dragover',e=>{e.preventDefault();s.classList.add('over')});
    s.addEventListener('dragleave',()=>s.classList.remove('over'));
    s.addEventListener('drop',e=>{e.preventDefault();s.classList.remove('over');place(s,item,e.dataTransfer.getData('text/plain'))});
    slots.append(s);
  });
  shuffle(blocks).forEach(b=>{
    const el=h('button',{class:'tile',draggable:'true'},b.label,showSub&&b.sub?h('small',null,b.sub):null);
    el.addEventListener('click',()=>{if(el.disabled)return;
      if(armed){place(armed.s,armed.item,b.id);return}
      pool.querySelectorAll('.tile').forEach(t=>t.classList.remove('sel'));
      if(sel===b.id){sel=null;clearReady();return}sel=b.id;el.classList.add('sel');slots.querySelectorAll('.slot:not(.done)').forEach(s=>s.classList.add('ready'))});
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',b.id)});
    b.el=el;bmap[b.id]=b;pool.append(el);
  });
  wrap.append(slots,pool);host.append(wrap,fb);
  (pre||[]).forEach(id=>{const it=left.find(x=>x.id===id);if(it&&bmap[id])mark(slotOf[id],it,bmap[id])});
  if(left.length&&done===left.length)setTimeout(()=>onDone(errors),50);
}
/* end-of-round card: score, history line, retry of the mistakes */
function roundDone(host,{pct,line,again,retry,retryN,g}){
  const prev=g?S.log.filter(e=>e.g===g&&!e.r):[];
  const best=prev.length?Math.max(...prev.map(e=>e.p)):null;
  const left=Math.max(0,(S.goal||100)-(S.days[today()]||0));
  host.replaceChildren(h('div',{class:'done-card'},
    h('div',{class:'big'},pct+'%'),
    h('div',null,line),
    best!=null&&prev.length>1?h('div',{class:'sub'},`Най-добър резултат тук: ${best}% · рундове: ${prev.length}`):null,
    h('div',{class:'sub'},left?`До дневната цел остават ${left} отговора.`:'Дневната цел е изпълнена. Браво!'),
    retry&&retryN?h('button',{class:'btn rose',onclick:retry},`Повтори грешките (${retryN})`):null,
    h('button',{class:'btn'+(retry&&retryN?' alt':' rose'),onclick:again},'Нов рунд')));
  host.querySelector('.done-card .btn').focus();
}
/* board rounds (pictures, categories): wrong words come back as quick word questions */
function boardDone(host,tab,correct,errors,missed,again){

  delete S.run[tab];
  S.log.push({d:today(),ts:Date.now(),g:tab,c:correct,n:correct+errors,p:pct,l:S.lvl,r:0});
  if(S.log.length>120)S.log=S.log.slice(-120);save();renderTabs();
  const words=[...new Set(missed)].filter(w=>byEn[w]);window.__RW=words.map(w=>({k:'word',w}));
  roundDone(host,{pct,g:tab,again,
    line:errors===0?'Без нито една грешка. Браво!':`Грешни опити: ${errors}. Сбърканите думи отиват в „Преговор и грешки".`,
    retryN:words.length,retry:()=>startQuiz(host,tab,words.map(w=>({k:'word',w})),again,true)});
}

function distractors(ans,n){
  const e=(byEn[ans]||[])[0];if(!e)return [];
  const c=V.filter(v=>v.pos===e.pos&&v.en!==ans&&v.t!==e.t&&!v.en.includes(' ')===!ans.includes(' ')&&Math.abs(LV.indexOf(v.l)-LV.indexOf(e.l))<=1);
  return sample([...new Set(c.map(v=>v.en))],n);
}
/* Saved question rounds. A round is a list of plain task descriptions ("specs"),
   kept in S.run[tab] with one result per task, so it can be picked up after the app closes. */
function startQuiz(host,tab,items,again,retry){
  if(!items.length){host.replaceChildren(h('p',{class:'empty'},'Няма задачи за този рунд.'));return}
  S.run[tab]={kind:'quiz',items,res:[],retry:retry?1:0,t0:Date.now()};save();renderTabs();
  runQuiz(host,tab,again);
}
function resumeQuiz(host,tab,again){runQuiz(host,tab,again)}
function runQuiz(host,tab,again){
  const R=S.run[tab];const N=()=>R.items.length;
  const orig=j=>R.items[j]&&R.items[j].sc==null;   // second-chance copies do not count towards the score
  const bar=h('div',{class:'bar'});const card=h('div');host.replaceChildren(bar,card);
  const cnt=()=>R.res.filter((x,j)=>x===true&&orig(j)).length;
  const cur=()=>{let i=0;while(i<N()&&R.res[i]!=null)i++;return i};
  const upd=i=>bar.replaceChildren(h('span',null,`Въпрос ${Math.min(i+1,N())} / ${N()}`),h('div',{class:'prog'},h('i',{style:`width:${100*i/N()}%`})),h('span',null,`Верни: ${cnt()}`));
  const next=()=>{
    if(S.run[tab]!==R)return;
    const i=cur();
    if(i>=N()){
      const c=cnt();const fixedLater=j=>R.items.some((x,k)=>x.sc===j&&R.res[k]===true);
      const wrong=R.items.filter((x,j)=>R.res[j]===false&&orig(j)&&!fixedLater(j));
      const skN=R.res.filter((x,j)=>x==='skip'&&orig(j)).length,M=R.items.filter((_,j)=>orig(j)).length-skN;   // skipped listening tasks do not count
      if(MUSTFIX.includes(tab)){if(wrong.length)S.redo[tab]=wrong;else if(R.retry)delete S.redo[tab]}
      delete S.run[tab];
      if(!M){save();renderTabs();host.replaceChildren(h('div',{class:'done-card'},h('div',{class:'big'},'🔇'),h('div',null,'Всички задачи в този рунд бяха за слушане и ги пропуснахте.'),h('button',{class:'btn rose',onclick:again},'Нов рунд')));return}
      window.__RW=wrong;
      const p=logSession(tab,c,M,R.retry);
      const skT=skN?` Пропуснати задачи за слушане: ${skN}.`:'';
      if(MUSTFIX.includes(tab)&&wrong.length){redoDone(host,tab,p,c,M,R.retry,again);return}
      roundDone(host,{pct:p,g:tab,again,
        line:(c===M?'Всички задачи са верни. Браво!':`Верни: ${c} от ${M}. Сбърканите задачи отиват в „Преговор и грешки".`)+skT,
        retryN:wrong.length,retry:()=>startQuiz(host,tab,wrong,again,true)});
      return;
    }
    upd(i);card.replaceChildren();
    let answered=false;
    renderSpec(R.items[i],card,ok=>{if(answered)return;answered=true;R.res[i]=ok==='skip'?'skip':!!ok;
      /* instant second chance: a wrong answer comes back 3–5 tasks later in the same round */
      const sp=R.items[i];
      if(ok===false&&sp.sc==null&&!R.retry&&SC_KINDS.includes(sp.k)&&R.items.filter(x=>x.sc!=null).length<6){
        const at=Math.min(R.items.length,i+3+Math.floor(Math.random()*3));R.items.splice(at,0,Object.assign({},sp,{sc:i}));R.res.length=Math.min(R.res.length,at);}
      save()},next);
  };
  next();
}
const SC_KINDS=['word','fill','fam','syn','trans','multi','lp','lm','ln','ld','lf'];

function renderSpec(sp,card,score,next){

  q.append(h('div',{class:'kind'},(sp.sc!=null?'🔁 Втори шанс · ':'')+(KINDS[sp.k]||'')));

    else if(sp.k==='dlg'){const g=DATA.G[sp.i];g?rDlg(g,q,score,next):gone()}
    else if(sp.k==='fill'){const f=DATA.F[sp.i];f?rFill(f,q,score,next,typed):gone()}

    else if(sp.k==='multi'){const m=DATA.M[sp.i];m?rMulti(m,q,score,next):gone()}
    else if(sp.k==='word'){const v=byEn[sp.w]&&byEn[sp.w][0];v?rWord(v,q,score,next):gone()}
    else if(sp.k==='det'){const c=DATA.K.find(x=>x.id===sp.c);c&&c.q[sp.q]?rDetSpec(c,sp.q,q,score,next):gone()}
    else if(sp.k==='tour'){const c=DATA.TO.find(x=>x.id===sp.c);c&&c.st[sp.s]?rTourSpec(c,sp.s,q,score,next):gone()}

        let sk=null;const sc=ok=>{if(sk)sk.remove();score(ok)};
        LREND[sp.k](sp,q,sc,next);

function specOf(k){
  let m;
  if(!k.startsWith('§'))return byEn[k]?{k:'word',w:k}:null;
  if(m=k.match(/^§F(\d+)$/))return DATA.F[+m[1]]?{k:'fill',i:+m[1]}:null;
  if(m=k.match(/^§W(\d+)\|(\d+)$/))return DATA.W[+m[1]]&&DATA.W[+m[1]].i[+m[2]]?{k:'fam',i:+m[1],j:+m[2]}:null;
  if(m=k.match(/^§T(\d+)$/))return DATA.TR[+m[1]]?{k:'trans',i:+m[1]}:null;
  if(m=k.match(/^§M(\d+)$/))return DATA.M[+m[1]]?{k:'multi',i:+m[1]}:null;
  if(k.startsWith('§Y')){const x=k.slice(2).split('|');return x.length===4?{k:'syn',x}:null}
  if(k.startsWith('§G')){const i=DATA.G.findIndex(g=>g.id===k.slice(2));return i>=0?{k:'dlg',i}:null}
  if(m=k.match(/^§K(.+)\|(\d+)$/)){const c=DATA.K.find(x=>x.id===m[1]);return c&&c.q[+m[2]]?{k:'det',c:m[1],q:+m[2]}:null}
  if(m=k.match(/^§O(.+)\|(\d+)$/)){const c=DATA.TO.find(x=>x.id===m[1]);return c&&c.st[+m[2]]?{k:'tour',c:m[1],s:+m[2]}:null}
  if(k.startsWith('§L'))return lSpec(k);
  return null;
}

function tourStep(c,i,q,done){

        q.append(h('div',{class:'sent'},st.q),bgBtn,bgEl);
        const pool=h('div',{class:'pool col'});
        shuffle(st.o).forEach(o=>{const t=h('button',{class:'tile'},o);t.addEventListener('click',()=>{
          const ok=o===st.o[0];pool.querySelectorAll('.tile').forEach(x=>x.disabled=true);t.classList.add(ok?'ok':'bad');
          if(!ok)pool.querySelectorAll('.tile').forEach(x=>{if(x.textContent===st.o[0])x.classList.add('ok')});

        q.append(pool);
      }else if(st.k==='B'){
        q.append(h('div',{class:'sent'},st.q),bgBtn,bgEl);
        const line=h('div',{class:'build'});const pool=h('div',{class:'pool'});const ph=h('span',{class:'bph'},'Докоснете блокчетата отдолу');line.append(ph);
        const upd=()=>{ph.hidden=line.querySelectorAll('.tile').length>0};let fin=false;
        shuffle([...st.c,...st.d]).forEach(w=>{const t=h('button',{class:'tile'},w);t.addEventListener('click',()=>{if(fin)return;if(t.parentNode===pool)line.append(t);else pool.append(t);upd()});pool.append(t)});
        const check=h('button',{class:'btn',onclick:()=>{if(fin)return;const got=[...line.querySelectorAll('.tile')].map(x=>x.textContent);if(!got.length)return;fin=true;
          const ok=got.join(' ')===st.c.join(' ');line.classList.add(ok?'ok':'bad');q.querySelectorAll('.tile').forEach(x=>x.disabled=true);check.disabled=true;clr.disabled=true;
          q.append(h('div',{class:'fb '+(ok?'ok':'bad')},h('span',{class:'h'},ok?'Вярно!':'Не съвсем.'),h('span',null,'Правилно: ',h('b',null,st.c.join(' '))),h('span',{class:'tr'},st.b)));done(ok)}},'Провери');
        const clr=h('button',{class:'btn alt',onclick:()=>{if(fin)return;line.querySelectorAll('.tile').forEach(x=>pool.append(x));upd()}},'Изчисти');
        q.append(line,pool,h('div',{class:'typerow'},check,clr));
      }else{
        const parts=parseLine(st.q);const sent=h('div',{class:'sent long'});const gaps=[];
        parts.forEach(pt=>{if(typeof pt==='string')sent.append(pt);else{const g=h('span',{class:'gap'},' ? ');gaps.push({el:g,o:pt});sent.append(g)}});
        q.append(sent,bgBtn,bgEl);const pool=h('div',{class:'pool'});q.append(pool);
        let gi=0,wrong=0;
        const step=()=>{
          if(gi>=gaps.length){pool.remove();const ok=wrong===0;
            q.append(h('div',{class:'fb '+(ok?'ok':'bad')},h('span',{class:'h'},ok?'Всички места са верни!':`Грешни места: ${wrong} от ${gaps.length}.`),h('span',null,'Правилно: ',h('b',null,fillAll(st.q))),h('span',{class:'tr'},st.b)));done(ok);return}
          const {el,o}=gaps[gi];el.classList.add('cur');
          pool.replaceChildren(...shuffle(o).map(w=>{const t=h('button',{class:'tile'},w);t.addEventListener('click',()=>{
            const ok=w===o[0];pool.querySelectorAll('.tile').forEach(x=>x.disabled=true);t.classList.add(ok?'ok':'bad');
            if(!ok){wrong++;pool.querySelectorAll('.tile').forEach(x=>{if(x.textContent===o[0])x.classList.add('ok')})}
            el.textContent=o[0];el.classList.remove('cur');el.classList.add(ok?'ok':'bad');gi++;setTimeout(step,ok?350:1100)});return t}));

      }

const MTYPE=[['all','Всички'],['word','Думи'],['sent','Изречения'],['dlg','Диалози'],['det','Детектив'],['tour','Турист']];
const typeOf=sp=>sp.k[0]==='l'?'lis':sp.k==='word'?'word':sp.k==='det'?'det':sp.k==='tour'?'tour':sp.k==='dlg'?'dlg':'sent';
function describe(sp){
  try{
    if(sp.k[0]==='l')return lDescribe(sp);
    if(sp.k==='word'){const v=byEn[sp.w][0];return {a:v.en,b:v.bg,em:v.em}}
    if(sp.k==='fill'){const f=DATA.F[sp.i];return {a:f[2].replace('___',f[3]),b:f[5]}}
    if(sp.k==='fam'){const it=DATA.W[sp.i].i[sp.j];return {a:it[2].replace('___',it[0]),b:it[3]}}
    if(sp.k==='syn'){const x=sp.x;return {a:`${x[0]} – ${x[1]}`,b:x[3]==='syn'?'синоними':'антоними'}}
    if(sp.k==='trans'){const t=DATA.TR[sp.i];return {a:`${t[3]} → ${t[4]}`,b:t[6]}}
    if(sp.k==='multi'){const m=DATA.M[sp.i];return {a:fillAll(m[2]),b:m[3]}}
    if(sp.k==='dlg'){const g=DATA.G[sp.i];return {a:'Диалог: '+g.t,b:g.d}}
    if(sp.k==='det'){const c=DATA.K.find(x=>x.id===sp.c);const q=c.q[sp.q];return {a:`${q[1]} → ${q[2][0]}`,b:'Досие: '+c.t}}
    if(sp.k==='tour'){const c=DATA.TO.find(x=>x.id===sp.c);const st=c.st[sp.s];
      return {a:st.k==='C'?`${st.q} → ${st.o[0]}`:st.k==='B'?st.c.join(' '):fillAll(st.q),b:'Ситуация: '+c.t}}
  }catch(e){}
  return {a:'',b:''};
}

function ttsLoad(){

  const two=TTS.v.length>1;const v=TTS.v[o.voice&&two?1:0];const ch=ttsChunks(t);let k=0;

  const nx=()=>{if(g!==TTS.gen)return;if(k>=ch.length){done();return}

function lSpec(k){
  const x=k.slice(2).split('|');
  if(x[0]==='p')return byEn[x[1]]&&byEn[x[1]].some(v=>v.em)?{k:'lp',w:x[1]}:null;
  if(x[0]==='m')return MP[+x[1]]?{k:'lm',i:+x[1],j:+x[2]?1:0}:null;
  if(x[0]==='n')return x.length>=3&&LNN[x[1]]?{k:'ln',t:x[1],a:x[2],c:x[3]||''}:null;
  if(x[0]==='d')return DATA.F[+x[1]]?{k:'ld',i:+x[1]}:null;
  if(x[0]==='f')return DATA.D[+x[1]]?{k:'lf',i:+x[1]}:null;
  return null;
}
function lDescribe(sp){

  if(sp.k==='lm'){const m=MP[sp.i];return {a:m[0]+' / '+m[1],b:`Слушане · чухте „${m[sp.j]}"`}}

  document.addEventListener('focusin',e=>{if(typing(e.target))document.body.classList.add('kb')});
  document.addEventListener('focusout',()=>setTimeout(()=>{if(!typing(document.activeElement))document.body.classList.remove('kb')},120));

  const later=()=>{if(window.dockLater)window.dockLater()};   /* pinned button: replaced by the v3 action dock */
  /* ---------- 6. progress backup: export / import ---------- */
  const PFX='INSH1:';
  const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
  const unb64=s=>Uint8Array.from(atob(s.replace(/\s+/g,'')),c=>c.charCodeAt(0));
  async function pipe(u8,Stream){const st=new Blob([u8]).stream().pipeThrough(new Stream('gzip'));return new Uint8Array(await new Response(st).arrayBuffer())}
  function pack(){S.bk=Date.now();save();return JSON.stringify({app:'Инглишко на шиш',v:1,saved:new Date().toISOString(),state:S})}
  async function toCode(json){
    const raw=new TextEncoder().encode(json);
    if(typeof CompressionStream==='function'){try{return PFX+b64(await pipe(raw,CompressionStream))}catch(e){}}
    return 'INSH0:'+b64(raw);
  }
  async function readAny(txt){
    txt=(txt||'').trim();let json=txt;
    if(txt.startsWith(PFX)){if(typeof DecompressionStream!=='function')throw new Error('old');json=new TextDecoder().decode(await pipe(unb64(txt.slice(PFX.length)),DecompressionStream))}
    else if(txt.startsWith('INSH0:'))json=new TextDecoder().decode(unb64(txt.slice(6)));
    const o=JSON.parse(json);const st=o&&o.state&&typeof o.state==='object'?o.state:o;
    if(!st||typeof st!=='object'||typeof st.xp!=='number'||typeof st.days!=='object'||typeof st.w!=='object')throw new Error('shape');
    return {st,when:o.saved||(st.ts?new Date(st.ts).toISOString():null)};
  }
  const fmtD=iso=>{try{const d=new Date(iso);return `${d.getDate()}.${pad(d.getMonth()+1)}.${d.getFullYear()} г., ${pad(d.getHours())}:${pad(d.getMinutes())}`}catch(e){return ''}};
  const ago=t=>{const n=Math.floor((Date.now()-t)/864e5);return n<=0?'днес':n===1?'вчера':`преди ${n} дни`};
  async function saveFile(name,text){
    try{const c=window.claude;if(c&&c.use){const d=await c.use('downloads');if(d){await d.save({filename:name,data:text});return 'ok'}}}
    catch(e){if(e&&e.code==='declined')return 'declined';if(!(e&&/unavailable|not_granted|capability/.test(e.code||'')))return 'err'}
    try{const u=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'ok'}
    catch(e){return 'err'}
  }
  function backupSection(){
    const last=h('span',{class:'bklast'+(!S.bk||Date.now()-S.bk>7*864e5?' old':'')},S.bk?`Последно копие: ${ago(S.bk)}.`:'Още не сте правили копие.');
    const out=h('div',{class:'bkbtns'});out.hidden=true;
    const outBox=h('textarea',{class:'bkcode',readonly:true,'aria-label':'Код на копието',rows:'4'});outBox.hidden=true;
    const outMsg=h('p',{class:'bkinfo',role:'status'});outMsg.hidden=true;
    const say=(el,t,bad)=>{el.textContent=t;el.classList.toggle('bad',!!bad);el.hidden=false};
    const fileBtn=h('button',{class:'btn rose',type:'button',onclick:async()=>{
      const name=`inglishko-napredak-${today()}.json`;const r=await saveFile(name,pack());
      last.textContent='Последно копие: днес.';last.classList.remove('old');
      if(r==='ok')say(outMsg,`Файлът „${name}" е запазен (обикновено в папка „Изтегляния"). Пазете го на сигурно място – например изпратете го на себе си по имейл.`);
      else if(r==='declined')say(outMsg,'Запазването е отказано. Можете да опитате отново или да използвате „Покажи код".',true);
      else say(outMsg,'Файлът не можа да се запази тук. Използвайте „Покажи код" и копирайте кода.',true)}},'💾 Изтегли файл');
    const copyBtn=h('button',{class:'btn alt',type:'button',onclick:async()=>{
      try{await navigator.clipboard.writeText(outBox.value);say(outMsg,'Кодът е копиран. Поставете го някъде на сигурно (бележка, имейл, чат със себе си).')}
      catch(e){outBox.focus();outBox.select();say(outMsg,'Задръжте пръст върху кода → „Избери всички" → „Копирай".',true)}}},'📋 Копирай');
    const shareBtn=navigator.share?h('button',{class:'btn alt',type:'button',onclick:async()=>{try{await navigator.share({title:'Инглишко на шиш – копие',text:outBox.value})}catch(e){}}},'📤 Сподели'):null;
    out.append(...[copyBtn,shareBtn].filter(Boolean));
    const codeBtn=h('button',{class:'btn alt',type:'button',onclick:async()=>{
      outBox.value='…';outBox.hidden=false;outBox.value=await toCode(pack());out.hidden=false;
      last.textContent='Последно копие: днес.';last.classList.remove('old');
      say(outMsg,`Кодът съдържа целия напредък (${outBox.value.length.toLocaleString('bg-BG')} знака). Копирайте го и го пазете.`)}},'🔑 Покажи код');
    /* restore */
    let pending=null;
    const inBox=h('textarea',{class:'bkcode',placeholder:'Поставете кода тук (започва с INSH1:)…','aria-label':'Код за възстановяване',rows:'3'});
    const inMsg=h('p',{class:'bkinfo',role:'status'});inMsg.hidden=true;

    const apply=armBtn('Замени напредъка с копието','Сигурни ли сте? Натиснете отново',()=>{
      if(!pending)return;const keepOpt=S.opt;
      S=Object.assign(DEF(),pending.st);if(!S.opt)S.opt=keepOpt;S.tab='prog';
      try{migrate()}catch(e){}save();renderAll();

      const m=$('#panel .bkrest');if(m){m.textContent=`Възстановено копие от ${fmtD(pending.when)||'файл'}.`;m.hidden=false}

    apply.classList.add('danger');apply.hidden=true;
    async function check(txt){
      pending=null;apply.hidden=true;
      try{const r=await readAny(txt);pending=r;
        const learned=Object.values(r.st.w||{}).filter(x=>x>=2).length,days=Object.keys(r.st.days||{}).length;
        say(inMsg,`Копие${r.when?' от '+fmtD(r.when):''}: ${r.st.xp} точки, ${learned} научени думи, ${days} дни с упражнения. Ако го заредите, сегашният напредък (${S.xp} точки) ще бъде заменен.`);
        apply.hidden=false}
      catch(e){say(inMsg,e&&e.message==='old'?'Този браузър не може да отвори компресиран код. Използвайте файла.':'Това не прилича на копие от „Инглишко на шиш". Проверете дали сте поставили целия код.',true)}
    }
    fileIn.addEventListener('change',async()=>{const f=fileIn.files&&fileIn.files[0];if(!f)return;inBox.value='';await check(await f.text());fileIn.value=''});
    const pickBtn=h('button',{class:'btn alt',type:'button',onclick:()=>fileIn.click()},'📂 Избери файл');
    const codeIn=h('button',{class:'btn alt',type:'button',onclick:()=>check(inBox.value)},'Прочети кода');
    const restMsg=h('p',{class:'rmsg bkrest',role:'status'});restMsg.hidden=true;
    return h('section',{class:'sect rsect bksect'},h('details',{class:'bkdet'},
      h('summary',null,h('span',{class:'bkpill'},'💾 Резервно копие'),last),
      h('div',{class:'rrow bkrow'},
        h('div',{class:'rtxt'},h('strong',null,'Запази копие'),
          h('span',null,'Целият напредък – точки, дни подред, научени думи, грешки, история и незавършени рундове – във файл или като код. Така го пренасяте на друг телефон или в друга версия на програмата.')),
        h('div',{class:'bkbtns'},fileBtn,codeBtn),outBox,out,outMsg),
      h('div',{class:'rrow bkrow'},
        h('div',{class:'rtxt'},h('strong',null,'Възстанови от копие'),
          h('span',null,'Изберете запазения файл или поставете кода. Напредъкът на това устройство ще бъде заменен с копието.')),
        h('div',{class:'bkbtns'},pickBtn,fileIn),inBox,h('div',{class:'bkbtns'},codeIn,apply),inMsg)),
      restMsg);
  }
  /* ---------- 2. exercise first ---------- */
  if(opt('help',false))document.body.classList.add('help-open');
  function decorate(){
    const open=document.body.classList.contains('help-open');
    document.querySelectorAll('#panel .phead').forEach(ph=>{
      if(ph.querySelector('.helpbtn'))return;
      const scope=ph.parentElement;
      const has=ph.querySelector('p')||(scope&&scope.querySelector('.how,.chain'));
      if(!has)return;
      ph.append(h('button',{type:'button',class:'helpbtn','aria-expanded':open?'true':'false',onclick:()=>{
        const v=!document.body.classList.contains('help-open');document.body.classList.toggle('help-open',v);setOpt('help',v);
        document.querySelectorAll('#panel .helpbtn').forEach(b=>b.setAttribute('aria-expanded',v?'true':'false'));
        if(v){const how=$('#panel .how');if(how){try{how.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}}
        later()}},h('span',{class:'hi','aria-hidden':'true'},'ⓘ'),'Как се играе'))});
    if(!document.body.classList.contains('help-open'))document.querySelectorAll('#panel .clist').forEach(cl=>{
      const cur=cl.querySelector('.cstep.cur');if(cur&&cl.scrollWidth>cl.clientWidth){const x=cur.offsetLeft-cl.offsetLeft-24;if(Math.abs(cl.scrollLeft-x)>4)cl.scrollLeft=Math.max(0,x)}});
  }
  new MutationObserver(()=>decorate()).observe($('#panel'),{childList:true,subtree:true});
  decorate();
  const _gpp=gProgPlus;
  gProgPlus=function(p){_gpp(p);const r=p.querySelector('.rsect');p.insertBefore(backupSection(),r||null)};

  later();
})();

<script>
/* ===== phone layout v2: haptics on answers, keep feedback in view ===== */
(function(){
  const MQ=window.matchMedia('(max-width:700px)');
  const panel=document.getElementById('panel');if(!panel)return;
  const muted=()=>!!document.querySelector('.stat.sfx.off');
  let lastBuzz=0;
  const buzz=pat=>{if(!MQ.matches||muted()||!navigator.vibrate)return;const t=Date.now();if(t-lastBuzz<120)return;lastBuzz=t;try{navigator.vibrate(pat)}catch(e){}};
  const isBad=el=>el.classList&&(el.classList.contains('bad'))&&el.matches('.tile,.slot,.spot,.opt,.fb,.gap,.build,.bin');
  const isOk=el=>el.classList&&el.matches('.fb.ok,.slot.done,.spot.done,.opt.ok,.gap.ok,.build.ok');
  let toScroll=null,raf=0;
  function scrollFb(){raf=0;const fb=toScroll;toScroll=null;if(!fb||!fb.isConnected||!MQ.matches||fb.closest('.dock'))return;
    const r=fb.getBoundingClientRect(),nav=document.querySelector('.bnav'),navH=nav?nav.getBoundingClientRect().height:0;
    if(r.bottom>window.innerHeight-navH-70||r.top<0){try{fb.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}}
  new MutationObserver(ms=>{
    for(const m of ms){
      const el=m.target;
      if(m.type==='attributes'){
        const was=m.oldValue||'';
        if(isBad(el)&&!/\bbad\b/.test(was))buzz([30,60,30]);
        else if(isOk(el)&&!/\b(ok|done)\b/.test(was))buzz(15);
        if(el.matches&&el.matches('.fb')&&!el.hidden){toScroll=el}
      }else{
        m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;
          const fb=n.matches('.fb')?n:n.querySelector&&n.querySelector('.fb');
          if(fb&&!fb.hidden){toScroll=fb;if(fb.classList.contains('bad'))buzz([30,60,30]);else if(fb.classList.contains('ok'))buzz(15)}});
      }
    }
    if(toScroll&&!raf)raf=requestAnimationFrame(()=>requestAnimationFrame(scrollFb));
  }).observe(panel,{subtree:true,childList:true,attributes:true,attributeFilter:['class','hidden'],attributeOldValue:true});
})();
</script>

  .dbar[hidden]{display:none}
  body.dockon:not(.kb) #panel .docked{display:none!important}
  .thero{grid-template-columns:auto 1fr;padding:14px}
}

<script>
/* ===== v4 ===== */
(function(){
  /* ---------- pastel theme ---------- */
  const metas=[...document.querySelectorAll('meta[name="theme-color"]')];
  const orig=metas.map(m=>m.getAttribute('content'));
  function applyPastel(){
    const on=opt('pastel',false);
    if(on)document.documentElement.setAttribute('data-pastel','1');
    else document.documentElement.removeAttribute('data-pastel');
    metas.forEach((m,i)=>m.setAttribute('content',on?'#FFF8E3':orig[i]));
  }
  applyPastel();
  const _gp=gProgPlus;
  gProgPlus=function(p){
    _gp(p);
    const sec=h('section',{class:'sect'},h('h3',null,'Външен вид'),
      h('p',{class:'muted'},'По подразбиране програмата следва тъмния или светлия режим на телефона. Пастелната тема е мека светла тема в жълто, зелено, коралово и светлосиньо.'),
      h('div',{class:'opts'},toggle('pastelSw','Пастелна тема','pastel',false,()=>{applyPastel();renderPanel()})));
    const first=p.querySelector('.bksect')||p.querySelector('.rsect');
    p.insertBefore(sec,first||null);
  };

  /* ---------- app-icon shortcuts: ?go=today | miss | cards ---------- */
  try{
